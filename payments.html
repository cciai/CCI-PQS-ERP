<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCI Payments — Approvals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#1B2A4A; --navy-2:#16233D; --paper:#FAF8F5; --paper-2:#F2EFE8; --line:#D8D2C6;
  --ink:#1B2A4A; --steel:#6B7A92; --amber:#C97C4A; --green:#3F8F63; --red:#C1453A; --blue:#2F6DB5;
  --grid:rgba(255,255,255,0.045);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Barlow',sans-serif;color:var(--ink);background:var(--paper);font-size:14px;-webkit-text-size-adjust:100%}
.mono{font-family:'IBM Plex Mono',monospace}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;margin:0;letter-spacing:.01em}
h2{font-size:22px;font-weight:700} h3{font-size:17px;font-weight:600}
.hdr{background:var(--navy);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:#EDEBE3;padding:12px 18px 0;position:sticky;top:0;z-index:20}
.hdr .top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em}
.brand small{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:400;opacity:.65;letter-spacing:.1em;text-transform:uppercase}
.who{font-size:12.5px;opacity:.9;display:flex;gap:10px;align-items:center}
.who .role{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;background:rgba(255,255,255,.12);padding:3px 8px;border-radius:4px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;color:#cfd5e2;padding:10px 14px;font:600 13px 'Barlow',sans-serif;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:var(--amber)}
.tab .n{background:var(--amber);color:#fff;border-radius:9px;padding:1px 7px;font-size:11px;margin-left:5px}
main{max-width:1280px;margin:0 auto;padding:18px 16px 80px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card.flag{border-left:4px solid var(--amber)}
.card.dev{border-left:4px solid var(--red)}
.card.ok{border-left:4px solid var(--green)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);font-weight:600}
.kpi .v{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:700;line-height:1.15}
.kpi .s{font-size:12px;color:var(--steel)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid #EEE9DE;vertical-align:top}
tr:hover td{background:#FCFBF8}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:7px;font:600 13px 'Barlow',sans-serif;cursor:pointer;color:var(--ink)}
.btn:hover{background:#FBFAF6}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.p:hover{background:#243759}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.a{background:var(--amber);color:#fff;border-color:var(--amber)}
.btn.s{padding:4px 9px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.b-draft{background:#E8E5DC;color:#555}.b-submitted{background:#FCEBD5;color:#9A5A1E}.b-approved{background:#DCEFE3;color:#2B6B47}
.b-batched,.b-open{background:#DDE8F6;color:#2B5C94}.b-verified{background:#CFE7F2;color:#1F6384}.b-released{background:#E6DDF3;color:#5B3F8A}
.b-paid,.b-completed{background:#C9E8D5;color:#1D6140}.b-rejected,.b-cancelled{background:#F4D8D5;color:#9A2F27}
.b-dev{background:var(--red);color:#fff}.b-green{background:#DCEFE3;color:#2B6B47}.b-warn{background:#FCEBD5;color:#9A5A1E}
.good{color:var(--green);font-weight:600}.bad{color:var(--red);font-weight:600}.mut{color:var(--steel)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#8B8676;margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font:14px 'Barlow',sans-serif;background:#fff;color:var(--ink)}
input[type=checkbox],input[type=radio]{width:auto}
textarea{min-height:60px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}.hide-m{display:none}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;font:600 12px 'Barlow',sans-serif;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.note{background:#FFF7E8;border:1px solid #F0D9A8;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.note.red{background:#FCEDEB;border-color:#EBC0BB}.note.blue{background:#EAF1FA;border-color:#BCD1EA}
.gate{border-radius:8px;padding:10px 12px;font-size:13px;margin:8px 0 12px}
.gate.ok{background:#E6F3EB;border:1px solid #BFDDCB}.gate.dev{background:#FCEDEB;border:1px solid #EBC0BB}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:92vw}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 22px rgba(0,0,0,.25)}
.toast.err{background:var(--red)}
.ovl{position:fixed;inset:0;background:rgba(15,25,45,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.modal{background:var(--paper);border-radius:12px;padding:20px;width:760px;max-width:100%;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal h2{margin-bottom:12px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--navy);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.login .box{background:var(--paper);border-radius:14px;padding:34px 32px;width:380px;max-width:94vw}
.err{background:rgba(193,69,58,.1);border:1px solid rgba(193,69,58,.35);color:var(--red);padding:9px 11px;border-radius:8px;margin-bottom:12px;font-size:13px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .it{margin-bottom:10px;position:relative}.tl .it:before{content:'';position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--amber)}
.pgrp{margin:18px 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.pgrp .nm{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700}
.amt{font-family:'IBM Plex Mono',monospace;font-weight:500}
.big{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.kv span:nth-child(odd){color:var(--steel)}
.empty{padding:28px;text-align:center;color:var(--steel)}
details>summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal-root"></div>

<script>
'use strict';
/* =====================================================================
   CCI Payments — Approvals module (runs on the CAMELS Supabase project)
===================================================================== */
const SUPABASE_URL = 'https://jtbmrohjrsnoxcgcmmls.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0Ym1yb2hqcnNub3hjZ2NtbWxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDM4OTEsImV4cCI6MjEwMjcxOTg5MX0.Fy1gRJkj3MLnJBmbonNpMKnfNyJx9Fzq49xbaC8pDK4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => Number(v || 0);
const inr = v => '₹' + num(v).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const inr0 = v => '₹' + Math.round(num(v)).toLocaleString('en-IN');
const fdate = d => { if (!d) return '—'; const x = new Date(String(d).length === 10 ? d + 'T00:00:00' : d); return x.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); };
const fdt = d => d ? new Date(d).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' }) : '—';
const todayISO = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date());
const daysSince = d => (Date.now() - new Date(d).getTime()) / 86400000;
const cleanErr = e => String((e && e.message) || e || 'Something went wrong').replace(/^.*ERROR:\s*/, '').replace(/\s*CONTEXT:.*$/s, '');
async function rpc(name, args) { const { data, error } = await sb.rpc(name, args || {}); if (error) throw new Error(cleanErr(error)); return data; }
async function qry(p) { const { data, error } = await p; if (error) throw new Error(cleanErr(error)); return data; }
function toast(msg, isErr) {
  const t = document.createElement('div'); t.className = 'toast' + (isErr ? ' err' : ''); t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), isErr ? 7000 : 3200);
}
async function guard(fn) { try { return await fn(); } catch (e) { toast(cleanErr(e), true); console.error(e); } }
function download(name, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/plain' }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

const STATUS_LABEL = { draft: 'Draft', submitted: 'With CEO', approved: 'Approved', rejected: 'Rejected', batched: 'In batch', verified: 'Verified', released: 'At bank', paid: 'Paid', cancelled: 'Cancelled' };
const BLABEL = { open: 'Open', submitted: 'With JH', verified: 'Verified', released: 'At bank', completed: 'Completed', cancelled: 'Cancelled' };
const BCLS = { open: 'draft', completed: 'paid' };
const badgeB = s => `<span class="badge b-${esc(BCLS[s] || s)}">${esc(BLABEL[s] || s)}</span>`;
const badge = s => `<span class="badge b-${esc(s)}">${esc(STATUS_LABEL[s] || s)}</span>`;
const DEV_REASONS = { client_inflow_delayed: 'Client inflow delayed', statutory_due: 'Statutory dues (GST/PF/ESI/TDS)', wages_critical: 'Labour wages critical', material_critical: 'Material critical for progress', advance_to_secure: 'Advance to secure rate/supply', other: 'Other (explain)' };
const CATS = { labour: 'Labour', material: 'Material', subcontract: 'Subcontract', equipment: 'Equipment / rental', statutory: 'Statutory', overhead: 'Overhead', other: 'Other' };

/* ---------- state ---------- */
const S = {
  me: null, tab: '', banks: [], settings: {}, pos: [], reqs: [], batches: [], payees: [], projects: [], audit: [], users: [],
  receipts: [], adjustments: [], openings: [],
  ui: { status: 'all', project: '', q: '', sel: new Set(), bsel: new Set(), panel: {}, openBatch: null, pdec: {}, utr: {}, auditQ: '', bankPick: '', payDate: '', payeeQ: '' }
};
const role = () => S.me && S.me.role;
const isOwner = () => role() === 'owner';
const canRaise = () => role() === 'owner' || role() === 'accounts';
const bankOf = id => S.banks.find(b => b.id === id);
const payeeOf = id => S.payees.find(p => p.id === id);
const batchOf = id => S.batches.find(b => b.id === id);
const posOf = id => S.pos.find(p => p.project_id === id);
const linesOf = bid => S.reqs.filter(r => r.batch_id === bid).sort((a, b) => a.req_no.localeCompare(b.req_no));
const sum = (arr, f) => arr.reduce((t, x) => t + num(f(x)), 0);
const qOrder = (a, b) => ((b.priority === 'urgent') - (a.priority === 'urgent')) || String(a.due_date || '9999').localeCompare(String(b.due_date || '9999')) || String(a.created_at).localeCompare(String(b.created_at));

/* ---------- boot / auth ---------- */
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  await guard(async () => {
    const me = await rpc('pay_my_role');
    if (!me) return showNoAccess(session.user.email);
    S.me = me; S.me.email = session.user.email;
    await loadAll();
    S.tab = defaultTab();
    renderShell();
  });
}
function showLogin(msg) {
  $('#app').innerHTML = `<div class="login"><div class="box">
    <div class="brand" style="color:var(--navy)">CCI Payments<small style="color:#8B8676">Approvals &amp; release control</small></div>
    <div style="height:18px"></div>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <div class="field"><label>Email</label><input id="lg-email" type="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="lg-pass" type="password" autocomplete="current-password"></div>
    <button class="btn p" style="width:100%;padding:11px" data-act="login">Sign in</button>
    <p class="mut" style="font-size:12px;margin:14px 0 0">Use the same login as CAMELS. CEO and JH users are created by Jonathan.</p>
  </div></div>`;
  const go = e => { if (e.key === 'Enter') ACT.login(); };
  $('#lg-email').addEventListener('keydown', go); $('#lg-pass').addEventListener('keydown', go);
}
function showNoAccess(email) {
  $('#app').innerHTML = `<div class="login"><div class="box"><div class="brand" style="color:var(--navy)">CCI Payments</div><div style="height:14px"></div>
    <div class="note red">You are signed in as <b>${esc(email)}</b> but this login has no access to the Payments module. Ask Jonathan to grant access.</div>
    <button class="btn" data-act="logout">Sign out</button></div></div>`;
}
async function loadAll() {
  const r = role();
  const [banks, settings, pos, reqs, batches] = await Promise.all([
    qry(sb.from('pay_bank_accounts').select('*').order('code')),
    qry(sb.from('pay_settings').select('*')),
    rpc('pay_project_position'),
    qry(sb.from('pay_requests').select('*').order('created_at', { ascending: false }).limit(3000)),
    qry(sb.from('pay_batches').select('*').order('created_at', { ascending: false }).limit(500))
  ]);
  S.banks = banks; S.settings = Object.fromEntries(settings.map(s => [s.key, s.value]));
  S.pos = pos; S.reqs = reqs; S.batches = batches;
  if (r === 'owner' || r === 'accounts') {
    const [payees, projects, receipts, adjustments, openings] = await Promise.all([
      qry(sb.from('pay_payees').select('*').order('name').limit(5000)),
      qry(sb.from('ra_projects').select('id,name,client_name').is('deleted_at', null).order('name')),
      qry(sb.from('ra_client_receipts').select('*').order('receipt_date', { ascending: false }).limit(60)),
      qry(sb.from('pay_adjustments').select('*').order('created_at', { ascending: false }).limit(60)),
      qry(sb.from('pay_project_opening').select('*'))
    ]);
    S.payees = payees; S.projects = projects; S.receipts = receipts; S.adjustments = adjustments; S.openings = openings;
  }
  if (r === 'owner') S.users = await qry(sb.from('pay_user_roles').select('*').order('role'));
}
async function refresh(keepTab) { await guard(async () => { await loadAll(); renderShell(); }); }

/* ---------- shell ---------- */
function tabsFor() {
  const n = {
    ceo: S.reqs.filter(r => r.status === 'submitted').length,
    partner: S.batches.filter(b => b.status === 'submitted').length,
    batch: S.reqs.filter(r => r.status === 'approved').length
  };
  const T = {
    owner: [['dash', 'Dashboard'], ['reqs', 'Requests'], ['appr', 'CEO queue', n.ceo], ['batches', 'Batches', n.batch], ['inflow', 'Inflows & limits'], ['payees', 'Payees'], ['audit', 'Audit'], ['admin', 'Admin']],
    accounts: [['dash', 'Dashboard'], ['reqs', 'Requests'], ['batches', 'Batches', n.batch], ['inflow', 'Inflows'], ['payees', 'Payees'], ['audit', 'Audit']],
    ceo: [['appr', 'Approvals', n.ceo], ['dash', 'Dashboard'], ['audit', 'Audit']],
    partner: [['verify', 'Verify batches', n.partner], ['dash', 'Dashboard'], ['audit', 'Audit']]
  };
  return T[role()] || [];
}
function defaultTab() { return { ceo: 'appr', partner: 'verify' }[role()] || 'dash'; }
function renderShell() {
  const tabs = tabsFor();
  $('#app').innerHTML = `<div class="hdr"><div class="top">
      <div class="brand">CCI Payments<small>Approvals &amp; release control</small></div>
      <div class="who"><span>${esc(S.me.name)}</span><span class="role">${esc(role() === 'partner' ? 'JH' : role())}</span>
        ${(role() === 'owner' || role() === 'accounts') ? '<a class="btn s" href="index.html" style="text-decoration:none">&larr; CAMELS</a>' : ''}<button class="btn s" data-act="reload">Refresh</button><button class="btn s" data-act="logout">Sign out</button></div></div>
    <div class="tabs">${tabs.map(([k, l, n]) => `<button class="tab ${S.tab === k ? 'on' : ''}" data-act="tab" data-t="${k}">${esc(l)}${n ? `<span class="n">${n}</span>` : ''}</button>`).join('')}</div></div>
    <main id="main"></main>`;
  renderMain();
}
async function renderMain() {
  const m = $('#main'); if (!m) return;
  const V = { dash: vDash, reqs: vReqs, appr: vAppr, batches: vBatches, inflow: vInflow, payees: vPayees, audit: vAudit, admin: vAdmin, verify: vVerify };
  if (S.tab === 'audit' && !S.audit.length) { await guard(async () => { S.audit = await qry(sb.from('pay_audit').select('*').order('at', { ascending: false }).limit(500)); }); }
  m.innerHTML = (V[S.tab] || vDash)();
}

/* ---------- derived numbers ---------- */
function headClass(h) { return num(h) < 0 ? 'bad' : (num(h) === 0 ? 'mut' : 'good'); }
function pendingNet(projectId, excludeId) { return sum(S.reqs.filter(r => r.project_id === projectId && r.status === 'submitted' && r.id !== excludeId), r => r.net_amount); }
function queueWithGate(lines) {
  const run = {}; const out = [];
  lines.slice().sort(qOrder).forEach(r => {
    if (!(r.project_id in run)) run[r.project_id] = num((posOf(r.project_id) || {}).headroom);
    const head = run[r.project_id]; const net = num(r.net_amount);
    const shortfall = Math.max(net - Math.max(head, 0), 0);
    out.push({ r, head, shortfall }); run[r.project_id] = head - net;
  });
  return out;
}

/* =====================================================================
   VIEWS
===================================================================== */
function vDash() {
  const R = S.reqs, c = st => R.filter(r => st.includes(r.status));
  const kp = (l, arr, tab, f) => `<div class="kpi" ${tabsFor().some(t => t[0] === tab) ? `data-act="tab" data-t="${tab}"` : 'style="cursor:default"'}><div class="l">${l}</div><div class="v">${arr.length}</div><div class="s">${inr0(sum(arr, f || (r => r.net_amount)))}</div></div>`;
  const cards = [
    kp('Drafts', c(['draft']), 'reqs'), kp('With CEO', c(['submitted']), role() === 'partner' ? 'dash' : 'appr'),
    kp('Approved, not batched', c(['approved']), 'batches', r => r.approved_amount),
    kp('In batch / with JH', c(['batched']), role() === 'partner' ? 'verify' : 'batches', r => r.approved_amount),
    kp('Verified, to release', c(['verified']), 'batches', r => r.approved_amount),
    kp('At bank, awaiting UTR', c(['released']), 'batches', r => r.approved_amount)
  ].join('');
  const devLive = R.filter(r => r.is_deviation && r.deviation_approved && ['approved', 'batched', 'verified', 'released'].includes(r.status));
  const devPaid = R.filter(r => r.is_deviation && r.deviation_approved && r.status === 'paid');
  const devByBank = S.banks.map(b => {
    const l = devLive.filter(r => r.dev_funding_account_id === b.id), p = devPaid.filter(r => r.dev_funding_account_id === b.id);
    return { b, live: sum(l, r => r.shortfall_at_approval), paid: sum(p, r => r.shortfall_at_approval), n: l.length + p.length };

    <tbody>${posRows || '<tr><td colspan="8" class="empty">No projects</td></tr>'}</tbody></table></div></div>

function updateGate() {
  const g = $('#rf-gate'); if (!g) return;
  const pid = $('#rf-project').value, id = $('#modal-root [data-act="savereq"]').dataset.id || null;
  const net = num($('#rf-gross').value) - num($('#rf-tds').value) - num($('#rf-oth').value);
  if (!pid) { g.innerHTML = '<div class="gate" style="background:#F2EFE8">Select a project to see the client-inflow check.</div>'; $('#rf-dev').style.display = 'none'; return; }
  const p = posOf(pid) || {}; const head = num(p.headroom) - pendingNet(pid, id);
  const short = Math.max(net - Math.max(head, 0), 0);
  g.innerHTML = short > 0
    ? `<div class="gate dev"><b>Deviation:</b> net ${inr(net)} exceeds available client inflow of ${inr(Math.max(head, 0))} by <b>${inr(short)}</b>. Add the deviation details below — the CEO must approve it explicitly.</div>`
    : `<div class="gate ok"><b>Within client inflow.</b> Net ${inr(net)} against available ${inr(head)}.</div>`;
  $('#rf-dev').style.display = short > 0 ? '' : 'none';
}

  const bsum = sum(appr.filter(r => S.ui.bsel.has(r.id)), r => r.approved_amount);

function batchCard(b) {
  const L = linesOf(b.id); const bank = bankOf(b.bank_account_id); const open = S.ui.openBatch === b.id;
  const total = sum(L, r => r.approved_amount);
  let body = '';
  if (open) {
    const ledgers = [...new Set(L.map(r => { const p = payeeOf(r.payee_id); return (p && p.tally_ledger_name) || r.payee_name; }))];
    const rows = L.map(r => {
      const u = S.ui.utr[r.id] || {};
      return `<tr>${b.status === 'open' ? `<td><input type="checkbox" data-act="selrm" data-id="${r.id}" ${S.ui.rm && S.ui.rm.has(r.id) ? 'checked' : ''}></td>` : ''}
        <td class="mono">${esc(r.req_no)}</td><td>${esc(r.project_name)}</td><td><b>${esc(r.payee_name)}</b>${r.is_deviation ? ' <span class="badge b-dev">Deviation</span>' : ''}</td><td class="r amt"><b>${inr(r.approved_amount)}</b></td>
        <td>${r.pay_mode ? esc(r.pay_mode) : '—'}</td><td>${badge(r.status)}</td>
        ${b.status === 'released' ? `<td>${r.status === 'released' ? `<input data-live="utr" data-id="${r.id}" data-f="utr" placeholder="UTR / ref no." value="${esc(u.utr || '')}" style="min-width:170px"> <input type="date" data-live="utr" data-id="${r.id}" data-f="date" value="${esc(u.date || todayISO())}" style="width:auto"> <button class="btn s" data-act="failline" data-id="${r.id}">Failed</button>` : esc(r.utr || '')}</td>` : (b.status === 'completed' ? `<td class="mono">${esc(r.utr || '')}</td>` : '')}</tr>`;
    }).join('');
    const colspanHead = b.status === 'open' ? '<th></th>' : '';
    const act = {
      open: `<button class="btn" data-act="rmlines" data-id="${b.id}">Remove ticked lines</button><button class="btn p" data-act="bsubmit" data-id="${b.id}">Send to JH for verification</button>`,
      submitted: `<span class="note" style="margin:0">Waiting for JH verification. Lines cannot change.</span>`,
      verified: `<button class="btn p" data-act="bankfile" data-id="${b.id}">1. Generate bank upload file</button><input id="bref-${b.id}" placeholder="Bank upload ref (optional)" style="width:220px"><button class="btn g" data-act="release" data-id="${b.id}">2. Mark uploaded to bank</button>`,
      released: `<button class="btn g" data-act="saveutr" data-id="${b.id}">Save UTRs</button><label class="btn">Match bank statement… <input type="file" accept=".csv,.xlsx,.xls" data-act="stmt" data-id="${b.id}" style="display:none"></label><button class="btn" data-act="bankfile" data-id="${b.id}">Re-download bank file</button>`,
      completed: `<span class="good">Completed ${fdt(b.completed_at)}</span>`
    }[b.status] || '';
    body = `<div style="margin-top:12px"><div class="tw"><table><thead><tr>${colspanHead}<th>Ref</th><th>Project</th><th>Payee</th><th class="r">Amount</th><th>Mode</th><th>Status</th>${b.status === 'released' ? '<th>UTR &amp; date</th>' : (b.status === 'completed' ? '<th>UTR</th>' : '')}</tr></thead><tbody>${rows}</tbody></table></div>
      ${b.partner_remark ? `<div class="note" style="margin-top:10px"><b>JH remark:</b> ${esc(b.partner_remark)}</div>` : ''}
      ${b.status === 'released' ? '<div class="note blue" style="margin-top:10px">Upload the file in the bank portal as per the bank process. Record the UTRs once the bank confirms. If the bank rejects a line, press <b>Failed</b> to send it back for re-batching.</div>' : ''}
      <div class="row" style="margin-top:12px"><button class="btn" data-act="xsheet" data-id="${b.id}">Payment sheet (Excel)</button><button class="btn" data-act="xtally" data-id="${b.id}">Tally vouchers (XML)</button><span class="sp"></span>${act}</div>
      <details style="margin-top:10px"><summary class="mut">Tally ledger names used in this batch (must match Tally exactly)</summary><div style="margin-top:6px;font-size:12.5px">Bank ledger: <b>${esc((bank && bank.tally_ledger) || '(set under Admin → Bank accounts)')}</b><br>Party ledgers: ${ledgers.map(esc).join(' · ')}</div></details></div>`;
  }
  return `<div class="card"><div class="row" style="cursor:pointer" data-act="togglebatch" data-id="${b.id}"><div><span class="mono"><b>${esc(b.batch_no)}</b></span> ${badgeB(b.status)}</div><span class="sp"></span>
    <div class="mut">${esc(bank ? bank.label : '')} · ${fdate(b.pay_date)} · ${L.length} line${L.length === 1 ? '' : 's'} · <b class="amt" style="color:var(--ink)">${inr(total)}</b></div></div>${body}</div>`;
}

/* ---------- JH ---------- */
function vVerify() {
  const pend = S.batches.filter(b => b.status === 'submitted');
  const hist = S.batches.filter(b => ['verified', 'released', 'completed'].includes(b.status)).slice(0, 15);
  const flagCount = L => L.filter(r => r.is_deviation || (r.payee_bank_changed_at && daysSince(r.payee_bank_changed_at) < 30) || num(r.approved_amount) !== num(r.net_amount)).length;
  const cards = pend.map(b => {
    const L = linesOf(b.id), bank = bankOf(b.bank_account_id);
    const lines = L.map(r => {
      const d = S.ui.pdec[r.id] || {}; const bankChg = r.payee_bank_changed_at && daysSince(r.payee_bank_changed_at) < 30;
      return `<div class="card ${r.is_deviation ? 'dev' : (bankChg ? 'flag' : '')}" style="margin-bottom:10px">
        <div class="row"><div><div class="mono" style="font-size:12px">${esc(r.req_no)} · ${esc(r.project_name)}</div><div style="font-size:16px"><b>${esc(r.payee_name)}</b></div>
          <div class="mut">${esc(CATS[r.category])}${r.bill_ref ? ' · Bill ' + esc(r.bill_ref) : ''}</div>${r.description ? `<div>${esc(r.description)}</div>` : ''}</div>
          <span class="sp"></span><div style="text-align:right"><div class="big amt">${inr(r.approved_amount)}</div>${num(r.approved_amount) !== num(r.net_amount) ? `<div class="bad" style="font-size:12px">CEO reduced from ${inr(r.net_amount)}</div>` : ''}</div></div>
        <div style="margin:8px 0;font-size:12.5px"><span class="badge b-approved">CEO approved ${fdt(r.ceo_at)}</span>${r.ceo_remark ? ` <span class="mut">“${esc(r.ceo_remark)}”</span>` : ''}
          ${r.is_deviation ? `<div class="gate dev" style="margin:8px 0 0"><b>Deviation</b> — ${inr(r.shortfall_at_approval)} above client inflow, approved by CEO. Funded from ${esc((bankOf(r.dev_funding_account_id) || {}).label || '—')}. ${esc(DEV_REASONS[r.dev_reason_code] || '')}${r.dev_expected_inflow_date ? ' · expected inflow ' + fdate(r.dev_expected_inflow_date) : ''}${r.dev_note ? ' · ' + esc(r.dev_note) : ''}</div>` : '<span class="badge b-green">Within client inflow</span>'}
          ${bankChg ? `<div class="gate" style="background:#FFF1DB;border:1px solid #F0C98A;margin:8px 0 0"><b>⚠ Payee bank details were changed on ${fdate(r.payee_bank_changed_at)}.</b> Confirm with the vendor before verifying.</div>` : ''}</div>
        <div class="row"><label class="btn ${d.decision === 'verify' ? 'g' : ''}"><input type="radio" style="display:none" name="d-${r.id}" data-act="pdec" data-id="${r.id}" data-d="verify" ${d.decision === 'verify' ? 'checked' : ''}> ✓ Verify</label>
          <label class="btn ${d.decision === 'return' ? 'd' : ''}"><input type="radio" style="display:none" name="d-${r.id}" data-act="pdec" data-id="${r.id}" data-d="return" ${d.decision === 'return' ? 'checked' : ''}> ↩ Return</label>
          ${d.decision === 'return' ? `<input data-live="prem2" data-id="${r.id}" value="${esc(d.remark || '')}" placeholder="Remark (required)" style="flex:1;min-width:200px">` : ''}</div></div>`;
    }).join('');
    const nVer = L.filter(r => (S.ui.pdec[r.id] || {}).decision).length;
    return `<div class="pgrp"><span class="nm mono">${esc(b.batch_no)}</span><span class="mut">${esc(bank ? bank.label : '')} · pay date ${fdate(b.pay_date)} · ${L.length} lines · </span><span class="amt"><b>${inr(sum(L, r => r.approved_amount))}</b></span></div>
      ${flagCount(L) ? `<div class="note red">${flagCount(L)} line${flagCount(L) > 1 ? 's' : ''} need extra care (deviation, reduced amount or recently changed bank details).</div>` : ''}
      ${lines}
      <div class="card"><div class="field"><label>Batch remark (optional)</label><input data-live="bremark" data-id="${b.id}" value="${esc((S.ui.bremark || {})[b.id] || '')}"></div>
      <div class="row"><button class="btn" data-act="verifyclean" data-id="${b.id}">Mark all unflagged lines “Verify”</button><span class="sp"></span><span class="mut">${nVer} of ${L.length} decided</span>
      <button class="btn g" data-act="psubmit" data-id="${b.id}" ${nVer === L.length ? '' : 'disabled'}>Submit verification</button></div></div>`;
  }).join('');
  return `<div class="row" style="margin-bottom:10px"><h2>Batches awaiting your verification</h2></div>
    <div class="note blue">Verifying here confirms each payment is valid and CEO-approved. Accounts handles the bank file, upload and payment records.</div>
    ${cards || '<div class="card empty">No batches are waiting for verification.</div>'}
    <h3 style="margin:22px 0 8px">Recently verified</h3><div class="card"><div class="tw"><table><thead><tr><th>Batch</th><th>Bank</th><th>Pay date</th><th class="r">Lines</th><th class="r">Amount</th><th>Status</th><th>Verified</th></tr></thead><tbody>
    ${hist.map(b => { const L = linesOf(b.id); return `<tr><td class="mono">${esc(b.batch_no)}</td><td>${esc((bankOf(b.bank_account_id) || {}).label || '')}</td><td>${fdate(b.pay_date)}</td><td class="r">${L.length}</td><td class="r amt">${inr(sum(L, r => r.approved_amount))}</td><td>${badgeB(b.status)}</td><td>${fdt(b.verified_at)}</td></tr>`; }).join('') || '<tr><td colspan="7" class="empty">None yet.</td></tr>'}</tbody></table></div></div>`;
}

/* ---------- inflows & limits ---------- */
function vInflow() {
  const proj = S.projects;
  const own = isOwner();
  return `<div class="row" style="margin-bottom:10px"><h2>Client inflows${own ? ' &amp; opening positions' : ''}</h2></div>
  <div class="note blue">Headroom is built from client receipts. If you already reconcile bank statements inside CAMELS, receipts posted there count automatically — <b>do not enter the same receipt twice</b>.</div>
  <div class="grid2">
  <div class="card"><h3 style="margin-bottom:8px">Record client receipt</h3>
    <div class="field"><label>Project</label><select id="rc-project"><option value="">Select…</option>${proj.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
    <div class="grid2"><div class="field"><label>Amount received in bank (₹)</label><input id="rc-amt" type="number" step="0.01" min="0"></div><div class="field"><label>Receipt date</label><input id="rc-date" type="date" value="${todayISO()}"></div></div>
    <div class="field"><label>Reference (RA bill no / UTR)</label><input id="rc-note"></div><button class="btn p" data-act="addreceipt">Add receipt</button></div>
  ${own ? `<div class="card"><h3 style="margin-bottom:8px">Opening position per project</h3>
    <p class="mut" style="font-size:12.5px;margin:0 0 8px">Net position at the <b>start</b> of the date: total client inflow minus total outflow to date, from Tally. Receipts and payments from this date onward are added automatically. A negative number means the project is already funded by CCI.</p>
    <div class="field"><label>Project</label><select id="op-project" data-live="opfill"><option value="">Select…</option>${proj.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
    <div class="grid2"><div class="field"><label>Opening net position (₹)</label><input id="op-amt" type="number" step="0.01"></div><div class="field"><label>As at start of</label><input id="op-date" type="date" value="${todayISO()}"></div></div>
    <div class="field"><label>Note / source</label><input id="op-note" placeholder="e.g. per Tally 31 Oct 2026"></div><button class="btn p" data-act="saveopening">Save opening position</button></div>` : ''}</div>
  ${own ? `<div class="card"><h3 style="margin-bottom:8px">Adjustment (correct for payments or receipts outside this system)</h3>
    <div class="grid3"><div class="field"><label>Project</label><select id="ad-project"><option value="">Select…</option>${proj.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Amount (+ adds headroom, − reduces)</label><input id="ad-amt" type="number" step="0.01"></div><div class="field"><label>Reason</label><input id="ad-reason" placeholder="e.g. Cash wages paid on site 02 Nov"></div></div>
    <button class="btn p" data-act="addadj">Add adjustment</button></div>` : ''}
  <div class="card"><h3 style="margin-bottom:8px">Enter past payments (already paid)</h3>
    <p class="mut" style="font-size:12.5px;margin:0 0 8px">For outflows already made, so each project's headroom is correct. These skip the approval flow, are marked <b>Past entry</b> and are logged. Payments dated before a project's opening-position date are already inside that opening figure and are not counted again.</p>
    <div class="grid3"><div class="field"><label>Project</label><select id="pp-project"><option value="">Select…</option>${proj.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Payee (pick, or type a name)</label><input id="pp-payee" list="ppList" autocomplete="off"><datalist id="ppList">${S.payees.filter(p => p.is_active).map(p => `<option value="${esc(p.name)}">`).join('')}</datalist></div>
      <div class="field"><label>Category</label><select id="pp-cat">${Object.entries(CATS).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select></div></div>
    <div class="grid3"><div class="field"><label>Gross amount (₹)</label><input id="pp-gross" type="number" step="0.01" min="0"></div>
      <div class="field"><label>TDS (₹)</label><input id="pp-tds" type="number" step="0.01" min="0" value="0"></div>
      <div class="field"><label>Date paid</label><input id="pp-date" type="date" value="${todayISO()}" max="${todayISO()}"></div></div>
    <div class="grid3"><div class="field"><label>Paid from</label><select id="pp-bank"><option value="">—</option>${S.banks.map(b => `<option value="${b.id}">${esc(b.label)}</option>`).join('')}</select></div>

  <div class="grid2"><div class="card"><h3 style="margin-bottom:8px">Recent receipts</h3><div class="tw"><table><thead><tr><th>Date</th><th>Project</th><th class="r">Amount</th><th>Ref</th></tr></thead><tbody>
    ${S.receipts.map(r => `<tr><td>${fdate(r.receipt_date)}</td><td>${esc((proj.find(p => p.id === r.project_id) || {}).name || '')}</td><td class="r amt">${inr(r.amount)}</td><td>${esc(r.notes || '')}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">None yet.</td></tr>'}</tbody></table></div></div>
  <div class="card"><h3 style="margin-bottom:8px">Adjustments &amp; openings</h3><div class="tw"><table><thead><tr><th>Date</th><th>Project</th><th class="r">Amount</th><th>Reason</th></tr></thead><tbody>
    ${S.openings.map(o => `<tr><td>${fdate(o.as_of)}</td><td>${esc((proj.find(p => p.id === o.project_id) || {}).name || '')}</td><td class="r amt">${inr(o.opening_net)}</td><td><span class="badge b-open">Opening</span> ${esc(o.note || '')}</td></tr>`).join('')}
    ${S.adjustments.map(a => `<tr><td>${fdate(a.adj_date)}</td><td>${esc((proj.find(p => p.id === a.project_id) || {}).name || '')}</td><td class="r amt">${inr(a.amount)}</td><td>${esc(a.reason)}</td></tr>`).join('')}
    ${!S.openings.length && !S.adjustments.length ? '<tr><td colspan="4" class="empty">None yet.</td></tr>' : ''}</tbody></table></div></div></div>`;
}

/* ---------- payees ---------- */
function vPayees() {
  const q = (S.ui.payeeQ || '').toLowerCase();
  const L = S.payees.filter(p => !q || (p.name + ' ' + (p.tally_ledger_name || '')).toLowerCase().includes(q));
  const miss = S.payees.filter(p => p.is_active && (!p.account_no || !p.ifsc)).length;
  return `<div class="row" style="margin-bottom:10px"><h2>Payees</h2><span class="sp"></span><button class="btn" data-act="syncpayees">Import CAMELS subcontractors</button><button class="btn p" data-act="newpayee">+ New payee</button></div>
  ${miss ? `<div class="note">${miss} active payee${miss > 1 ? 's' : ''} have no valid bank account / IFSC and cannot be batched until fixed.</div>` : ''}
  <div class="note blue">Changing a payee's bank account or IFSC is logged, and JH sees a warning on any payment to that payee for 30 days.</div>
  <div class="card"><input id="pq" placeholder="Search payee…" value="${esc(S.ui.payeeQ)}" data-live="payeeq" style="max-width:320px;margin-bottom:10px">
  <div class="tw"><table><thead><tr><th>Name</th><th>Type</th><th>Tally ledger</th><th>Bank</th><th>IFSC</th><th></th></tr></thead><tbody>
  ${L.slice(0, 300).map(p => `<tr><td><b>${esc(p.name)}</b>${p.is_active ? '' : ' <span class="badge b-cancelled">Inactive</span>'}</td><td>${esc(p.kind)}</td><td>${esc(p.tally_ledger_name || '')}</td>
    <td class="mono">${p.account_no ? '••••' + esc(p.account_no.slice(-4)) : '<span class="bad">missing</span>'} <span class="mut">${esc(p.bank_name || '')}</span></td><td class="mono">${p.ifsc ? esc(p.ifsc) : '<span class="bad">missing</span>'}</td>

}

/* ---------- audit ---------- */

/* ---------- admin ---------- */
function vAdmin() {
  const roleName = { owner: 'Owner', accounts: 'Accounts', ceo: 'CEO', partner: 'JH' };
  return `<div class="row" style="margin-bottom:10px"><h2>Admin</h2></div>
  <div class="card"><h3 style="margin-bottom:8px">Who can do what</h3>
    <div class="tw"><table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
    ${S.users.map(u => `<tr><td><b>${esc(u.full_name)}</b></td><td>${esc(roleName[u.role] || u.role)}</td><td>${u.is_active ? '<span class="badge b-approved">Active</span>' : '<span class="badge b-cancelled">Revoked</span>'}</td>

function tallyXml(b) {
  const L = linesOf(b.id), s = S.settings, bank = bankOf(b.bank_account_id);
  const x = v => String(v ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/[<>&'"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', "'": '&apos;', '"': '&quot;' }[c]));
  const amt = v => num(v).toFixed(2), dt = String(b.pay_date).replace(/-/g, '');
  const msgs = L.map(r => {
    const p = payeeOf(r.payee_id) || {}; const ledger = p.tally_ledger_name || r.payee_name;
    const full = Math.abs(num(r.approved_amount) - num(r.net_amount)) < 0.005;
    const tdsIn = s.tds_in_payment === 'yes' && full && num(r.tds_amount) > 0;

    return `<TALLYMESSAGE xmlns:UDF="TallyUDF"><VOUCHER VCHTYPE="Payment" ACTION="Create" OBJVIEW="Accounting Voucher View">
<DATE>${dt}</DATE><VOUCHERTYPENAME>Payment</VOUCHERTYPENAME><VOUCHERNUMBER>${x((s.voucher_prefix || 'PAY') + '/' + r.req_no)}</VOUCHERNUMBER>
<PARTYLEDGERNAME>${x(ledger)}</PARTYLEDGERNAME><NARRATION>${x(narr)}</NARRATION>
<ALLLEDGERENTRIES.LIST><LEDGERNAME>${x(ledger)}</LEDGERNAME><ISDEEMEDPOSITIVE>Yes</ISDEEMEDPOSITIVE><AMOUNT>-${amt(party)}</AMOUNT></ALLLEDGERENTRIES.LIST>
${tdsIn ? `<ALLLEDGERENTRIES.LIST><LEDGERNAME>${x(s.tds_ledger || 'TDS Payable')}</LEDGERNAME><ISDEEMEDPOSITIVE>No</ISDEEMEDPOSITIVE><AMOUNT>${amt(r.tds_amount)}</AMOUNT></ALLLEDGERENTRIES.LIST>\n` : ''}<ALLLEDGERENTRIES.LIST><LEDGERNAME>${x((bank && bank.tally_ledger) || (bank && bank.label) || 'Bank')}</LEDGERNAME><ISDEEMEDPOSITIVE>No</ISDEEMEDPOSITIVE><AMOUNT>${amt(r.approved_amount)}</AMOUNT>
<BANKALLOCATIONS.LIST><DATE>${dt}</DATE><INSTRUMENTDATE>${dt}</INSTRUMENTDATE><TRANSACTIONTYPE>e-Fund Transfer</TRANSACTIONTYPE><PAYMENTFAVOURING>${x(p.name || r.payee_name)}</PAYMENTFAVOURING><AMOUNT>${amt(r.approved_amount)}</AMOUNT></BANKALLOCATIONS.LIST></ALLLEDGERENTRIES.LIST>
</VOUCHER></TALLYMESSAGE>`;
  }).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>
<ENVELOPE><HEADER><TALLYREQUEST>Import Data</TALLYREQUEST></HEADER><BODY><IMPORTDATA><REQUESTDESC><REPORTNAME>Vouchers</REPORTNAME><STATICVARIABLES><SVCURRENTCOMPANY>${x(s.tally_company || '')}</SVCURRENTCOMPANY></STATICVARIABLES></REQUESTDESC>
<REQUESTDATA>
${msgs}
</REQUESTDATA></IMPORTDATA></BODY></ENVELOPE>`;
}
function bankCsv(b) {
  const L = linesOf(b.id).filter(r => ['verified', 'released', 'paid'].includes(r.status)); const bank = bankOf(b.bank_account_id);
  const cl = v => String(v ?? '').replace(/[^A-Za-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  const csv = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const head = ['Sl No', 'Payment Mode', 'Debit Account', 'Beneficiary Name', 'Beneficiary Account No', 'Beneficiary IFSC', 'Amount', 'Remarks (max 30)', 'Pay Date', 'Our Ref'];
  const rows = L.map((r, i) => { const p = payeeOf(r.payee_id) || {}; return [i + 1, r.pay_mode || 'NEFT', bank ? bank.label : '', cl(p.name || r.payee_name), p.account_no || '', p.ifsc || '', num(r.approved_amount).toFixed(2), cl(r.req_no + ' ' + (r.project_name || '')).slice(0, 30), b.pay_date, r.req_no]; });
  return [head, ...rows].map(r => r.map(csv).join(',')).join('\r\n');
}
/* statement matcher: finds UTR-looking token + exact amount per line */
function matchStatement(rows, lines) {
  const used = new Set(), out = {};
  const toNum = v => { if (typeof v === 'number') return v; const s = String(v ?? '').replace(/[, ]/g, ''); return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : NaN; };
  const utrRe = /\b[A-Za-z]{4}[A-Za-z0-9]{9,}\b|\b\d{12,22}\b/;
  lines.forEach(r => {
    const first = String(r.payee_name || '').toLowerCase().split(/\s+/)[0] || '';
    const cands = rows.map((row, i) => ({ row, i })).filter(({ row, i }) => !used.has(i) && row.some(c => Math.abs(toNum(c) - num(r.approved_amount)) < 0.005));
    const pick = cands.find(({ row }) => first.length > 2 && row.some(c => String(c).toLowerCase().includes(first))) || cands[0];
    if (!pick) return; used.add(pick.i);
    const cell = pick.row.map(c => String(c ?? '')).map(c => (c.match(utrRe) || [])[0]).find(Boolean);
    let dateStr = ''; const d = pick.row.find(c => c instanceof Date); if (d) dateStr = d.toISOString().slice(0, 10);
    out[r.id] = { utr: cell || '', date: dateStr || todayISO() };
  });
  return out;
}

    if (items.some(i => i.decision === 'return' && !(i.remark || '').trim())) return toast('Add a remark for every returned line', true);
    if (!confirm(`Submit verification for ${b.batch_no}?\n${items.filter(i => i.decision === 'verify').length} verified, ${items.filter(i => i.decision === 'return').length} returned.`)) return;
    await guard(async () => { const res = await rpc('pay_partner_decide', { p_batch: b.id, p_items: items, p_remark: (S.ui.bremark || {})[b.id] || null }); items.forEach(i => delete S.ui.pdec[i.id]); toast(`${res.verified} verified, ${res.returned} returned`); await refresh(); });
  },
  /* inflows */
  async addreceipt() {
    const project_id = $('#rc-project').value, amount = num($('#rc-amt').value), receipt_date = $('#rc-date').value;
    if (!project_id || amount <= 0 || !receipt_date) return toast('Project, amount and date are required', true);
    await guard(async () => { const { data: { user } } = await sb.auth.getUser(); await qry(sb.from('ra_client_receipts').insert({ project_id, amount, receipt_date, notes: $('#rc-note').value.trim() || null, created_by: user.id })); toast('Receipt added'); await refresh(); });
  },
  async saveopening() {
    const project_id = $('#op-project').value; if (!project_id || $('#op-amt').value === '') return toast('Project and opening amount are required', true);
    if (!confirm('Set the opening position for this project? This resets its headroom baseline and is logged.')) return;
    await guard(async () => { const { data: { user } } = await sb.auth.getUser(); await qry(sb.from('pay_project_opening').upsert({ project_id, opening_net: num($('#op-amt').value), as_of: $('#op-date').value, note: $('#op-note').value.trim() || null, set_by: user.id, set_at: new Date().toISOString() })); toast('Opening position saved'); await refresh(); });
  },
  async addpast() {
    const project = $('#pp-project').value, gross = num($('#pp-gross').value), tds = num($('#pp-tds').value), d = $('#pp-date').value, lbl = $('#pp-payee').value.trim();
    if (!project || !lbl || gross <= 0 || !d) return toast('Project, payee, amount and date paid are required', true);
    const py = S.payees.find(x => x.name === lbl);
    await guard(async () => {
      const res = await rpc('pay_backfill_payment', { p_project: project, p_payee_id: py ? py.id : null, p_payee_name: lbl, p_category: $('#pp-cat').value, p_gross: gross, p_tds: tds,
        p_paid_date: d, p_bank_account: $('#pp-bank').value || null, p_utr: $('#pp-utr').value.trim() || null, p_bill_ref: $('#pp-note').value.trim() || null, p_note: null });
      toast(res.counted ? 'Past payment added — headroom updated' : 'Saved, but dated before the opening position so it is not counted again', !res.counted);
      await refresh();
    });
  },
  async rmpast(el) {
    const why = prompt('Why is this past entry being removed?'); if (!why || why.trim().length < 3) return;
    await guard(async () => { await rpc('pay_cancel_backfill', { p_request: el.dataset.id, p_reason: why.trim() }); toast('Past entry removed'); await refresh(); });
  },
  async addadj() {
    const project_id = $('#ad-project').value, amount = num($('#ad-amt').value), reason = $('#ad-reason').value.trim();
    if (!project_id || !amount || reason.length < 3) return toast('Project, non-zero amount and a reason are required', true);
    await guard(async () => { const { data: { user } } = await sb.auth.getUser(); await qry(sb.from('pay_adjustments').insert({ project_id, amount, reason, created_by: user.id })); toast('Adjustment added'); await refresh(); });
  },
  /* payees */
  newpayee() { openModal(payeeFormHtml()); },
  editpayee(el) { openModal(payeeFormHtml(payeeOf(el.dataset.id))); },
  async savepayee(el) {
    const id = el.dataset.id || null, name = $('#py-name').value.trim(); if (!name) return toast('Name is required', true);
    const acct = $('#py-acct').value.replace(/\s/g, ''), ifsc = $('#py-ifsc').value.trim().toUpperCase();
    if (acct && !/^[0-9]{6,20}$/.test(acct)) return toast('Account number must be 6–20 digits', true);
    if (ifsc && !/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc)) return toast('IFSC looks wrong (e.g. ICIC0001234)', true);
    const row = { name, kind: $('#py-kind').value, tally_ledger_name: $('#py-tally').value.trim() || name, account_no: acct || null, ifsc: ifsc || null, bank_name: $('#py-bank').value.trim() || null, pan: $('#py-pan').value.trim() || null, gstin: $('#py-gst').value.trim() || null, is_active: $('#py-active').value === '1' };
    await guard(async () => {
      if (id) await qry(sb.from('pay_payees').update(row).eq('id', id)); else { const { data: { user } } = await sb.auth.getUser(); await qry(sb.from('pay_payees').insert({ ...row, created_by: user.id })); }
      closeModal(); toast('Payee saved'); await refresh();
    });
  },
  async syncpayees() { await guard(async () => { const n = await rpc('pay_sync_payees'); toast(`${n} subcontractor(s) imported`); await refresh(); }); },
  async reloadaudit() { S.audit = []; renderMain(); },
  /* admin */
  async grant() {
    const email = $('#gr-email').value.trim(), name = $('#gr-name').value.trim(), r = $('#gr-role').value; if (!email || !name) return toast('E-mail and name are required', true);
    await guard(async () => { await rpc('pay_grant_role', { p_email: email, p_role: r, p_name: name }); toast('Access granted'); $('#gr-email').value = ''; $('#gr-name').value = ''; await refresh(); });
  },
  async toggleuser(el) { await guard(async () => { await rpc('pay_set_user_active', { p_user: el.dataset.id, p_active: el.dataset.on === '1' }); toast('Updated'); await refresh(); }); },
  async savebank(el) {
    const id = el.dataset.id; await guard(async () => { await qry(sb.from('pay_bank_accounts').update({ label: $(`#bk-l-${id}`).value.trim(), account_kind: $(`#bk-k-${id}`).value, od_limit: $(`#bk-o-${id}`).value === '' ? null : num($(`#bk-o-${id}`).value), tally_ledger: $(`#bk-t-${id}`).value.trim() || null, is_active: $(`#bk-a-${id}`).value === '1' }).eq('id', id)); toast('Bank account saved'); await refresh(); });
  },
  async savesetting(el) { const k = el.dataset.k; await guard(async () => { await qry(sb.from('pay_settings').upsert({ key: k, value: $(`#st-${k}`).value.trim() })); toast('Saved'); await refresh(); }); }
};

/* ---------- event wiring ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'INPUT' && (el.type === 'radio' || el.type === 'file')) return;
  if (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type === 'checkbox' && el.dataset.act !== 'selreq')) return;
  if (el.dataset.act === 'selreq') return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act;
  if (['selreq', 'selalldraft', 'selbatch', 'selallbatch', 'selrm', 'devok', 'pdec', 'fproject', 'stmt'].includes(a) && ACT[a]) ACT[a](el, e);
});
document.addEventListener('input', e => {
  const el = e.target; const l = el.dataset && el.dataset.live; if (!l) return; const id = el.dataset.id;
  if (l === 'gate') updateGate();
  else if (l === 'fq') { S.ui.q = el.value; const pos = el.selectionStart; renderMain(); const n = $('#f-q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  else if (l === 'payeeq') { S.ui.payeeQ = el.value; const pos = el.selectionStart; renderMain(); const n = $('#pq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  else if (l === 'auditq') { S.ui.auditQ = el.value; const pos = el.selectionStart; renderMain(); const n = $('#aq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  else if (l === 'pamt') (S.ui.panel[id] = S.ui.panel[id] || {}).amount = el.value;
  else if (l === 'prem') (S.ui.panel[id] = S.ui.panel[id] || {}).remark = el.value;
  else if (l === 'prem2') (S.ui.pdec[id] = S.ui.pdec[id] || {}).remark = el.value;
  else if (l === 'bremark') (S.ui.bremark = S.ui.bremark || {})[id] = el.value;
  else if (l === 'utr') { const u = (S.ui.utr[id] = S.ui.utr[id] || {}); u[el.dataset.f] = el.value; }
  else if (l === 'bankpick') S.ui.bankPick = el.value;
  else if (l === 'paydate') S.ui.payDate = el.value;
  else if (l === 'opfill') { const o = S.openings.find(x => x.project_id === el.value); if (o) { $('#op-amt').value = o.opening_net; $('#op-date').value = o.as_of; $('#op-note').value = o.note || ''; } }
});

boot();
</script>
</body>
</html>
