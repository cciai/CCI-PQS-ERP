<style>
:root{
  --navy:#1B2A4A; --navy-2:#16233D; --paper:#FAF8F5; --paper-2:#F2EFE8; --line:#D8D2C6;
  --ink:#1B2A4A; --steel:#6B7A92; --amber:#C97C4A; --green:#3F8F63; --red:#C1453A; --blue:#2F6DB5;
  --grid:rgba(255,255,255,0.045);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Barlow',sans-serif;color:var(--ink);background:var(--paper);font-size:14px;-webkit-text-size-adjust:100%}
.mono{font-family:'IBM Plex Mono',monospace}
h1,h2,h3{font-family:'Barlow Condensed',sans-serif;margin:0;letter-spacing:.01em}
h2{font-size:22px;font-weight:700} h3{font-size:17px;font-weight:600}
.hdr{background:var(--navy);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:#EDEBE3;padding:12px 18px 0;position:sticky;top:0;z-index:20}
.hdr .top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em}
.brand small{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:400;opacity:.65;letter-spacing:.1em;text-transform:uppercase}
.who{font-size:12.5px;opacity:.9;display:flex;gap:10px;align-items:center}
.who .role{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;background:rgba(255,255,255,.12);padding:3px 8px;border-radius:4px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;color:#cfd5e2;padding:10px 14px;font:600 13px 'Barlow',sans-serif;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:var(--amber)}
.tab .n{background:var(--amber);color:#fff;border-radius:9px;padding:1px 7px;font-size:11px;margin-left:5px}
main{max-width:1280px;margin:0 auto;padding:18px 16px 80px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card.flag{border-left:4px solid var(--amber)}
.card.dev{border-left:4px solid var(--red)}
.card.ok{border-left:4px solid var(--green)}
.testbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#FFF1DB;border-bottom:2px solid #E0A340;padding:6px 22px;font-size:12.5px}

.kpi.flat{cursor:default}.kpis.flow .kpi .v{font-size:24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);font-weight:600}

table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid #EEE9DE;vertical-align:top}
tr:hover td{background:#FCFBF8}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:7px;font:600 13px 'Barlow',sans-serif;cursor:pointer;color:var(--ink)}
.btn:hover{background:#FBFAF6}
.btn.p{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.p:hover{background:#243759}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.d{background:var(--red);color:#fff;border-color:var(--red)}
.btn.a{background:var(--amber);color:#fff;border-color:var(--amber)}
.btn.s{padding:4px 9px;font-size:12px;border-radius:6px}

.b-draft{background:#E8E5DC;color:#555}.b-submitted{background:#FCEBD5;color:#9A5A1E}.b-approved{background:#DCEFE3;color:#2B6B47}
.b-batched,.b-open{background:#DDE8F6;color:#2B5C94}.b-verified{background:#CFE7F2;color:#1F6384}.b-released{background:#E6DDF3;color:#5B3F8A}
.b-paid,.b-completed{background:#C9E8D5;color:#1D6140}.b-rejected,.b-cancelled{background:#F4D8D5;color:#9A2F27}
.b-dev{background:var(--red);color:#fff}.b-green{background:#DCEFE3;color:#2B6B47}.b-warn{background:#FCEBD5;color:#9A5A1E}
.good{color:var(--green);font-weight:600}.bad{color:var(--red);font-weight:600}.mut{color:var(--steel)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#8B8676;margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font:14px 'Barlow',sans-serif;background:#fff;color:var(--ink)}
input[type=checkbox],input[type=radio]{width:auto}
textarea{min-height:60px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

.note{background:#FFF7E8;border:1px solid #F0D9A8;border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.note.red{background:#FCEDEB;border-color:#EBC0BB}.note.blue{background:#EAF1FA;border-color:#BCD1EA}
.gate{border-radius:8px;padding:10px 12px;font-size:13px;margin:8px 0 12px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:92vw}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 22px rgba(0,0,0,.25)}
.toast.err{background:var(--red)}
.ovl{position:fixed;inset:0;background:rgba(15,25,45,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.modal{background:var(--paper);border-radius:12px;padding:20px;width:760px;max-width:100%;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal h2{margin-bottom:12px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--navy);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.login .box{background:var(--paper);border-radius:14px;padding:34px 32px;width:380px;max-width:94vw}
.err{background:rgba(193,69,58,.1);border:1px solid rgba(193,69,58,.35);color:var(--red);padding:9px 11px;border-radius:8px;margin-bottom:12px;font-size:13px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl .it{margin-bottom:10px;position:relative}.tl .it:before{content:'';position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--amber)}
.pgrp{margin:18px 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.pgrp .nm{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700}
.amt{font-family:'IBM Plex Mono',monospace;font-weight:500}
.big{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.kv span:nth-child(odd){color:var(--steel)}
.empty{padding:28px;text-align:center;color:var(--steel)}
details>summary{cursor:pointer;font-weight:600}
.gtbl td{padding:3px 4px;vertical-align:middle}.gtbl input,.gtbl select{width:100%;padding:6px 7px;font-size:13px}.gtbl select:disabled{opacity:.35}.gtbl select[data-c=p]{min-width:150px}.gtbl select[data-c=c]{min-width:125px}.gtbl select[data-c=pr]{min-width:95px}.gtbl select[data-c=dr]{min-width:190px}.gtbl select[data-c=db]{min-width:150px}.gtbl th{white-space:nowrap}.gtbl select[data-c=bill]{min-width:125px}
.lg{background:#EEEDEA;border:1px solid #D4D1CA;border-radius:8px;padding:10px 12px;margin:0 0 12px;color:#6F6C65;font-size:12.5px}
.lg h4{margin:0 0 6px;font:700 11px 'Barlow',sans-serif;text-transform:uppercase;letter-spacing:.06em;color:#8A877F}
.lg table{font-size:12px;color:#6F6C65;margin:4px 0}.lg th{color:#8A877F;border-bottom:1px solid #D4D1CA}.lg td{border-bottom:1px solid #E2DFD8;padding:4px 6px}
.lg tr:hover td{background:transparent}.lg .tot td{font-weight:700;color:#4D4A44;border-bottom:none}
.lg .sum{display:grid;grid-template-columns:1fr auto;gap:2px 14px;margin-top:6px}.lg .sum b{color:#4D4A44}
.lg .warn{color:#9A5A1E;background:#FCEBD5;border-radius:6px;padding:5px 8px;margin-top:6px}.lg .okh{color:#6B7A92;margin-top:6px}

.pc{position:fixed;z-index:9999;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(27,42,74,.22);width:380px;max-width:calc(100vw - 16px);display:flex;flex-direction:column;overflow:hidden}
.pc-top{padding:8px 8px 6px;border-bottom:1px solid var(--line);background:var(--paper)}
.pc-chips{display:flex;gap:5px;flex-wrap:wrap}
.pc-chip{border:1px solid var(--line);background:#fff;color:var(--steel);font:600 12px 'Barlow',sans-serif;padding:4px 10px;border-radius:14px;cursor:pointer}
.pc-chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pc-hint{font-size:11.5px;color:var(--steel);margin-top:6px}
.pc-list{max-height:300px;overflow-y:auto}
.pc-it{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;border-bottom:1px solid #f1eee8}
.pc-it.act{background:#F3EEE4}
.pc-nm{font-weight:600;font-size:14px;line-height:1.2}
.pc-sub{font-size:11.5px;color:var(--steel);margin-top:2px}
.pc-main{flex:1;min-width:0}
.pc-main .pc-nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-ty{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:4px;flex:0 0 auto}
.pc-ty.supplier{background:#E6EEF8;color:#2F6DB5} .pc-ty.subcontractor{background:#F6E9DD;color:#A8612F} .pc-ty.other{background:#ECECE6;color:#6B7A92}
.pc-star{color:var(--amber);font-size:15px;flex:0 0 auto} .pc-ns{font-size:10.5px;color:#9a9484;flex:0 0 auto}
.pc-empty{padding:18px 14px;text-align:center;color:var(--steel);font-size:13px}
.pc-foot{padding:7px 12px;font-size:11.5px;color:var(--steel);background:var(--paper);border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modal-root"></div>

<script>
'use strict';
/* =====================================================================
   CCI Payments — Approvals module (runs on the CAMELS Supabase project)
===================================================================== */
const SUPABASE_URL = 'https://jtbmrohjrsnoxcgcmmls.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0Ym1yb2hqcnNub3hjZ2NtbWxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDM4OTEsImV4cCI6MjEwMjcxOTg5MX0.Fy1gRJkj3MLnJBmbonNpMKnfNyJx9Fzq49xbaC8pDK4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => Number(v || 0);
const inr = v => '₹' + num(v).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const inr0 = v => '₹' + Math.round(num(v)).toLocaleString('en-IN');
const fdate = d => { if (!d) return '—'; const x = new Date(String(d).length === 10 ? d + 'T00:00:00' : d); return x.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); };
const fdt = d => d ? new Date(d).toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' }) : '—';
const todayISO = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date());
const daysSince = d => (Date.now() - new Date(d).getTime()) / 86400000;
const cleanErr = e => String((e && e.message) || e || 'Something went wrong').replace(/^.*ERROR:\s*/, '').replace(/\s*CONTEXT:.*$/s, '');
async function rpc(name, args) { const { data, error } = await sb.rpc(name, args || {}); if (error) throw new Error(cleanErr(error)); return data; }
async function qry(p) { const { data, error } = await p; if (error) throw new Error(cleanErr(error)); return data; }
function toast(msg, isErr) {
  const t = document.createElement('div'); t.className = 'toast' + (isErr ? ' err' : ''); t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), isErr ? 7000 : 3200);
}
async function guard(fn) { try { return await fn(); } catch (e) { toast(cleanErr(e), true); console.error(e); } }
function download(name, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/plain' }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

const STATUS_LABEL = { draft: 'Draft', submitted: 'With CEO', approved: 'Approved', rejected: 'Rejected', batched: 'In batch', verified: 'Verified', released: 'At bank', paid: 'Paid', cancelled: 'Cancelled' };
const BLABEL = { open: 'Open', submitted: 'With JH', verified: 'Verified', released: 'At bank', completed: 'Completed', cancelled: 'Cancelled' };
const BCLS = { open: 'draft', completed: 'paid' };
const badgeB = s => `<span class="badge b-${esc(BCLS[s] || s)}">${esc(BLABEL[s] || s)}</span>`;
const badge = s => `<span class="badge b-${esc(s)}">${esc(STATUS_LABEL[s] || s)}</span>`;
const DEV_REASONS = { client_inflow_delayed: 'Client inflow delayed', statutory_due: 'Statutory dues (GST/PF/ESI/TDS)', wages_critical: 'Labour wages critical', material_critical: 'Material critical for progress', advance_to_secure: 'Advance to secure rate/supply', other: 'Other (explain)' };
const COMPANIES = ['Cameo','CCI Urban','CCI Projects','CCI Contracting Services','CCI Contracts','CCI Technical Services','CCI Engineering Services'];
const coOpts = (cur, ph) => `<option value="">${ph || 'Select company…'}</option>` + COMPANIES.map(c => `<option ${cur === c ? 'selected' : ''}>${esc(c)}</option>`).join('');
const CATS = { labour: 'Labour', material: 'Material', subcontract: 'Subcontract', equipment: 'Equipment / rental', statutory: 'Statutory', overhead: 'Overhead', other: 'Other' };

/* ---------- state ---------- */
const S = {
  me: null, tab: '', banks: [], settings: {}, pos: [], reqs: [], batches: [], payees: [], projects: [], audit: [], users: [],
  receipts: [], adjustments: [], openings: [],
  ui: { status: 'all', project: '', q: '', sel: new Set(), bsel: new Set(), csel: new Set(), camt: {}, bpay: {}, panel: {}, openBatch: null, pdec: {}, utr: {}, auditQ: '', bankPick: '', payDate: '', payeeQ: '' }
};
const realRole = () => S.me && S.me.role;
const TEST_MODE_EMAIL = 'jonathan@cameoconstructions.com';   // test mode is for Jonathan's login only
const canTest = () => realRole() === 'owner' && S.me && (S.me.email || '').toLowerCase() === TEST_MODE_EMAIL;
const testOn = () => canTest() && S.settings && S.settings.owner_test_mode === 'on';
const role = () => (testOn() && S.view) ? S.view : (S.me && S.me.role);
const isOwner = () => role() === 'owner';
const canRaise = () => role() === 'owner' || role() === 'accounts';
const canSubmit = () => role() === 'owner' || role() === 'accounts';   // QS / accounts can send requests to the CEO
const bankOf = id => S.banks.find(b => b.id === id);
const payeeOf = id => S.payees.find(p => p.id === id);
/* payee pickers: active payees; subcontractors only when starred in CAMELS */
const pickPayees = () => S.payees.filter(p => p.is_active && ((!p.subcontractor_id && !p.supplier_id) || p.is_starred));
/* label map over ALL active payees (so un-starred suppliers / subcontractors can still be typed); duplicate names get [a/c last 4] */
let _plCache = null;
function payeeLabelMap() {
  if (_plCache && _plCache.src === S.payees && _plCache.n === S.payees.length) return _plCache.labels;
  const names = {}, labels = {}, rev = {}, act = S.payees.filter(p => p.is_active);
  act.forEach(p => { names[p.name] = (names[p.name] || 0) + 1; });
  act.forEach(p => { const l = names[p.name] > 1 ? `${p.name} [${(p.account_no || '').slice(-4) || 'no a/c'}]` : p.name; labels[l] = p.id; rev[p.id] = l; });
  _plCache = { src: S.payees, n: S.payees.length, labels, rev }; return labels;
}
const payeeLabelOf = p => { payeeLabelMap(); return _plCache.rev[p.id] || p.name; };
const batchOf = id => S.batches.find(b => b.id === id);
const posOf = id => S.pos.find(p => p.project_id === id);
const linesOf = bid => S.reqs.filter(r => r.batch_id === bid).sort((a, b) => a.req_no.localeCompare(b.req_no));
const sum = (arr, f) => arr.reduce((t, x) => t + num(f(x)), 0);
const qOrder = (a, b) => ((b.priority === 'urgent') - (a.priority === 'urgent')) || String(a.due_date || '9999').localeCompare(String(b.due_date || '9999')) || String(a.created_at).localeCompare(String(b.created_at));

/* ---------- boot / auth ---------- */
function showBootError(msg) {
  $('#app').innerHTML = `<div class="login"><div class="box"><div class="brand" style="color:var(--navy)">CCI Payments</div><div style="height:14px"></div>
    <div class="note red"><b>The Payments page could not start.</b><br>${esc(msg || 'Unknown problem')}</div>
    <p class="mut" style="font-size:12.5px;margin:0 0 12px">Check your internet connection, then try again. If it keeps failing, sign out and sign in again.</p>
    <div class="row"><button class="btn p" onclick="location.reload()">Try again</button><button class="btn" id="be-out">Sign out &amp; sign in again</button><a class="btn" href="index.html" style="text-decoration:none">&larr; CAMELS</a></div></div></div>`;
  const o = document.getElementById('be-out'); if (o) o.onclick = async () => { try { await sb.auth.signOut({ scope: 'local' }); } catch (e) {} Object.keys(localStorage).filter(k => /^sb-.*-auth-token/.test(k)).forEach(k => localStorage.removeItem(k)); location.reload(); };
}
const withTimeout = (p, ms, label) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error((label || 'Request') + ' timed out after ' + ms / 1000 + 's')), ms))]);
async function boot() {
  $('#app').innerHTML = '<div class="login"><div class="box" style="text-align:center"><div class="brand" style="color:var(--navy)">CCI Payments<small style="color:#8B8676">Loading…</small></div></div></div>';
  let session;
  try { ({ data: { session } } = await withTimeout(sb.auth.getSession(), 12000, 'Sign-in check')); }
  catch (e) { return showBootError(cleanErr(e)); }
  if (!session) return showLogin();
  try { await (async () => {
    const me = await withTimeout(rpc('pay_my_role'), 15000, 'Access check');
    if (!me) return showNoAccess(session.user.email);
    S.me = me; S.me.email = session.user.email;
    await withTimeout(loadAll(), 25000, 'Loading payments data');
    S.tab = defaultTab();
    renderShell();
  })(); } catch (e) { showBootError(cleanErr(e)); console.error(e); }
}

async function loadAll() {
  Object.keys(LG).forEach(k => delete LG[k]);
  const r = realRole();
  const [banks, settings, pos, reqs, batches] = await Promise.all([
    qry(sb.from('pay_bank_accounts').select('*').order('code')),
    qry(sb.from('pay_settings').select('*')),
    rpc('pay_project_position'),
    qry(sb.from('pay_requests').select('*').order('created_at', { ascending: false }).limit(3000)),
    qry(sb.from('pay_batches').select('*').order('created_at', { ascending: false }).limit(500))
  ]);
  S.banks = banks; S.settings = Object.fromEntries(settings.map(s => [s.key, s.value]));
  S.pos = pos; S.reqs = reqs; S.batches = batches;
  if (r === 'owner' || r === 'accounts') {
    const [payees, projects, receipts, adjustments, openings] = await Promise.all([
      qry(sb.from('pay_payees').select('*').order('name').limit(5000)),
      qry(sb.from('ra_projects').select('id,name,client_name').is('deleted_at', null).order('name')),
      qry(sb.from('ra_client_receipts').select('*').order('receipt_date', { ascending: false }).limit(60)),
      qry(sb.from('pay_adjustments').select('*').order('created_at', { ascending: false }).limit(60)),
      qry(sb.from('pay_project_opening').select('*'))
    ]);
    S.payees = payees; S.projects = projects; S.receipts = receipts; S.adjustments = adjustments; S.openings = openings;
  }
  if (r === 'owner') S.users = await qry(sb.from('pay_user_roles').select('*').order('role'));
}

/* ---------- derived numbers ---------- */
function headClass(h) { return num(h) < 0 ? 'bad' : (num(h) === 0 ? 'mut' : 'good'); }
function pendingNet(projectId, excludeId) { return sum(S.reqs.filter(r => r.project_id === projectId && r.status === 'submitted' && r.id !== excludeId), r => r.net_amount); }
function queueWithGate(lines) {
  const run = {}; const out = [];
  lines.slice().sort(qOrder).forEach(r => {
    if (!(r.project_id in run)) run[r.project_id] = num((posOf(r.project_id) || {}).headroom);
    const head = run[r.project_id]; const net = num(r.net_amount);
    const shortfall = Math.max(net - Math.max(head, 0), 0);
    out.push({ r, head, shortfall }); run[r.project_id] = head - net;
  });
  return out;
}

/* ---------- Excel-style quick entry ---------- */
const GCOLS = ['p', 'y', 'c', 'bill', 'g', 't', 'd', 'pr', 'co'];
const gBlank = () => ({ p: '', y: '', c: 'labour', bill: '', g: '', t: '', d: '', pr: 'normal', co: '', dr: 'client_inflow_delayed', ds: '' });
function gRows() { if (!S.ui.grid) S.ui.grid = Array.from({ length: 8 }, gBlank); return S.ui.grid; }
function gPayeeMap() { return payeeLabelMap(); }
function gPayeeId(label, labels) {
  const v = (label || '').trim(); if (!v) return null; if (labels[v]) return labels[v];
  const k = Object.keys(labels).find(x => x.toLowerCase() === v.toLowerCase()); return k ? labels[k] : null;
}
function gCalc() {
  const labels = gPayeeMap(); const run = {}, avail = {};
  return gRows().map(r => {
    const empty = !r.p && !r.y && !r.g && !r.bill;
    const net = num(r.g) - num(r.t);
    const o = { empty, net, dev: false, ok: false, msg: '', payee: gPayeeId(r.y, labels) };
    if (empty) return o;
    if (!r.p) { o.msg = 'Select project'; return o; }
    if (!o.payee) { o.msg = r.y ? 'Payee not in list' : 'Pick payee'; return o; }
    if (num(r.g) <= 0 || net <= 0) { o.msg = 'Check amount'; return o; }
    if (!r.co) { o.msg = 'Select paying company'; return o; }
    { const py = payeeOf(o.payee);
      if (py && py.subcontractor_id) {
        if (!r.bill) { o.msg = 'Select Bill ref'; return o; }
        const sid = py.subcontractor_id, L = LG[sid];
        if (!L) { gLoadLedger(sid); o.msg = 'Checking RA ledger…'; return o; }
        if (!(sid in avail)) avail[sid] = ledgerCalc(sid, L.d, null).available;
        if (r.bill === 'Against RA') {
          if (net > avail[sid] + 0.5) { o.msg = avail[sid] <= 0.5 ? 'No RA balance left — raise as Advance' : `Exceeds RA balance ${inr0(avail[sid])}`; return o; }
          o.note = `RA balance after: ${inr0(avail[sid] - net)}`;
        }
        avail[sid] -= net;
      } }
    if (!(r.p in run)) run[r.p] = num((posOf(r.p) || {}).headroom) - pendingNet(r.p, null);
    o.dev = net > Math.max(run[r.p], 0); run[r.p] -= net; o.ok = true; return o;
  });
}

const gLoading = new Set();
function gLoadLedger(sid) {
  if (gLoading.has(sid)) return; gLoading.add(sid);
  loadLedger(sid).then(d => { LG[sid] = LG[sid] || { t: Date.now(), d }; }).catch(() => { LG[sid] = { t: Date.now(), d: { bills: [], pays: [], billed: 0, ledgerSettled: 0, advance: 0, excess: 0 } }; })
    .finally(() => { gLoading.delete(sid); if (S.tab === 'reqs' && S.ui.gridOpen) gUpdate(); });
}
function gUpdate() {
  const calc = gCalc(); let n = 0, tot = 0;
  calc.forEach((o, i) => {
    const net = $('#g-net-' + i), chk = $('#g-chk-' + i); if (!net || !chk) return;
    net.textContent = o.empty || !(o.net > 0) ? '—' : inr(o.net);
    chk.innerHTML = o.empty ? '' : o.ok ? ((o.dev ? '<span class="badge b-dev">Deviation</span>' : '<span class="badge b-green">In inflow</span>') + (o.note ? `<div class="mut" style="font-size:11px">${esc(o.note)}</div>` : '')) : `<span class="bad" style="font-size:12px">${esc(o.msg)}</span>`;

    if (o.ok) { n++; tot += o.net; }

}
function gParseDate(v) {
  v = (v || '').trim(); let m;
  if ((m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  if ((m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/))) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  return '';
}
function gPaste(el, text) {
  const rows = gRows(); let r0 = +el.dataset.r, c0 = Math.max(GCOLS.indexOf(el.dataset.c), 0);
  const lines = text.replace(/\r/g, '').split('\n').filter((l, i, a) => l.length || i < a.length - 1);
  lines.forEach((line, li) => {
    while (rows.length <= r0 + li) rows.push(gBlank());
    const row = rows[r0 + li];
    line.split('\t').forEach((cell, ci) => {
      const col = GCOLS[c0 + ci]; if (!col) return; const v = cell.trim();
      if (col === 'p') { const pr = S.projects.find(x => x.name.toLowerCase() === v.toLowerCase()) || S.projects.find(x => v && x.name.toLowerCase().includes(v.toLowerCase())); row.p = pr ? pr.id : ''; }
      else if (col === 'c') { const k = Object.entries(CATS).find(([k2, l]) => k2 === v.toLowerCase() || l.toLowerCase().startsWith(v.toLowerCase()) && v); row.c = k ? k[0] : row.c; }
      else if (col === 'g' || col === 't') row[col] = v.replace(/[₹,\s]/g, '');
      else if (col === 'd') row.d = gParseDate(v);
      else if (col === 'co') { const k = COMPANIES.find(x => x.toLowerCase() === v.toLowerCase()) || COMPANIES.slice().sort((a, b) => b.length - a.length).find(x => v && x.toLowerCase().includes(v.toLowerCase())) || (v && COMPANIES.find(x => x.toLowerCase().includes(v.toLowerCase()))); row.co = k || ''; }
      else if (col === 'pr') row.pr = /urg/i.test(v) ? 'urgent' : 'normal';
      else if (col === 'bill') row.bill = /^adv/i.test(v) ? 'Advance' : /^(ra\b|ra[ -]?\d|against)/i.test(v) ? 'Against RA' : v;
      else row[col] = v;
    });
  });
  $('#grid-body').innerHTML = gBodyHtml(); gUpdate();
}


/* ---------- subcontractor ledger panel (read-only, from CAMELS) ---------- */
const LG = {};
async function loadLedger(subId) {
  const c = LG[subId]; if (c && Date.now() - c.t < 60000) return c.d;
  const [bills, pays] = await Promise.all([
    qry(sb.from('ra_bills').select('id,bill_no,bill_ref,period_from,period_to,status,debit_amount,gst_pct,ra_work_orders!inner(wo_ref,subcontractor_id,retention_pct,tds_pct,safety_pct,safety_amount,gst_pct,ra_projects(name)),ra_bill_line_entries(this_qty,ra_wo_line_items(agreed_rate))')
      .eq('ra_work_orders.subcontractor_id', subId).in('status', ['submitted', 'approved', 'paid']).is('deleted_at', null).order('period_to', { ascending: true })),
    qry(sb.from('ra_payments').select('id,bill_id,amount_paid,tds_amount,date_paid,payment_type,paying_company').eq('subcontractor_id', subId).order('date_paid', { ascending: true }))
  ]);
  const B = (bills || []).map(b => {
    const wo = b.ra_work_orders || {};
    const sub = (b.ra_bill_line_entries || []).reduce((t, e) => t + num(e.this_qty) * num((e.ra_wo_line_items || {}).agreed_rate), 0);
    const ded = sub * ((num(wo.retention_pct) + num(wo.tds_pct) + num(wo.safety_pct)) / 100) + (wo.safety_pct ? 0 : num(wo.safety_amount)) + num(b.debit_amount);
    const gp = (b.gst_pct !== null && b.gst_pct !== undefined) ? num(b.gst_pct) : num(wo.gst_pct);
    return { id: b.id, short: `${b.bill_ref || 'Bill ' + b.bill_no} · ${wo.wo_ref || ''}`.trim(), project: (wo.ra_projects || {}).name || '', to: b.period_to, status: b.status, net: sub - ded + sub * gp / 100, direct: 0, alloc: 0 };
  });
  const P = (pays || []);
  // TDS noted on a payment counts as settled only beyond what the bills already deducted as TDS (a bill's net is already after its own TDS)
  const billTds = (bills || []).reduce((t, b) => { const wo = b.ra_work_orders || {}; return t + (b.ra_bill_line_entries || []).reduce((q, e) => q + num(e.this_qty) * num((e.ra_wo_line_items || {}).agreed_rate), 0) * num(wo.tds_pct) / 100; }, 0);
  const payTds = (pays || []).reduce((t, p) => t + num(p.tds_amount), 0);
  const tdsF = payTds > 0 ? Math.max(0, payTds - billTds) / payTds : 0;
  const settledOf = p => num(p.amount_paid) + num(p.tds_amount) * tdsF;
  P.filter(p => p.bill_id).forEach(p => { const b = B.find(x => x.id === p.bill_id); if (b) b.direct += settledOf(p); });
  let pool = sum(P.filter(p => !p.bill_id || !B.find(x => x.id === p.bill_id)), settledOf);
  B.forEach(b => { const room = Math.max(b.net - b.direct, 0); const a = Math.min(room, pool); b.alloc = a; pool -= a; });
  B.forEach(b => { b.settled = b.direct + b.alloc; b.pending = Math.max(b.net - b.settled, 0); });
  const d = { bills: B, pays: P, billed: sum(B, b => b.net), ledgerSettled: sum(P, settledOf), advance: sum(P.filter(p => p.payment_type === 'advance'), p => p.amount_paid), excess: pool };
  LG[subId] = { t: Date.now(), d }; return d;
}
/* requests raised in this app for the same subcontractor (any payee row linked to it) */
function subReqs(subId, excludeId) {
  const ids = new Set(S.payees.filter(p => p.subcontractor_id === subId).map(p => p.id));
  return S.reqs.filter(r => ids.has(r.payee_id) && r.id !== excludeId);
}
function ledgerCalc(subId, d, excludeId) {
  const R = subReqs(subId, excludeId);
  const pipe = R.filter(r => ['draft', 'submitted', 'approved', 'batched', 'verified', 'released'].includes(r.status))
    .map(r => ({ r, amt: r.status === 'draft' || r.status === 'submitted' ? num(r.net_amount) : num(r.approved_amount) }));
  // paid through this app but not yet recorded in the CAMELS ledger (skip if the same amount+date is already in the ledger)
  const modPaid = R.filter(r => r.status === 'paid').filter(r => !d.pays.some(p => Math.abs(num(p.amount_paid) - num(r.paid_amount)) < 0.5 && p.date_paid === r.paid_date))
    .map(r => ({ r, amt: num(r.paid_amount) + ((!r.parent_id && Math.abs(num(r.paid_amount) - num(r.net_amount)) < 0.01) ? num(r.tds_amount) : 0) }));
  const modTotal = sum(modPaid, x => x.amt), pipeTotal = sum(pipe, x => x.amt);
  const outstanding = d.billed - d.ledgerSettled - modTotal;
  return { pipe, pipeTotal, modPaid, modTotal, outstanding, available: outstanding - pipeTotal };
}

  return `<div class="lg"><h4>Ledger — ${esc(py.name)} · from CAMELS (read-only)</h4>
    ${d.bills.length ? `<div class="tw"><table><thead><tr><th>Bill</th><th class="r">Net bill</th><th class="r">Settled</th><th class="r">Pending</th></tr></thead><tbody>${rows}
      <tr class="tot"><td>Total</td><td class="r amt">${inr0(d.billed)}</td><td class="r amt">${inr0(d.ledgerSettled + c.modTotal)}</td><td class="r amt">${inr0(sum(d.bills, b => b.pending))}</td></tr></tbody></table></div>` : '<div style="margin:4px 0">No submitted or approved RA bills in CAMELS yet for this subcontractor.</div>'}

      ${c.pipe.length ? `<span>Already requested, not yet paid (${c.pipe.length})</span><b class="amt">${inr0(c.pipeTotal)}</b><span>Available to request</span><b class="amt">${inr0(c.available)}</b>` : ''}</div>
    ${(() => { const m = {}; (d.pays || []).forEach(x => { const k = x.paying_company || 'Company not tagged'; m[k] = (m[k] || 0) + num(x.amount_paid) + num(x.tds_amount); }); const e = Object.entries(m); return e.length ? `<div style="margin:6px 0;font-size:12.5px"><b>Paid by company:</b> ${e.map(([k, v]) => esc(k) + ' ' + inr0(v)).join(' · ')}</div>` : ''; })()}
    ${d.excess > 0.5 ? `<div class="okh">Payments exceed bills by ${inr0(d.excess)} — advance still to be adjusted.</div>` : ''}
    <div id="rf-lghint"></div></div>`;

function ceoCard(x) {
  const r = x.r, dev = x.shortfall > 0, pn = S.ui.panel[r.id] || {};
  const bank = bankOf(r.dev_funding_account_id);
  const panel = pn.mode ? `<div style="margin-top:10px;padding:10px;background:var(--paper-2);border-radius:8px">
      ${pn.mode === 'approve' && dev ? `<label style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px"><input type="checkbox" data-act="devok" data-id="${r.id}" ${pn.devok ? 'checked' : ''}><span><b>I approve this deviation</b> — ${inr(x.shortfall)} above client inflow, to be funded from OD (bank chosen when the payment sheet is made).</span></label>` : ''}
      ${pn.mode === 'approve' ? `<div class="field"><label>Approve amount (₹) — reduce for part payment</label><input type="number" step="0.01" data-live="pamt" data-id="${r.id}" value="${esc(pn.amount ?? r.net_amount)}"></div>` : ''}
      <div class="field"><label>Remark ${pn.mode === 'approve' && !dev ? '(optional)' : '(required)'}</label><input data-live="prem" data-id="${r.id}" value="${esc(pn.remark || '')}" placeholder="${pn.mode === 'return' ? 'What should the owner fix?' : pn.mode === 'reject' ? 'Reason for rejecting' : 'e.g. OK, OD funds, client RA due 12 Nov'}"></div>
      <div class="row"><button class="btn ${pn.mode === 'approve' ? 'g' : pn.mode === 'reject' ? 'd' : 'a'}" data-act="ceoconfirm" data-id="${r.id}">Confirm ${pn.mode}</button><button class="btn" data-act="ceopanel" data-id="${r.id}" data-m="">Back</button></div></div>` : '';
  return `<div class="card ${dev ? 'dev' : 'ok'}">
    <div class="row"><div><div class="mono" style="font-size:12px" >${esc(r.req_no)} ${r.priority === 'urgent' ? '<span class="badge b-warn">Urgent</span>' : ''}</div><div style="font-size:16px"><b>${esc(r.payee_name)}</b></div>
      <div class="mut">${esc(CATS[r.category])}${r.bill_ref ? ' · Bill ' + esc(r.bill_ref) : ''}${r.due_date ? ' · due ' + fdate(r.due_date) : ''}</div>${r.description ? `<div style="margin-top:3px">${esc(r.description)}</div>` : ''}</div>
      <span class="sp"></span><div style="text-align:right"><div class="big amt">${inr(r.net_amount)}</div><div class="mut" style="font-size:12px">Gross ${inr(r.gross_amount)}${num(r.tds_amount) ? ' · TDS ' + inr(r.tds_amount) : ''}${num(r.other_deduction) ? ' · other ' + inr(r.other_deduction) : ''}</div></div></div>
    ${dev ? `<div class="gate dev"><b>DEVIATION — ${inr(x.shortfall)} above client inflow.</b> Headroom before this line: ${inr(Math.max(x.head, 0))}.<br>Reason: ${esc(DEV_REASONS[r.dev_reason_code] || '—')} · Funding: ${esc(bank ? bank.label : '—')}${r.dev_expected_inflow_date ? ` · Expected inflow ${fdate(r.dev_expected_inflow_date)}${r.dev_expected_inflow_amount ? ' (' + inr0(r.dev_expected_inflow_amount) + ')' : ''}` : ''}${r.dev_note ? `<br>Note: ${esc(r.dev_note)}` : ''}</div>`
      : `<div class="gate ok">Within client inflow — headroom before this line ${inr(x.head)}.</div>`}
    ${role() === 'ceo' ? (pn.mode ? panel : `<div class="row"><button class="btn g" data-act="ceopanel" data-id="${r.id}" data-m="approve">Approve</button><button class="btn a" data-act="ceopanel" data-id="${r.id}" data-m="return">Return to owner</button><button class="btn d" data-act="ceopanel" data-id="${r.id}" data-m="reject">Reject</button></div>`) : ''}
  </div>`;
}
function vAppr() {

        const r = x.r, dev = x.shortfall > 0, bank = bankOf(r.dev_funding_account_id);
        return `<tr class="${dev ? 'dv' : ''}">
          ${isCeo ? `<td><input type="checkbox" data-act="csel" data-id="${r.id}" ${S.ui.csel.has(r.id) ? 'checked' : ''}></td>` : ''}
          <td class="mono"><a href="#" data-act="detail" data-id="${r.id}">${esc(r.req_no)}</a>${r.priority === 'urgent' ? ' <span class="badge b-warn">Urgent</span>' : ''}</td>
          <td class="wr"><b>${esc(r.payee_name)}</b> <span class="mut" style="font-size:12px">${esc(CATS[r.category] || r.category)}${r.bill_ref ? ' · ' + esc(r.bill_ref) : ''}</span>${r.description ? `<div class="mut" style="font-size:11.5px">${esc(r.description)}</div>` : ''}</td>
          <td>${r.due_date ? fdate(r.due_date) : ''}</td>
          <td class="r amt">${inr(r.gross_amount)}</td><td class="r amt">${num(r.tds_amount) ? inr(r.tds_amount) : '—'}</td><td class="r amt"><b>${inr(r.net_amount)}</b></td>
          ${isCeo ? `<td class="r"><input class="ci" type="number" step="0.01" min="0" data-live="camt" data-id="${r.id}" value="${esc(S.ui.camt[r.id] !== undefined ? S.ui.camt[r.id] : r.net_amount)}" title="Approve a lower amount for a part payment"></td>` : ''}
          <td title="${dev ? esc((DEV_REASONS[r.dev_reason_code] || '') + (r.dev_expected_inflow_date ? ' · expected inflow ' + fdate(r.dev_expected_inflow_date) : '') + (r.dev_note ? ' · ' + r.dev_note : '')) : ''}">${dev ? `<span class="badge b-dev">Deviation ${inr0(x.shortfall)}</span> ${bank ? `<span class="mut" style="font-size:11.5px">${esc(bank.label.replace(/ Bank.*| \(.*/, ''))}</span>` : ''}${r.dev_note ? `<div class="mut" style="font-size:11px;max-width:230px;white-space:normal">${esc(DEV_REASONS[r.dev_reason_code] || '')}${r.dev_expected_inflow_date ? ' · inflow ' + fdate(r.dev_expected_inflow_date) : ''}</div>` : ''}` : '<span class="badge b-green">In inflow</span>'}</td>
          ${isCeo ? `<td><button class="btn g s" data-act="crow" data-m="approve" data-id="${r.id}" title="Approve">✓</button> <button class="btn a s" data-act="crow" data-m="return" data-id="${r.id}" title="Return to owner">↩</button> <button class="btn d s" data-act="crow" data-m="reject" data-id="${r.id}" title="Reject">✕</button></td>` : ''}</tr>`;
      }).join('');
  }).join('');
  return `<div class="row" style="margin-bottom:10px"><h2>${isCeo ? 'Awaiting your approval' : 'CEO approval queue'}</h2><span class="sp"></span>
    ${canSubmit() && Q.length ? `<button class="btn a" data-act="wa-ceo">Remind CEO on WhatsApp</button>` : ''}
    ${isCeo && Q.length ? `<button class="btn g" data-act="cbatch" data-m="sel" ${selQ.length ? '' : 'disabled'}>Approve selected (${selQ.length} · ${inr0(sum(selQ, amtOf))})</button><button class="btn p" data-act="cbatch" data-m="all">Approve all (${Q.length} · ${inr0(sum(Q, amtOf))})</button>` : ''}</div>
    ${Q.length ? `<div class="note ${devN.length ? 'red' : 'blue'}">${Q.length} payment${Q.length > 1 ? 's' : ''} · ${inr0(sum(Q, x => x.r.net_amount))}${devN.length ? ` · <b>${devN.length} deviation${devN.length > 1 ? 's' : ''}</b> (${inr0(sum(devN, x => x.shortfall))} above client inflow, shaded red)` : ' · all within client inflow'}. Ordered urgent-first, then by due date; headroom is consumed in that order.${isCeo ? ' Tick rows and press <b>Approve selected</b>, or edit the <b>Approve ₹</b> box for a part payment. Approving a red deviation line also approves the deviation (funded from OD) — no extra pop-up.' : ''}</div>` : ''}
    ${Q.length ? `<div class="card" style="padding:6px"><div class="tw"><table class="ctbl"><thead><tr>${isCeo ? `<th><input type="checkbox" data-act="cselall" ${Q.length && selQ.length === Q.length ? 'checked' : ''}></th>` : ''}<th>Ref</th><th>Payee</th><th>Due</th><th class="r">Gross</th><th class="r">TDS</th><th class="r">Net</th>${isCeo ? '<th class="r">Approve ₹</th>' : ''}<th>Inflow check</th>${isCeo ? '<th></th>' : ''}</tr></thead><tbody>${body}</tbody>
      <tfoot><tr><td colspan="${isCeo ? 6 : 4}" class="r"><b>Total</b></td><td class="r amt"><b>${inr(sum(Q, x => x.r.net_amount))}</b></td>${isCeo ? `<td class="r amt"><b>${inr(sum(Q, amtOf))}</b></td>` : ''}<td></td>${isCeo ? '<td></td>' : ''}</tr></tfoot></table></div></div>` : '<div class="card empty">Nothing is waiting for approval.</div>'}
    ${(() => { const E = S.reqs.filter(isExpired); return isCeo && E.length ? `<div class="card" style="margin-top:14px;border-left:4px solid var(--red,#C0392B)"><div class="row"><h3 style="margin:0">Approvals past ${validDays()} days — payment on hold</h3><span class="sp"></span><button class="btn p" data-act="reconfirm" data-all="1">Reconfirm all (${E.length} · ${inr0(sum(E, r => r.approved_amount))})</button></div><div class="tw"><table class="ctbl"><tbody>${E.map(r => `<tr><td class="mono">${esc(r.req_no)}</td><td>${esc(r.project_name)}</td><td>${esc(r.payee_name)}</td><td class="r amt">${inr(r.approved_amount)}</td><td>approved ${fdate(r.ceo_at.slice(0, 10))}</td><td><button class="btn g s" data-act="reconfirm" data-id="${r.id}">Reconfirm</button></td></tr>`).join('')}</tbody></table></div></div>` : ''; })()}
    <h3 style="margin:22px 0 8px">Recent decisions</h3><div class="card"><div class="tw"><table class="ctbl"><thead><tr><th>Ref</th><th>Project</th><th>Payee</th><th class="r">Net</th><th class="r">Approved</th><th>Decision</th><th>When</th><th>Remark</th></tr></thead><tbody>
    ${recent.map(r => `<tr><td class="mono"><a href="#" data-act="detail" data-id="${r.id}">${esc(r.req_no)}</a></td><td>${esc(r.project_name)}</td><td>${esc(r.payee_name)}</td><td class="r amt">${inr(r.net_amount)}</td><td class="r amt">${r.orig_approved || r.approved_amount ? inr(r.orig_approved || r.approved_amount) : '—'}</td><td>${r.ceo_decision === 'approved' ? (r.deviation_approved ? '<span class="badge b-dev">Approved · deviation</span>' : '<span class="badge b-approved">Approved</span>') : r.ceo_decision === 'rejected' ? '<span class="badge b-rejected">Rejected</span>' : '<span class="badge b-warn">Returned</span>'}</td><td>${fdt(r.ceo_at)}</td><td>${esc(r.ceo_remark || '')}</td></tr>`).join('') || '<tr><td colspan="8" class="empty">No decisions yet.</td></tr>'}</tbody></table></div></div>`;
}

/* ---------- batches (accounts / owner) ---------- */
function bpayOf(r) { const v = S.ui.bpay[r.id]; return v === undefined || v === '' ? num(r.approved_amount) : num(v); }
const validDays = () => num(S.settings.approval_valid_days || 30);
const isExpired = r => r.status === 'approved' && r.ceo_at && Math.floor(daysSince(r.ceo_at)) >= validDays();
function approvalRows() {
  const fam = {}; S.reqs.forEach(r => { const k = r.parent_id || r.id; (fam[k] = fam[k] || []).push(r); });
  return S.reqs.filter(r => !r.parent_id && (r.ceo_decision === 'approved' || r.approved_amount) && !r.is_backfill).map(r => {
    const F = fam[r.id] || [r], live = F.filter(x => x.status !== 'cancelled');
    const paid = sum(live.filter(x => x.status === 'paid'), x => x.paid_amount != null ? x.paid_amount : x.approved_amount);
    const insheet = sum(live.filter(x => ['batched', 'verified', 'released'].includes(x.status)), x => x.approved_amount);
    const pending = sum(live.filter(x => x.status === 'approved'), x => x.approved_amount);
    const released = Math.max(num(r.orig_approved || r.approved_amount) - paid - insheet - pending, 0);
    const age = r.ceo_at ? Math.floor(daysSince(r.ceo_at)) : 0;
    return { r, orig: num(r.orig_approved || r.approved_amount), paid, insheet, pending, released, age, left: validDays() - age };
  }).filter(x => x.pending > 0 || x.insheet > 0).sort((a, b) => a.left - b.left);
}
function approvalTracker(title) {
  const A = approvalRows(); if (!A.length) return `<div class="card"><h3 style="margin-bottom:6px">${title}</h3><div class="empty">No CEO approvals are open — everything approved has been paid or released.</div></div>`;
  return `<div class="card"><h3 style="margin-bottom:6px">${title}</h3><div class="tw"><table class="ctbl"><thead><tr><th>Ref</th><th>Project</th><th>Payee</th><th class="r">CEO approved</th><th class="r">Paid so far</th><th class="r">In payment sheets</th><th class="r">Pending</th><th>Approved on</th><th>Valid for</th></tr></thead><tbody>
  ${A.map(x => `<tr><td class="mono"><a href="#" data-act="detail" data-id="${x.r.id}">${esc(x.r.req_no)}</a></td><td>${esc(x.r.project_name)}</td><td>${esc(x.r.payee_name)}</td><td class="r amt">${inr(x.orig)}</td><td class="r amt">${inr(x.paid)}</td><td class="r amt">${inr(x.insheet)}</td><td class="r amt"><b>${inr(x.pending)}</b></td><td>${fdate(x.r.ceo_at.slice(0, 10))}</td><td>${x.pending <= 0 ? '<span class="mut">—</span>' : x.left <= 0 ? '<span class="badge b-rejected">Expired — reconfirm</span>' : `<span class="badge ${x.left <= 7 ? 'b-warn' : 'b-open'}">${x.left} day${x.left === 1 ? '' : 's'} left</span>`}</td></tr>`).join('')}
  <tr><td colspan="3"><b>Total</b></td><td class="r amt"><b>${inr(sum(A, x => x.orig))}</b></td><td class="r amt"><b>${inr(sum(A, x => x.paid))}</b></td><td class="r amt"><b>${inr(sum(A, x => x.insheet))}</b></td><td class="r amt"><b>${inr(sum(A, x => x.pending))}</b></td><td colspan="2"></td></tr></tbody></table></div></div>`;
}
function ageTag(r) {
  if (isExpired(r)) return '<div><span class="badge b-rejected">Expired — CEO to reconfirm</span></div>';
  if (!r.ceo_at) return '';
  const d = Math.floor(daysSince(r.ceo_at)), am = num(S.settings.approval_age_amber || 7), left = validDays() - d;
  const c = left <= am ? 'b-warn' : 'b-open';
  return `<div><span class="badge ${c}">${d === 0 ? 'today' : d + ' day' + (d === 1 ? '' : 's') + ' old'} · ${left} left</span></div>`;
}
function approvedSummary(appr) {
  const by = {}; appr.forEach(r => { (by[r.project_id] = by[r.project_id] || []).push(r); });
  const ids = Object.keys(by); if (!ids.length) return '';
  return `<div class="card"><h3 style="margin-bottom:6px">Approved, not yet paid — held against client inflow</h3><div class="tw"><table class="ctbl"><thead><tr><th>Project</th><th class="r">Lines</th><th class="r">Approved unpaid</th><th class="r">Oldest approval</th><th>Next planned date</th><th class="r">Headroom now</th></tr></thead><tbody>
    ${ids.map(pid => { const L = by[pid], p = posOf(pid) || {}, old = Math.floor(Math.max(...L.map(r => r.ceo_at ? daysSince(r.ceo_at) : 0))), pl = L.map(r => r.planned_pay_date).filter(Boolean).sort()[0];
      return `<tr><td><b>${esc(L[0].project_name)}</b></td><td class="r">${L.length}</td><td class="r amt"><b>${inr(sum(L, r => r.approved_amount))}</b></td><td class="r">${old} day${old === 1 ? '' : 's'}</td><td>${pl ? fdate(pl) : '<span class="mut">not planned</span>'}</td><td class="r amt ${headClass(p.headroom)}">${inr(p.headroom)}</td></tr>`; }).join('')}
    <tr><td><b>Total</b></td><td class="r">${appr.length}</td><td class="r amt"><b>${inr(sum(appr, r => r.approved_amount))}</b></td><td colspan="3"></td></tr></tbody></table></div>
    <p class="mut" style="font-size:12px;margin:8px 0 0">Approved amounts stay reserved until paid or released. Use <b>Release</b> on a line you no longer plan to pay.</p></div>`;
}
function bsumHtml() {
  const appr = S.reqs.filter(r => r.status === 'approved'), sel = appr.filter(r => S.ui.bsel.has(r.id));
  return `Total approved, awaiting payment <b>${inr(sum(appr, r => r.approved_amount))}</b> · planned in this sheet <b>${inr(sum(sel, bpayOf))}</b> (${sel.length}) · balance stays approved <b>${inr(sum(sel, r => num(r.approved_amount) - bpayOf(r)))}</b>`;

function updBpay() { const e = $('#bk-sum'); if (e) e.innerHTML = bsumHtml(); }
function vBatches() {

      <td><b>${esc(r.payee_name)}</b>${miss ? '<div class="bad" style="font-size:11px">Bank a/c or IFSC missing</div>' : ''}${r.fail_note ? `<div class="bad" style="font-size:11px">Bank: ${esc(r.fail_note)}</div>` : ''}${r.partner_status === 'returned' ? `<div class="bad" style="font-size:11px">JH: ${esc(r.partner_remark)}</div>` : ''}</td>
      <td class="r amt">${inr(orig)}${num(r.net_amount) !== orig && !r.parent_id ? `<div class="mut" style="font-size:11px">requested ${inr(r.net_amount)}</div>` : ''}</td>
      <td class="r amt"><b>${inr(r.approved_amount)}</b>${orig !== num(r.approved_amount) ? `<div class="mut" style="font-size:11px">balance after part payment</div>` : ''}</td>
      <td class="r"><input class="ci" type="number" step="0.01" min="0" data-live="bpay" data-id="${r.id}" value="${esc(S.ui.bpay[r.id] !== undefined ? S.ui.bpay[r.id] : r.approved_amount)}" style="width:116px;text-align:right" title="Amount to pay today — less than the approved balance for a part payment"></td>

      <td>${r.is_deviation ? `<span class="badge b-dev">Deviation</span>${bank ? `<div class="mut" style="font-size:11px">fund from ${esc(bank.label)}</div>` : '<div class="mut" style="font-size:11px">pay from the OD account</div>'}` : ''}</td><td>${fdt(r.ceo_at)}${ageTag(r)}</td>
      <td><button class="btn s" data-act="relbal" data-id="${r.id}" title="Cancel the unused approval so it stops counting against inflow">Release</button></td></tr>`;
  }).join('');
  const batches = S.batches.filter(b => b.status !== 'cancelled').slice(0, 60);
  return `<div class="row" style="margin-bottom:10px"><h2>Daily payment sheets</h2></div>
  ${approvalTracker('CEO approvals — paid so far and pending')}
  ${approvedSummary(appr)}
  <div class="card"><h3 style="margin-bottom:8px">Approved by CEO — plan today's payments</h3>
    <p class="mut" style="margin:0 0 8px;font-size:12.5px">Tick the lines to pay today. <b>Pay now ₹</b> can be lower than the approved balance — the rest stays approved for a later sheet (split payments), or press <b>Release</b> to drop an unused balance.</p>
    <div class="tw"><table><thead><tr><th><input type="checkbox" data-act="selallbatch"></th><th>Ref</th><th>Project</th><th>Payee</th><th class="r">CEO approved</th><th class="r">Balance</th><th class="r">Pay now ₹</th><th>Planned date</th><th>Flags</th><th>CEO approved</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="11" class="empty">No approved payments waiting.</td></tr>'}</tbody></table></div>
    ${appr.length ? `<div class="row" style="margin-top:12px"><select id="bk-bank" style="width:auto" data-live="bankpick">${S.banks.filter(b => b.is_active).map(b => `<option value="${b.id}" ${pick === b.id ? 'selected' : ''}>Pay from ${esc(b.label)}</option>`).join('')}</select>
      <input id="bk-date" type="date" style="width:auto" value="${esc(S.ui.payDate || todayISO())}" data-live="paydate"><span class="sp"></span><span class="mut" id="bk-sum">${bsumHtml()}</span>
      <button class="btn p" data-act="mkbatch" ${S.ui.bsel.size ? '' : 'disabled'}>Create payment sheet</button></div>` : ''}</div>
  ${batches.map(batchCard).join('') || '<div class="card empty">No payment sheets yet.</div>'}`;
}
function batchCard(b) {
  const L = linesOf(b.id); const bank = bankOf(b.bank_account_id); const open = S.ui.openBatch === b.id;
  const total = sum(L, r => r.approved_amount);
  let body = '';
  if (open) {
    const ledgers = [...new Set(L.map(r => { const p = payeeOf(r.payee_id); return (p && p.tally_ledger_name) || r.payee_name; }))];
    const rows = L.map(r => {

/* ---------- AUTO PAYMENT SHEET: weekly food advance from the EAGLES DLR ---------- */
const AUTO_RATE = 1200;   // ₹ per person, per week
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
function A() {
  if (!S.ui.auto) { const to = addDays(todayISO(), -1); S.ui.auto = { from: addDays(to, -6), to, rate: AUTO_RATE, onlySub: true, raw: [], alias: {}, loaded: false, loading: false, err: '', sel: new Set(), amt: {}, pov: {} }; }
  return S.ui.auto;
}
async function autoLoad() {
  const a = A(); if (a.loading) return; a.loading = true; a.err = ''; renderMain();
  try {
    const [res, al] = await Promise.all([sb.functions.invoke('dlr-feed', { body: { from: a.from, to: a.to } }), qry(sb.from('pay_dlr_alias').select('*'))]);
    if (res.error) { let m = res.error.message; try { const j = await res.error.context.json(); m = j.error || m; } catch (e) {} throw new Error(m); }
    if (res.data && res.data.error) throw new Error(res.data.error);
    a.raw = (res.data && res.data.rows) || []; a.alias = Object.fromEntries(al.map(x => [x.dlr_name, x.payee_id])); a.sel = new Set(); a.amt = {};
  } catch (e) { a.err = cleanErr(e); a.raw = []; }
  a.loaded = true; a.loading = false; renderMain();
}
function autoProject(name) {
  const n = (name || '').trim().toLowerCase(); if (!n) return null;
  return S.projects.find(p => p.name.toLowerCase() === n) || S.projects.find(p => p.name.toLowerCase().includes(n) || n.includes(p.name.toLowerCase())) || null;
}
const nameWords = s => String(s || '').toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
function autoPayeeFor(r, a) {
  if (r.camels_id) { const p = S.payees.find(x => x.subcontractor_id === r.camels_id && x.is_active); if (p) return p; }
  const k = (r.subcontractor || '').trim().toLowerCase();
  if (a.alias[k]) { const p = payeeOf(a.alias[k]); if (p && p.is_active) return p; }
  if (k.length >= 3) { const hit = pickPayees().filter(p => nameWords(p.name).includes(k)); if (hit.length === 1) return hit[0]; }
  return null;
}
function autoRows() {
  const a = A(), groups = new Map(); let skipped = 0;
  a.raw.forEach(r => {
    if (a.onlySub && !r.submitted) { skipped++; return; }
    const py = autoPayeeFor(r, a), nm = (r.subcontractor || '').trim();
    const key = r.project + '|' + (py ? py.id : 'n:' + nm.toLowerCase());
    let g = groups.get(key); if (!g) { g = { key, eproj: r.project, names: new Set(), py, days: new Map() }; groups.set(key, g); }
    if (nm) g.names.add(nm); g.days.set(r.date, (g.days.get(r.date) || 0) + (Number(r.headcount) || 0));
  });
  const period = `${a.from} to ${a.to}`;
  const rows = [...groups.values()].map(g => {
    const worked = [...g.days.values()].filter(v => v > 0), n = worked.length, man = worked.reduce((x, y) => x + y, 0);
    const avg = n ? man / n : 0, people = Math.round(avg);
    const proj = S.projects.find(p => p.id === a.pov[g.eproj.toLowerCase()]) || autoProject(g.eproj);
    const amount = a.amt[g.key] != null ? num(a.amt[g.key]) : people * num(a.rate);
    const dup = g.py && proj ? S.reqs.find(q => q.payee_id === g.py.id && q.project_id === proj.id && String(q.description || '').startsWith('Food advance ' + period) && !['cancelled', 'rejected'].includes(q.status)) : null;
    let st = 'ok', msg = 'Ready';
    if (!g.py) { st = 'payee'; msg = 'Pick subcontractor'; } else if (!proj) { st = 'proj'; msg = 'Pick project'; }
    else if (!n) { st = 'zero'; msg = 'No people logged'; } else if (!(amount > 0)) { st = 'zero'; msg = 'Check amount'; } else if (dup) { st = 'dup'; msg = 'Already requested · ' + dup.req_no; }
    return { ...g, n, man, avg, people, proj, amount, st, msg, dup, daysTxt: [...g.days.entries()].sort().map(([d, v]) => d.slice(5) + ': ' + v).join('  ·  '), names: [...g.names] };
  }).sort((x, y) => (x.eproj + (x.py ? x.py.name : '~' + x.names[0])).localeCompare(y.eproj + (y.py ? y.py.name : '~' + y.names[0])));
  return { rows, skipped, period };
}
function vAuto() {
  const a = A(); const { rows, skipped, period } = autoRows();
  const starred = pickPayees().filter(p => p.subcontractor_id).sort((x, y) => x.name.localeCompare(y.name));
  const body = rows.map(r => {
    const ready = r.st === 'ok';
    const payeeCell = r.py ? `<b>${esc(r.py.name)}</b>${r.names.length && !r.names.some(n => n.toLowerCase() === r.py.name.toLowerCase()) ? `<div class="mut" style="font-size:11.5px">DLR: ${esc(r.names.join(', '))}</div>` : ''}`

    const projCell = r.proj ? esc(r.proj.name) : `<div class="mut" style="font-size:11.5px">EAGLES: ${esc(r.eproj)}</div><select data-act="autoproj" data-ep="${esc(r.eproj.toLowerCase())}"><option value="">Pick project…</option>${S.projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>`;
    return `<tr>
      <td><input type="checkbox" data-act="autosel" data-key="${esc(r.key)}" ${a.sel.has(r.key) && ready ? 'checked' : ''} ${ready ? '' : 'disabled'}></td>
      <td>${projCell}</td><td>${payeeCell}</td>
      <td class="r" title="${esc(r.daysTxt)}">${r.n}</td><td class="r amt" title="${esc(r.daysTxt)}">${r.n ? r.avg.toFixed(1) : '—'}</td><td class="r">${r.man}</td><td class="r">${r.people}</td>

/* ---------- payments register: what was paid, day by day ---------- */
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const RG = () => S.ui.rg || (S.ui.rg = { preset: 'today', from: '', to: '', company: '', project: '', cat: '', ver: 'all', q: '', sel: new Set() });
function rgRange() {
  const g = RG(), t = new Date(); t.setHours(12, 0, 0, 0);
  const add = n => { const x = new Date(t); x.setDate(x.getDate() + n); return ymd(x); };
  const dow = (t.getDay() + 6) % 7, today = ymd(t);
  switch (g.preset) {
    case 'yesterday': return { a: add(-1), b: add(-1) };
    case 'last7': return { a: add(-6), b: today };
    case 'week': return { a: add(-dow), b: today };
    case 'lastweek': return { a: add(-dow - 7), b: add(-dow - 1) };
    case 'month': return { a: today.slice(0, 8) + '01', b: today };
    case 'custom': return { a: g.from || today, b: g.to || g.from || today };
    default: return { a: today, b: today };
  }
}
const rgGross = r => num(r.paid_amount) + ((!r.parent_id && Math.abs(num(r.paid_amount) - num(r.net_amount)) < 0.01) ? num(r.tds_amount) : 0);
const rgNeedsVerify = r => r.is_backfill && !r.entry_verified_at;
function rgRows() {
  const g = RG(), { a, b } = rgRange(), q = g.q.toLowerCase();
  return S.reqs.filter(r => r.status === 'paid' && r.paid_date && r.paid_date >= a && r.paid_date <= b
    && (!g.company || (g.company === '__none' ? !r.paying_company : r.paying_company === g.company))
    && (!g.project || r.project_id === g.project) && (!g.cat || r.category === g.cat)
    && (g.ver === 'all' || (g.ver === 'unverified' ? rgNeedsVerify(r) : !rgNeedsVerify(r)))
    && (!q || (r.payee_name + ' ' + (r.utr || '') + ' ' + (r.bill_ref || '') + ' ' + (r.description || '') + ' ' + (r.req_no || '')).toLowerCase().includes(q)))
    .sort((x, y) => (y.paid_date > x.paid_date ? 1 : y.paid_date < x.paid_date ? -1 : String(y.paid_at || '').localeCompare(String(x.paid_at || ''))));
}
function vRegister() {
  const g = RG(), { a, b } = rgRange(), L = rgRows(), isOwner = role() === 'owner';

  const projs = [...new Map(S.reqs.filter(r => r.project_id).map(r => [r.project_id, r.project_name])).entries()].sort((x, y) => String(x[1]).localeCompare(String(y[1])));
  const net = sum(L, r => num(r.paid_amount)), gross = sum(L, rgGross), tds = gross - net, unv = L.filter(rgNeedsVerify);
  const by = (keyFn) => { const m = {}; L.forEach(r => { const k = keyFn(r); (m[k] = m[k] || { n: 0, v: 0 }); m[k].n++; m[k].v += num(r.paid_amount); }); return Object.entries(m).sort((x, y) => y[1].v - x[1].v); };

    <div class="row" style="margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <select data-act="rgsel" data-k="company" style="width:auto"><option value="">All companies</option>${COMPANIES.map(c => `<option ${g.company === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}<option value="__none" ${g.company === '__none' ? 'selected' : ''}>Company not tagged</option></select>
      <select data-act="rgsel" data-k="project" style="width:auto"><option value="">All projects</option>${projs.map(([id, n]) => `<option value="${id}" ${g.project === id ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <select data-act="rgsel" data-k="cat" style="width:auto"><option value="">All categories</option>${Object.entries(CATS).map(([k, l]) => `<option value="${k}" ${g.cat === k ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>

      <input id="rg-q" style="width:220px" placeholder="Search payee / UTR / ref" value="${esc(g.q)}" data-live="rgq"></div>

/* statement matcher: finds UTR-looking token + exact amount per line */
function matchStatement(rows, lines) {
  const used = new Set(), out = {};
  const toNum = v => { if (typeof v === 'number') return v; const s = String(v ?? '').replace(/[, ]/g, ''); return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : NaN; };
  const utrRe = /\b[A-Za-z]{4}[A-Za-z0-9]{9,}\b|\b\d{12,22}\b/;
  lines.forEach(r => {
    const first = String(r.payee_name || '').toLowerCase().split(/\s+/)[0] || '';
    const cands = rows.map((row, i) => ({ row, i })).filter(({ row, i }) => !used.has(i) && row.some(c => Math.abs(toNum(c) - num(r.approved_amount)) < 0.005));
    const pick = cands.find(({ row }) => first.length > 2 && row.some(c => String(c).toLowerCase().includes(first))) || cands[0];
    if (!pick) return; used.add(pick.i);
    const cell = pick.row.map(c => String(c ?? '')).map(c => (c.match(utrRe) || [])[0]).find(Boolean);
    let dateStr = ''; const d = pick.row.find(c => c instanceof Date); if (d) dateStr = d.toISOString().slice(0, 10);
    out[r.id] = { utr: cell || '', date: dateStr || todayISO() };
  });
  return out;
}

    const acct = $('#py-acct').value.replace(/\s/g, ''), ifsc = $('#py-ifsc').value.trim().toUpperCase();
    if (acct && !/^[0-9]{6,20}$/.test(acct)) return toast('Account number must be 6–20 digits', true);
    if (ifsc && !/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc)) return toast('IFSC looks wrong (e.g. ICIC0001234)', true);
    const row = { name, kind: $('#py-kind').value, tally_ledger_name: $('#py-tally').value.trim() || name, account_no: acct || null, ifsc: ifsc || null, bank_name: $('#py-bank').value.trim() || null, pan: $('#py-pan').value.trim() || null, gstin: $('#py-gst').value.trim() || null, is_active: $('#py-active').value === '1' };
    await guard(async () => {
      if (id) await qry(sb.from('pay_payees').update(row).eq('id', id)); else { const { data: { user } } = await sb.auth.getUser(); await qry(sb.from('pay_payees').insert({ ...row, created_by: user.id })); }
      closeModal(); toast('Payee saved'); await refresh();
    });
  },
  async syncpayees() { await guard(async () => { const n = await rpc('pay_sync_payees'); toast(`${n} subcontractor(s) imported`); await refresh(); }); },
  async reloadaudit() { S.audit = []; renderMain(); },
  /* admin */
  async grant() {
    const email = $('#gr-email').value.trim(), name = $('#gr-name').value.trim(), r = $('#gr-role').value; if (!email || !name) return toast('E-mail and name are required', true);
    await guard(async () => { await rpc('pay_grant_role', { p_email: email, p_role: r, p_name: name }); toast('Access granted'); $('#gr-email').value = ''; $('#gr-name').value = ''; await refresh(); });
  },
  async toggleuser(el) { await guard(async () => { await rpc('pay_set_user_active', { p_user: el.dataset.id, p_active: el.dataset.on === '1' }); toast('Updated'); await refresh(); }); },
  async savebank(el) {
    const id = el.dataset.id; await guard(async () => { await qry(sb.from('pay_bank_accounts').update({ label: $(`#bk-l-${id}`).value.trim(), account_kind: $(`#bk-k-${id}`).value, od_limit: $(`#bk-o-${id}`).value === '' ? null : num($(`#bk-o-${id}`).value), tally_ledger: $(`#bk-t-${id}`).value.trim() || null, is_active: $(`#bk-a-${id}`).value === '1' }).eq('id', id)); toast('Bank account saved'); await refresh(); });
  },
  async savesetting(el) { const k = el.dataset.k; await guard(async () => { await qry(sb.from('pay_settings').upsert({ key: k, value: $(`#st-${k}`).value.trim() })); toast('Saved'); await refresh(); }); }
};

/* ---------- event wiring ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'INPUT' && (el.type === 'radio' || el.type === 'file' || el.type === 'date' || el.type === 'number')) return;
  if (el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type === 'checkbox' && el.dataset.act !== 'selreq')) return;
  if (el.dataset.act === 'selreq') return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
/* ---------- payee picker (combobox) ---------- */
const PC = { el: null, input: null, scope: 'sug', items: [], idx: 0, userScope: false };
const pcKind = p => p.supplier_id ? 'supplier' : p.subcontractor_id ? 'subcontractor' : 'other';
const pcKindLbl = { supplier: 'Supplier', subcontractor: 'Subcontractor', other: 'Vendor' };
function pcCategory(inp) {
  const k = inp.dataset.pc;
  if (k === 'g') { const r = gRows()[+inp.dataset.r]; return r ? r.c : ''; }
  const c = $(k === 'rf' ? '#rf-cat' : '#pp-cat'); return c ? c.value : '';
}
function pcCandidates(inp) {
  const act = S.payees.filter(p => p.is_active), cat = pcCategory(inp);
  const q = (inp.value || '').trim().toLowerCase();
  const sugOf = p => { const k = pcKind(p); if (k === 'other') return true; if (!p.is_starred) return false; return cat === 'material' ? k === 'supplier' : (cat === 'subcontract' || cat === 'labour') ? k === 'subcontractor' : true; };
  let list;
  if (q) {
    const words = q.split(/\s+/).filter(Boolean);
    list = act.filter(p => { const hay = (p.name + ' ' + (p.gstin || '') + ' ' + (p.account_no || '').slice(-4)).toLowerCase(); return words.every(w => hay.includes(w)); });
    list.sort((a, b) => { const sa = sugOf(a) && a.is_starred ? 0 : a.is_starred ? 1 : 2, sb = sugOf(b) && b.is_starred ? 0 : b.is_starred ? 1 : 2; const st = (b.name.toLowerCase().startsWith(q) ? 1 : 0) - (a.name.toLowerCase().startsWith(q) ? 1 : 0); return st || sa - sb || a.name.localeCompare(b.name); });
    if (PC.scope === 'sup') list = list.filter(p => pcKind(p) === 'supplier'); else if (PC.scope === 'sub') list = list.filter(p => pcKind(p) === 'subcontractor');
  } else {
    if (PC.scope === 'sug') list = act.filter(sugOf); else if (PC.scope === 'sup') list = act.filter(p => pcKind(p) === 'supplier'); else if (PC.scope === 'sub') list = act.filter(p => pcKind(p) === 'subcontractor'); else list = act;
    list = list.slice().sort((a, b) => (b.is_starred ? 1 : 0) - (a.is_starred ? 1 : 0) || a.name.localeCompare(b.name));
  }
  return { list, q, cat };
}
function pcRender() {
  const inp = PC.input; if (!inp || !PC.el) return;
  const { list, q, cat } = pcCandidates(inp), LIM = 40;
  PC.items = list.slice(0, LIM); if (PC.idx >= PC.items.length) PC.idx = 0;
  const chips = [['sug', cat === 'material' ? '★ Material suppliers' : '★ Suggested'], ['sup', 'All suppliers'], ['sub', 'All subcontractors'], ['all', 'Everyone']];
  const sugNote = PC.scope === 'sug' && !q ? (cat === 'material' ? 'Starred suppliers for Material. Type to search un-starred ones too.' : 'Starred subcontractors and regular vendors. Type to search anyone.') : q ? `Searching all ${S.payees.filter(p => p.is_active).length} payees` : '';
  const rows = PC.items.map((p, i) => { const k = pcKind(p); const sub = [p.gstin ? 'GST ' + p.gstin : '', p.account_no ? 'a/c …' + p.account_no.slice(-4) : 'no bank details'].filter(Boolean).join(' · ');
    return `<div class="pc-it${i === PC.idx ? ' act' : ''}" data-pi="${i}"><div class="pc-main"><div class="pc-nm">${esc(p.name)}</div><div class="pc-sub">${esc(sub)}</div></div><span class="pc-ty ${k}">${pcKindLbl[k]}</span>${p.is_starred ? '<span class="pc-star" title="Starred">★</span>' : (k !== 'other' ? '<span class="pc-ns">not starred</span>' : '')}</div>`; }).join('');
  PC.el.innerHTML = `<div class="pc-top"><div class="pc-chips">${chips.map(([k, l]) => `<button type="button" class="pc-chip${PC.scope === k ? ' on' : ''}" data-ps="${k}">${l}</button>`).join('')}</div>${sugNote ? `<div class="pc-hint">${sugNote}</div>` : ''}</div>
    <div class="pc-list">${rows || `<div class="pc-empty">No payee matches “${esc(inp.value)}”.<br>Add new vendors under the <b>Payees</b> tab (bank a/c + IFSC needed).</div>`}</div>
    <div class="pc-foot">${list.length > LIM ? `Showing ${LIM} of ${list.length} — keep typing to narrow` : `${list.length} payee${list.length === 1 ? '' : 's'}`} · ↑↓ to move · Enter to pick · Esc to close</div>`;
  const act = PC.el.querySelector('.pc-it.act'); if (act) act.scrollIntoView({ block: 'nearest' });
}
function pcPlace() {
  const r = PC.input.getBoundingClientRect(), w = Math.max(r.width, 380), vh = window.innerHeight;
  PC.el.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
  PC.el.style.width = w + 'px';
  const below = vh - r.bottom;
  if (below < 300 && r.top > below) { PC.el.style.top = 'auto'; PC.el.style.bottom = (vh - r.top + 4) + 'px'; } else { PC.el.style.bottom = 'auto'; PC.el.style.top = (r.bottom + 4) + 'px'; }
}
function pcOpen(inp) {
  if (PC.input === inp && PC.el) return;
  pcClose(); PC.input = inp; PC.scope = 'sug'; PC.idx = 0;
  PC.el = document.createElement('div'); PC.el.className = 'pc'; document.body.appendChild(PC.el);
  pcPlace(); pcRender();
}
function pcClose() { if (PC.el) PC.el.remove(); PC.el = null; PC.input = null; }
function pcPick(i) {
  const p = PC.items[i], inp = PC.input; if (!p || !inp) return;
  inp.value = payeeLabelOf(p); pcClose();
  inp.dispatchEvent(new Event('input', { bubbles: true })); inp.dispatchEvent(new Event('change', { bubbles: true }));
}
document.addEventListener('focusin', e => { const t = e.target; if (t.dataset && t.dataset.pc) pcOpen(t); else if (PC.el && !PC.el.contains(t)) pcClose(); });
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.pc && PC.input === t) { PC.idx = 0; pcRender(); } else if (e.isTrusted && t.dataset && t.dataset.pc && !PC.el) pcOpen(t); });
document.addEventListener('mousedown', e => {
  if (!PC.el) return;
  const chip = e.target.closest('.pc-chip'), it = e.target.closest('.pc-it');
  if (chip) { e.preventDefault(); PC.scope = chip.dataset.ps; PC.idx = 0; pcRender(); }
  else if (it) { e.preventDefault(); pcPick(+it.dataset.pi); }
  else if (PC.el.contains(e.target)) e.preventDefault();
  else if (e.target !== PC.input) pcClose();
});
document.addEventListener('keydown', e => {
  if (!PC.el || e.target !== PC.input) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); PC.idx = Math.min(PC.idx + 1, PC.items.length - 1); pcRender(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); PC.idx = Math.max(PC.idx - 1, 0); pcRender(); }
  else if (e.key === 'Enter') { if (PC.items.length && PC.items[PC.idx]) { e.preventDefault(); pcPick(PC.idx); } }
  else if (e.key === 'Escape') { e.stopPropagation(); pcClose(); }
  else if (e.key === 'Tab') pcClose();
}, true);
window.addEventListener('resize', () => { if (PC.el) pcPlace(); });
document.addEventListener('scroll', () => { if (PC.el) pcPlace(); }, true);

document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act;
  if (['selreq', 'setplan', 'csel', 'cselall', 'selalldraft', 'selbatch', 'selallbatch', 'selrm', 'devok', 'pdec', 'fproject', 'rgsel', 'rgdate', 'rgck', 'rgckall', 'stmt', 'gridxlsx', 'autoparam', 'autosel', 'autoproj', 'autopayee'].includes(a) && ACT[a]) ACT[a](el, e);
});
document.addEventListener('input', e => {
  const el = e.target; const l = el.dataset && el.dataset.live; if (!l) return; const id = el.dataset.id;
  if (l === 'g') { gRows()[+el.dataset.r][el.dataset.c] = el.value; gUpdate(); }
  else if (l === 'autoamt') { A().amt[el.dataset.key] = el.value === '' ? 0 : el.value; autoTotals(); }
  else if (l === 'gate') updateGate();
  else if (l === 'payee') onPayeeChange();
  else if (l === 'billtype') onBillType();
  else if (l === 'rabill') refreshLedgerHint();
  else if (l === 'fq') { S.ui.q = el.value; const pos = el.selectionStart; renderMain(); const n = $('#f-q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  else if (l === 'payeeq') { S.ui.payeeQ = el.value; const pos = el.selectionStart; renderMain(); const n = $('#pq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  else if (l === 'rgq') { RG().q = el.value; const pos = el.selectionStart; renderMain(); const n = $('#rg-q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  else if (l === 'auditq') { S.ui.auditQ = el.value; const pos = el.selectionStart; renderMain(); const n = $('#aq'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  else if (l === 'bpay') { S.ui.bpay[id] = el.value; updBpay(); }
  else if (l === 'camt') S.ui.camt[id] = el.value;
  else if (l === 'pamt') (S.ui.panel[id] = S.ui.panel[id] || {}).amount = el.value;
  else if (l === 'prem') (S.ui.panel[id] = S.ui.panel[id] || {}).remark = el.value;
  else if (l === 'prem2') (S.ui.pdec[id] = S.ui.pdec[id] || {}).remark = el.value;
  else if (l === 'bremark') (S.ui.bremark = S.ui.bremark || {})[id] = el.value;
  else if (l === 'utr') { const u = (S.ui.utr[id] = S.ui.utr[id] || {}); u[el.dataset.f] = el.value; }
  else if (l === 'bankpick') S.ui.bankPick = el.value;
  else if (l === 'paydate') S.ui.payDate = el.value;
  else if (l === 'opfill') { const o = S.openings.find(x => x.project_id === el.value); if (o) { $('#op-amt').value = o.opening_net; $('#op-date').value = o.as_of; $('#op-note').value = o.note || ''; } }
});

document.addEventListener('paste', e => {
  const el = e.target; if (!el.dataset || el.dataset.live !== 'g') return;
  const t = (e.clipboardData || window.clipboardData).getData('text'); if (!/[\t\n]/.test(t.trim())) return;
  e.preventDefault(); gPaste(el, t);
});

window.addEventListener('error', e => { const a = document.getElementById('app'); if (a && !a.children.length) showBootError(e.message); });
window.addEventListener('unhandledrejection', e => { const a = document.getElementById('app'); if (a && !a.querySelector('.hdr,.login')) showBootError(cleanErr(e.reason)); });
boot();
</script>
<script>
/* Indian-numbering (1,00,000) live formatting for every typed number box.
   The box shows commas, but .value still returns the plain number, so all existing code keeps working. */
(function(){
  const nd = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
  const PLAIN_ID = /^(woTds|woSafetyPct|woRetention|npYear|epYear)$/;
  function fmt(raw){
    let s = String(raw).replace(/,/g, '');
    if(s === '' || s === '-' || s === '.' || s === '-.') return s;
    const neg = s[0] === '-'; if(neg) s = s.slice(1);
    const parts = s.split('.'); let i = parts[0].replace(/\D/g, ''); const d = parts.length > 1 ? parts.slice(1).join('').replace(/\D/g, '') : null;
    if(i.length > 3){ const last = i.slice(-3), rest = i.slice(0, -3); i = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last; }
    return (neg ? '-' : '') + i + (d !== null ? '.' + d : '');
  }
  function enhance(el){
    if(el._inr || el.tagName !== 'INPUT' || el.type !== 'number') return;
    if(PLAIN_ID.test(el.id || '') || el.hasAttribute('data-plain') || el.classList.contains('dlr-cell')) return;
    const min = el.getAttribute('min'); if(min !== null && Number(min) >= 1000) return;   // years
    el._inr = true;
    const allowNeg = min === null || Number(min) < 0;
    const intOnly = el.getAttribute('inputmode') === 'numeric' || el.getAttribute('step') === '1' || el.getAttribute('step') === '50';
    const init = nd.get.call(el);
    el.type = 'text'; el.setAttribute('inputmode', intOnly ? 'numeric' : 'decimal'); el.setAttribute('autocomplete', 'off');
    Object.defineProperty(el, 'value', { configurable: true,
      get(){ return nd.get.call(el).replace(/,/g, ''); },
      set(v){ nd.set.call(el, v === null || v === undefined || v === '' ? '' : fmt(v)); } });
    nd.set.call(el, init === '' ? '' : fmt(init));
    el.addEventListener('input', function(){
      const cur = nd.get.call(el), pos = el.selectionStart == null ? cur.length : el.selectionStart;
      let sig = 0; for(let k = 0; k < pos; k++) if(/[\d.]/.test(cur[k])) sig++;
      let c = cur.replace(allowNeg ? /[^\d.\-]/g : /[^\d.]/g, '');
      if(allowNeg){ c = (c[0] === '-' ? '-' : '') + c.replace(/-/g, ''); }
      if(intOnly){ c = c.replace(/\./g, ''); } else { const p = c.indexOf('.'); if(p >= 0) c = c.slice(0, p + 1) + c.slice(p + 1).replace(/\./g, ''); }
      const f = fmt(c);
      if(f !== cur){
        nd.set.call(el, f);
        let n = 0, np = 0; for(; np < f.length && n < sig; np++) if(/[\d.]/.test(f[np])) n++;
        try{ el.setSelectionRange(np, np); }catch(e){}
      }
    }, true);
  }
  function scan(root){ (root.querySelectorAll ? root.querySelectorAll('input[type="number"]') : []).forEach(enhance); }
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if(n.nodeType === 1){ if(n.tagName === 'INPUT') enhance(n); scan(n); } }))).observe(document.documentElement, { childList: true, subtree: true });
  scan(document);
})();
</script>
