          <button class="btn" id="rejectBillBtn" style="color:var(--red);border-color:rgba(193,69,58,0.4);">Reject</button>
          <button class="btn primary" id="approveBillBtn">Approve Bill</button>
        </div>
      ` : ''}
      ${(bill.status === 'approved' || bill.status === 'paid') && !isFinalized && canFinalizeBill() ? `
        <div class="modal-actions" style="margin-top:20px;">
          <button class="btn finalize-row-btn" id="finalizeBillBtn">🔐 Finalize (locks permanently)</button>
        </div>
      ` : ''}

      ${bill.status !== 'draft' ? renderBillLedgerNote(wo, netPayable) : ''}
    </div>
  `;

  document.getElementById('backToWO').onclick = async () => {
    state.currentBillId = null;
    if(state.billEntryReturnTo === 'bills'){
      state.viewingWOId = null;
      await loadAllBills(state.selectedProjectId);
      state.billsCacheProjectId = state.selectedProjectId;
    }
    renderMain();
  };
  const deleteBtn = document.getElementById('deleteBillBtn');
  if(deleteBtn) deleteBtn.onclick = () => deleteBill(bill);
  document.getElementById('printBillBtn').onclick = () => printBill(bill, wo, lines, subTotal, retentionAmt, tdsAmt, safetyAmt, debitAmt, gstAmt, effectiveGstPct, netPayable, prevSubTotal, cumulativeSubTotal, project);

  const recompute = () => {
    let st = 0;
    document.querySelectorAll('.bill-line-qty').forEach(inp => {
      const qty = parseFloat(inp.value) || 0;
      const rate = parseFloat(inp.dataset.rate) || 0;
      const amt = qty * rate;
      st += amt;
      document.getElementById(`billAmt-${inp.dataset.line}`).textContent = '₹'+fmtNum(amt);
    });
    const ret = st * (wo.retention_pct||0)/100;
    const tds = st * (wo.tds_pct||0)/100;
    const saf = wo.safety_pct ? st * wo.safety_pct/100 : (wo.safety_amount||0);
    const gstSelect = document.getElementById('billGstSelect');
    const gstPctNow = gstSelect && gstSelect.value !== '' ? Number(gstSelect.value) : Number(wo.gst_pct||0);
    const gst = st * gstPctNow/100;
    const debitInput = document.getElementById('billDebitAmount');
    const deb = debitInput ? (parseFloat(debitInput.value) || 0) : debitAmt;
    document.getElementById('billSubTotal').textContent = '₹'+fmtNum(st);
    document.getElementById('billRetention').textContent = '− ₹'+fmtNum(ret);
    document.getElementById('billTds').textContent = '− ₹'+fmtNum(tds);
    document.getElementById('billSafety').textContent = '− ₹'+fmtNum(saf);
    document.getElementById('billDebit').textContent = '− ₹'+fmtNum(deb);
    document.getElementById('billGstPct').textContent = gstPctNow;
    document.getElementById('billGst').textContent = '+ ₹'+fmtNum(gst);
    document.getElementById('billNet').textContent = '₹'+fmtNum(st - ret - tds - saf - deb + gst);
  };
  document.querySelectorAll('.bill-line-qty').forEach(inp => inp.addEventListener('input', recompute));
  const debitInput = document.getElementById('billDebitAmount');
  if(debitInput) debitInput.addEventListener('input', recompute);
  const gstSelectEl = document.getElementById('billGstSelect');
  if(gstSelectEl) gstSelectEl.addEventListener('change', recompute);

  const saveBtn = document.getElementById('saveDraftBtn');
  if(saveBtn) saveBtn.onclick = () => saveBillLines(bill.id, false);
  const submitBtn = document.getElementById('submitBillBtn');
  if(submitBtn) submitBtn.onclick = () => saveBillLines(bill.id, true);
  const saveChangesBtn = document.getElementById('saveChangesBtn');
  if(saveChangesBtn) saveChangesBtn.onclick = () => saveBillLines(bill.id, false);
  const approveBtn = document.getElementById('approveBillBtn');
  if(approveBtn) approveBtn.onclick = () => approveBill(bill.id);
  const rejectBtn = document.getElementById('rejectBillBtn');
  if(rejectBtn) rejectBtn.onclick = () => rejectBill(bill.id);
  const finalizeBtn = document.getElementById('finalizeBillBtn');
  if(finalizeBtn) finalizeBtn.onclick = () => finalizeBill(bill.id);
}

async function finalizeBill(billId){
  if(!confirm('Finalize this bill? Once finalized, it can never be edited or deleted again — not even by the Owner. Only do this once Accounts has fully reconciled it.')) return;
  try{
    const { data: { user } } = await withRetry(() => sb.auth.getUser());
    const { error } = await withRetry(() => sb.from('ra_bills').update({ finalized_at: new Date().toISOString(), finalized_by: user.id }).eq('id', billId));
    if(error){ toast(error.message, true); return; }
    toast('Bill finalized and locked.');
    await loadBillEntry(billId, state.woDetail.id);
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function rejectBill(billId){
  const reason = prompt('Reason for rejecting this bill (sent back to draft for the QS to fix):');
  if(reason === null) return; // cancelled
  if(!reason.trim()){ toast('A reason is required to reject a bill.', true); return; }
  try{
    const { data: { user } } = await withRetry(() => sb.auth.getUser());
    const { error } = await withRetry(() => sb.from('ra_bills').update({
      status: 'draft', rejection_reason: reason.trim(), rejected_by: user.id, rejected_at: new Date().toISOString()
    }).eq('id', billId));
    if(error){ toast(error.message, true); return; }
    toast('Bill rejected and sent back to draft.');
    state.billsCacheProjectId = null;
    await loadBillEntry(billId, state.woDetail.id);
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

        </div>
      </div>

      <table class="wo-doc-table">

async function deleteBill(bill){
  if(bill.finalized_at){ toast('This bill is finalized and permanently locked — it cannot be deleted.', true); return; }
  if(!confirm(`Delete Bill #${bill.bill_no}? It'll move to the Bin and can be restored or permanently removed from there.`)) return;
  try{
    const { data: { user } } = await withRetry(() => sb.auth.getUser());
    const { error } = await withRetry(() => sb.from('ra_bills').update({ deleted_at: new Date().toISOString(), deleted_by: user.id }).eq('id', bill.id));
    if(error){ toast(error.message, true); return; }
    toast('Bill moved to Bin.');
    state.billsCacheProjectId = null;
    state.currentBillId = null;
    state.woBills = state.woBills.filter(b => b.id !== bill.id);
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

function renderBillLedgerNote(wo, netPayable){
  const sc = wo.ra_subcontractors || {};
  return `
    <h4 class="wo-lines-title">Payment</h4>
    <div class="locked-note">
      💳 This bill's Net Payable is ₹${fmtNum(netPayable)}. Payments to ${escapeHtml(sc.name||'this subcontractor')} are recorded on account, not against individual bills —
      see <strong>Subcontractors → ${escapeHtml(sc.name||'')} → View Ledger</strong> for the running balance and to record a payment.
    </div>
  `;
}

async function saveBillLines(billId, thenSubmit){
  // Editable lines come straight from their inputs. Locked lines never render
  // an input (they're shown as a static value instead), so without this
  // they'd silently vanish on save — pull their existing saved qty forward instead.
  const editedIds = new Set([...document.querySelectorAll('.bill-line-qty')].map(inp => inp.dataset.line));
  const rows = [...document.querySelectorAll('.bill-line-qty')]
    .map(inp => ({ bill_id: billId, wo_line_item_id: inp.dataset.line, this_qty: parseFloat(inp.value) || 0 }));
  state.billLines.forEach(e => {
    if(!editedIds.has(e.wo_line_item_id) && Number(e.this_qty) > 0){
      rows.push({ bill_id: billId, wo_line_item_id: e.wo_line_item_id, this_qty: Number(e.this_qty) });
    }
  });
  const finalRows = rows.filter(r => r.this_qty > 0);
  const debitAmountEl = document.getElementById('billDebitAmount');
  const debitNoteEl = document.getElementById('billDebitNote');
  const gstSelectEl = document.getElementById('billGstSelect');
  const debit_amount = debitAmountEl && debitAmountEl.value ? parseFloat(debitAmountEl.value) : 0;
  const debit_note = debitNoteEl ? debitNoteEl.value.trim() || null : null;
  const gst_pct = gstSelectEl && gstSelectEl.value !== '' ? parseFloat(gstSelectEl.value) : null;
  try{
    const { error: debitErr } = await withRetry(() => sb.from('ra_bills').update({ debit_amount, debit_note, gst_pct }).eq('id', billId));
    if(debitErr){ toast(debitErr.message, true); return; }
    // Clear then reinsert this bill's lines — simplest way to handle add/remove/change in one pass.
    const { error: delErr } = await withRetry(() => sb.from('ra_bill_line_entries').delete().eq('bill_id', billId));
    if(delErr){ toast(delErr.message, true); return; }
    if(finalRows.length){
      const { error: insErr } = await withRetry(() => sb.from('ra_bill_line_entries').insert(finalRows));
      if(insErr){ toast(insErr.message, true); return; }
    }
    if(thenSubmit){
      await submitBill(billId);
    } else {
      toast('Draft saved.');
      state.billsCacheProjectId = null;
      await loadBillEntry(billId, state.woDetail.id);
      renderMain();
    }
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

    if(error){ toast(error.message, true); return; }
    toast('Bill submitted.');
    state.billsCacheProjectId = null;
    await loadBillEntry(billId, state.woDetail.id);

async function recordPayment(subcontractorId, amount_paid, date_paid, mode, projectId, notes, tds_amount, payment_type){
  try{
    const { data: { user } } = await withRetry(() => sb.auth.getUser());
    const { error } = await withRetry(() => sb.from('ra_payments').insert({
      subcontractor_id: subcontractorId, amount_paid, date_paid, mode: mode || null,

async function loadAllBills(projectId){
  try{
    const { data, error } = await withRetry(() =>
      sb.from('ra_bills')
        .select('*, ra_work_orders!inner(wo_ref, project_id, retention_pct, tds_pct, safety_pct, safety_amount, gst_pct, ra_subcontractors(name, acct_code)), ra_bill_line_entries(this_qty, ra_wo_line_items(agreed_rate))')
        .eq('ra_work_orders.project_id', projectId)
        .is('deleted_at', null)
        .order('created_at', { ascending: false })
    );
    if(error){ toast(error.message, true); state.allBills = []; return; }
    state.allBills = (data || []).map(b => {
      const wo = b.ra_work_orders || {};
      const subTotal = (b.ra_bill_line_entries||[]).reduce((s,e) => s + Number(e.this_qty||0) * Number((e.ra_wo_line_items||{}).agreed_rate||0), 0);
      const deductions = subTotal * ((wo.retention_pct||0)+(wo.tds_pct||0)+(wo.safety_pct||0))/100 + (wo.safety_pct ? 0 : (wo.safety_amount||0)) + Number(b.debit_amount||0);
      const effGstPct = (b.gst_pct !== null && b.gst_pct !== undefined) ? Number(b.gst_pct) : Number(wo.gst_pct||0);
      const gstAmt = subTotal * effGstPct/100;
      const net = subTotal - deductions + gstAmt;
      return { ...b, _subTotal: subTotal, _net: net };
    });
  } catch(err){ toast('Could not load bills — please try again.', true); console.error(err); state.allBills = []; }
}

/* ============================================================================
   BILL BIN — soft-deleted bills. Restore brings them back; Empty Bin (Owner
   only) permanently removes everything currently in the bin.
============================================================================ */
async function loadBinBills(projectId){
  try{
    const { data, error } = await withRetry(() =>
      sb.from('ra_bills')
        .select('*, ra_work_orders!inner(wo_ref, project_id, ra_subcontractors(name, acct_code))')
        .eq('ra_work_orders.project_id', projectId)
        .not('deleted_at', 'is', null)
        .order('deleted_at', { ascending: false })
    );
    if(error){ toast(error.message, true); state.binBills = []; return; }
    state.binBills = data || [];
  } catch(err){ toast('Could not load the Bin — please try again.', true); console.error(err); state.binBills = []; }
}

async function restoreBill(bill){
  try{
    const { error } = await withRetry(() => sb.from('ra_bills').update({ deleted_at: null, deleted_by: null }).eq('id', bill.id));
    if(error){ toast(error.message, true); return; }
    toast('Bill restored.');
    state.billsCacheProjectId = null;
    state.binBills = state.binBills.filter(b => b.id !== bill.id);
    await loadAllBills(bill.ra_work_orders.project_id);
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function emptyBin(projectId){
  if(!state.binBills.length){ toast('The Bin is already empty.', true); return; }
  const confirmMsg = `Permanently delete all ${state.binBills.length} bill(s) in the Bin? This cannot be undone — they will be gone for good, not just moved.`;
  if(!confirm(confirmMsg)) return;
  if(!confirm('Really sure? This is the last confirmation — these bills cannot be recovered after this.')) return;
  try{
    const ids = state.binBills.map(b => b.id);
    const { error } = await withRetry(() => sb.from('ra_bills').delete().in('id', ids));
    if(error){ toast(error.message, true); return; }
    toast('Bin emptied.');
    state.binBills = [];
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

function canEnterDLR(){ return canCreateWO(); } // same role set: owner/pm/qs

const DLR_TRADE_FIELDS = [
  { key: 'carpenter_count', label: 'Carp' },
  { key: 'carpenter_helper_count', label: 'C.Helper' },
  { key: 'steel_fitter_count', label: 'Steel Fitter' },
  { key: 'steel_helper_count', label: 'S.Helper' },
  { key: 'mason_count', label: 'Mason' },
  { key: 'male_coolie_count', label: 'MC' },
  { key: 'female_coolie_count', label: 'FC' }
];

async function loadDLREntries(projectId, date){
  try{
    const { data, error } = await withRetry(() =>
      sb.from('ra_dlr_entries').select('*, ra_subcontractors(name, acct_code)').eq('project_id', projectId).eq('entry_date', date).order('created_at')
    );
    if(error){ toast(error.message, true); state.dlrEntries = []; return; }
    state.dlrEntries = data || [];
  } catch(err){ toast('Could not load Daily Labour Report — please try again.', true); console.error(err); state.dlrEntries = []; }
}

// Last 7 days' submission status for this project — now based on the
// explicit day-status confirmation, not just "some row happens to exist,"
// which is a more accurate signal of an actually-completed day.
async function loadDLRSubmissionStrip(projectId){
  try{
    const since = new Date(); since.setDate(since.getDate() - 6);
    const sinceStr = since.toISOString().slice(0,10);
    const { data, error } = await withRetry(() =>
      sb.from('ra_dlr_day_status').select('entry_date').eq('project_id', projectId).gte('entry_date', sinceStr)
    );
    if(error){ console.error(error); state.dlrSubmissionStrip = {}; return; }
    const set = new Set((data||[]).map(r => r.entry_date));
    const strip = {};
    for(let i = 6; i >= 0; i--){
      const d = new Date(); d.setDate(d.getDate() - i);
      const key = d.toISOString().slice(0,10);
      strip[key] = set.has(key);
    }
    state.dlrSubmissionStrip = strip;
  } catch(err){ console.error(err); state.dlrSubmissionStrip = {}; }
}

async function loadDLRDayStatus(projectId, date){
  try{
    const { data, error } = await withRetry(() =>
      sb.from('ra_dlr_day_status').select('*').eq('project_id', projectId).eq('entry_date', date).maybeSingle()
    );
    if(error){ console.error(error); state.dlrDayStatus = null; return; }
    state.dlrDayStatus = data || null;
  } catch(err){ console.error(err); state.dlrDayStatus = null; }
}

async function submitDLRDay(project){
  if(!state.dlrEntries.length){ toast('Add at least one subcontractor before submitting.', true); return; }
  try{
    const payload = { project_id: project.id, entry_date: state.dlrDate, submitted_by: session.user.id, submitted_at: new Date().toISOString() };
    const { data, error } = await withRetry(() => sb.from('ra_dlr_day_status').upsert(payload, { onConflict: 'project_id,entry_date' }).select().single());
    if(error){ toast(error.message, true); return; }
    state.dlrDayStatus = data;
    toast(`DLR for ${state.dlrDate} submitted.`);
    await loadDLRSubmissionStrip(project.id);
    state.dlrStripCacheKey = project.id;
    renderDLRTab(project);
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function renderDLRTab(project){
  const tabContent = document.getElementById('tabContent');
  tabContent.innerHTML = `<div class="loading">Loading Daily Labour Report…</div>`;
  const stripPromise = (state.dlrStripCacheKey === project.id)
    ? Promise.resolve()
    : loadDLRSubmissionStrip(project.id).then(() => { state.dlrStripCacheKey = project.id; });
  await Promise.all([loadDLREntries(project.id, state.dlrDate), stripPromise, loadDLRDayStatus(project.id, state.dlrDate)]);

  const stripEntries = Object.entries(state.dlrSubmissionStrip);
  const submitted = state.dlrDayStatus;
  tabContent.innerHTML = `
    ${!canEnterDLR() ? `<div class="locked-note">🔒 Signed in as ${myRole.toUpperCase()} — DLR is entered by Owner, PM, or QS. You can review here.</div>` : ''}
    <div class="dlr-strip">
      ${stripEntries.map(([d, ok]) => {
        const label = new Date(d+'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric' });
        const isToday = d === new Date().toISOString().slice(0,10);
        return `<button class="dlr-strip-day ${ok?'ok':'missing'} ${d===state.dlrDate?'selected':''}" data-date="${d}" title="${ok?'Submitted':'Not submitted'}">${ok?'✓':'⚠'}<br>${label}${isToday?' (today)':''}</button>`;
      }).join('')}
    </div>

    ${submitted
      ? `<div class="locked-note" style="color:var(--green);border-color:rgba(63,143,99,0.35);background:rgba(63,143,99,0.08);">✓ Submitted for ${state.dlrDate} by ${submitted.submitted_by === session.user.id ? 'you' : 'a teammate'} at ${new Date(submitted.submitted_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}. You can still edit below — it stays marked submitted.</div>`
      : `<div class="locked-note">⚠ Not yet submitted for ${state.dlrDate}. Rows auto-save as you type, but nothing confirms the day is complete until you submit.</div>`
    }

    <div class="toolbar">
      <div class="field" style="max-width:200px; margin:0;"><input type="date" id="dlrDatePicker" value="${state.dlrDate}"></div>
      <button class="btn tiny" id="dlrExportCsvBtn">⬇ CSV</button>
      <button class="btn tiny" id="dlrPrintBtn">🖨 PDF</button>
      <span class="pg-status" id="dlrSavedLabel"></span>
    </div>

    <div id="dlrGridWrap"></div>
    ${canEnterDLR() ? `<div id="dlrAddRow" style="margin-top:10px;"></div>` : ''}
    ${canEnterDLR() ? `
      <div class="modal-actions" style="margin-top:16px; justify-content:flex-start;">
        <button class="btn primary" id="dlrSubmitBtn">${submitted ? '✓ Re-submit DLR for '+state.dlrDate : 'Submit DLR for '+state.dlrDate}</button>
      </div>
    ` : ''}
  `;

  document.getElementById('dlrDatePicker').addEventListener('change', async (e) => {
    state.dlrDate = e.target.value;
    await renderDLRTab(project);
  });
  main_dlrWireStripClicks(project);
  document.getElementById('dlrExportCsvBtn').onclick = () => exportDLRCsv(project);
  document.getElementById('dlrPrintBtn').onclick = () => printDLR(project);
  const submitBtn = document.getElementById('dlrSubmitBtn');
  if(submitBtn) submitBtn.onclick = () => submitDLRDay(project);

  renderDLRGrid(project);
  if(canEnterDLR()) renderDLRAddRow(project);
}

function main_dlrWireStripClicks(project){
  document.querySelectorAll('.dlr-strip-day').forEach(btn => {
    btn.onclick = async () => { state.dlrDate = btn.dataset.date; await renderDLRTab(project); };
  });
}

function dlrRowTotal(entry){
  return DLR_TRADE_FIELDS.reduce((s,f) => s + (Number(entry[f.key])||0), 0) + (Number(entry.others_count)||0);
}

function renderDLRGrid(project){
  const wrap = document.getElementById('dlrGridWrap');
  const editable = canEnterDLR();
  const table = document.createElement('table');
  table.className = 'data-table dlr-table';
  const headCells = ['Subcontractor', ...DLR_TRADE_FIELDS.map(f=>f.label), 'Others #', 'Others Label', 'Total', ''];
  table.innerHTML = `<thead><tr>${headCells.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody></tbody>`;
  const tbody = table.querySelector('tbody');

  const totals = {}; DLR_TRADE_FIELDS.forEach(f => totals[f.key] = 0); totals.others_count = 0; let grandTotal = 0;

  state.dlrEntries.forEach(entry => {
    DLR_TRADE_FIELDS.forEach(f => totals[f.key] += Number(entry[f.key])||0);
    totals.others_count += Number(entry.others_count)||0;
    grandTotal += dlrRowTotal(entry);

    const tr = document.createElement('tr');
    tr.dataset.entryId = entry.id || '';
    tr.dataset.subcontractorId = entry.subcontractor_id;
    if(entry.updated_at) tr.title = `Last saved ${new Date(entry.updated_at).toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'})} on ${new Date(entry.updated_at).toLocaleDateString('en-IN')}`;
    const sc = entry.ra_subcontractors || {};
    const savedTime = entry.updated_at ? new Date(entry.updated_at).toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'}) : '';
    const cells = [`<td>${escapeHtml(sc.name||'')} <span class="u">${escapeHtml(sc.acct_code||'')}</span>${savedTime ? `<div class="wo-line-path">⏱ ${savedTime}</div>` : ''}</td>`];
    DLR_TRADE_FIELDS.forEach(f => {
      cells.push(`<td>${editable ? `<input type="number" inputmode="numeric" min="0" class="dlr-cell" data-field="${f.key}" value="${entry[f.key]||''}">` : (entry[f.key]||0)}</td>`);
    });
    cells.push(`<td>${editable ? `<input type="number" inputmode="numeric" min="0" class="dlr-cell" data-field="others_count" value="${entry.others_count||''}">` : (entry.others_count||0)}</td>`);

    cells.push(`<td class="num dlr-row-total">${dlrRowTotal(entry)}</td>`);
    cells.push(`<td>${editable ? `<button class="icon-btn dlr-del-btn" title="Remove">✕</button>` : ''}</td>`);
    tr.innerHTML = cells.join('');
    tbody.appendChild(tr);
  });

  const totalsRow = document.createElement('tr');
  totalsRow.className = 'wo-doc-total-row';
  totalsRow.innerHTML = [`<td><strong>Total (${state.dlrEntries.length} subcontractor${state.dlrEntries.length!==1?'s':''})</strong></td>`,

    `<td class="num"><strong>${grandTotal}</strong></td>`, `<td></td>`
  ].join('');
  tbody.appendChild(totalsRow);

  wrap.innerHTML = '';
  wrap.appendChild(table);
  if(!state.dlrEntries.length) wrap.insertAdjacentHTML('beforeend', `<div class="wo-lines-empty">No labour entered for this date yet.${canEnterDLR() ? ' Add a subcontractor below.' : ''}</div>`);

  if(editable) wireDLRRowInputs(project);
}

let dlrCommitTimers = {};
function wireDLRRowInputs(project){
  document.querySelectorAll('#dlrGridWrap tr[data-subcontractor-id]').forEach(tr => {
    const subId = tr.dataset.subcontractorId;
    const entry = state.dlrEntries.find(e => e.subcontractor_id === subId);
    if(!entry) return;
    const entryId = entry.id || subId; // stable key for the debounce timer, even before first save
    tr.querySelectorAll('.dlr-cell').forEach(inp => {
      inp.addEventListener('input', () => {
        const field = inp.dataset.field;
        entry[field] = field === 'others_label' ? inp.value : (parseInt(inp.value,10) || 0);
        tr.querySelector('.dlr-row-total').textContent = dlrRowTotal(entry);
        clearTimeout(dlrCommitTimers[entryId]);
        dlrCommitTimers[entryId] = setTimeout(() => commitDLREntry(entry, project), 500);
      });
    });
    const delBtn = tr.querySelector('.dlr-del-btn');
    if(delBtn) delBtn.onclick = () => deleteDLREntry(entry, project);
  });
}

async function commitDLREntry(entry, project){
  try{
    const payload = { project_id: entry.project_id, subcontractor_id: entry.subcontractor_id, entry_date: entry.entry_date, created_by: session.user.id };
    DLR_TRADE_FIELDS.forEach(f => payload[f.key] = entry[f.key] || 0);
    payload.others_count = entry.others_count || 0;
    payload.others_label = entry.others_label || null;
    payload.updated_at = new Date().toISOString();
    const { data, error } = await withRetry(() => sb.from('ra_dlr_entries').upsert(payload, { onConflict: 'project_id,subcontractor_id,entry_date' }).select().single());
    if(error){ toast(error.message, true); return; }
    entry.id = data.id;
    entry.updated_at = data.updated_at;
    updateDLRSavedLabel(data.updated_at);
    const row = document.querySelector(`#dlrGridWrap tr[data-subcontractor-id="${entry.subcontractor_id}"]`);
    if(row){
      row.dataset.entryId = entry.id;
      row.title = `Last saved ${new Date(data.updated_at).toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'})}`;
    }
  } catch(err){ toast('Could not save — please try again.', true); console.error(err); }
}

function updateDLRSavedLabel(isoTime){
  const el = document.getElementById('dlrSavedLabel');
  if(!el) return;
  const t = new Date(isoTime).toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  el.textContent = `Last saved ${t}`;
}

async function deleteDLREntry(entry, project){
  if(entry.id && !confirm(`Remove ${entry.ra_subcontractors ? entry.ra_subcontractors.name : 'this'} from today's DLR?`)) return;
  state.dlrEntries = state.dlrEntries.filter(e => e !== entry);
  renderDLRGrid(project); // update the screen immediately — don't wait on the network call
  if(entry.id){
    try{
      const { error } = await withRetry(() => sb.from('ra_dlr_entries').delete().eq('id', entry.id));
      if(error){
        toast(error.message, true);
        state.dlrEntries.push(entry); // restore on failure
        renderDLRGrid(project);
        return;
      }
      await loadDLRSubmissionStrip(project.id);
      main_dlrWireStripClicks(project);
    } catch(err){
      toast('Could not reach the server — the row has been restored.', true);
      console.error(err);
      state.dlrEntries.push(entry);
      renderDLRGrid(project);
    }
  }
}

function renderDLRAddRow(project){
  const wrap = document.getElementById('dlrAddRow');
  wrap.innerHTML = `<div class="bi-desc-wrap" style="max-width:340px;"><input id="dlrScSearch" placeholder="+ Add subcontractor for ${state.dlrDate}…" autocomplete="off"></div>`;
  const searchInput = document.getElementById('dlrScSearch');
  let suggestBox = null;
  const closeSuggest = () => { if(suggestBox){ suggestBox.remove(); suggestBox = null; } };
  const openSuggest = () => {
    closeSuggest();
    const q = searchInput.value.trim().toLowerCase();
    if(!q) return;
    const already = new Set(state.dlrEntries.map(e => e.subcontractor_id));
    const matches = state.subcontractors
      .filter(s => s.is_active !== false && !already.has(s.id) && (s.name.toLowerCase().includes(q) || (s.acct_code||'').toLowerCase().includes(q)))
      .slice(0, 10);
    if(!matches.length) return;
    suggestBox = document.createElement('div');
    suggestBox.className = 'bi-suggest';
    matches.forEach(s => {
      const item = document.createElement('div');
      item.className = 'bi-suggest-item';
      item.innerHTML = `<span>${escapeHtml(s.name)}</span><span class="u">${escapeHtml(s.acct_code)}</span>`;
      item.onmousedown = (e) => {
        e.preventDefault();
        const blank = { id: null, project_id: project.id, subcontractor_id: s.id, entry_date: state.dlrDate, ra_subcontractors: { name: s.name, acct_code: s.acct_code }, others_label: '' };
        DLR_TRADE_FIELDS.forEach(f => blank[f.key] = 0);

    });

  };

  searchInput.addEventListener('focus', openSuggest);
  searchInput.addEventListener('blur', () => setTimeout(closeSuggest, 150));
}

function exportDLRCsv(project){
  const rows = state.dlrEntries.map(e => {
    const sc = e.ra_subcontractors || {};
    const row = { 'Subcontractor': sc.name || '', 'Acct Code': sc.acct_code || '' };
    DLR_TRADE_FIELDS.forEach(f => row[f.label] = e[f.key] || 0);
    row['Others #'] = e.others_count || 0;
    row['Others Label'] = e.others_label || '';
    row['Total'] = dlrRowTotal(e);
    return row;
  });
  downloadCSV(`CCI DLR ${project.name} ${state.dlrDate}.csv`,
    ['Subcontractor','Acct Code',...DLR_TRADE_FIELDS.map(f=>f.label),'Others #','Others Label','Total'], rows);
}

function printDLR(project){
  if(!state.dlrEntries.length){ toast('No labour entered for this date — nothing to print.', true); return; }
  const rows = state.dlrEntries.map(e => {
    const sc = e.ra_subcontractors || {};
    const row = { 'Subcontractor': sc.name || '', 'Acct Code': sc.acct_code || '' };
    DLR_TRADE_FIELDS.forEach(f => row[f.label] = e[f.key] || 0);
    row['Others'] = e.others_count ? `${e.others_count}${e.others_label ? ' ('+e.others_label+')' : ''}` : '—';
    row['Total'] = dlrRowTotal(e);
    return row;
  });
  const totals = {}; DLR_TRADE_FIELDS.forEach(f => totals[f.label] = 0);
  let grandTotal = 0;
  state.dlrEntries.forEach(e => {
    DLR_TRADE_FIELDS.forEach(f => totals[f.label] += Number(e[f.key])||0);
    grandTotal += dlrRowTotal(e);
  });
  const totalRow = { 'Subcontractor': 'TOTAL', 'Acct Code': '' };
  DLR_TRADE_FIELDS.forEach(f => totalRow[f.label] = totals[f.label]);
  totalRow['Others'] = '';
  totalRow['Total'] = grandTotal;
  rows.push(totalRow);

  printTable(
    `${project.name} — Daily Labour Report`,
    `${state.dlrDate} · ${state.dlrEntries.length} subcontractor${state.dlrEntries.length!==1?'s':''} · ${grandTotal} workers total`,
    ['Subcontractor','Acct Code',...DLR_TRADE_FIELDS.map(f=>f.label),'Others','Total'],
    rows,
    `CCI DLR ${project.name} ${state.dlrDate}`
  );
}

    table.innerHTML = '';
    if(state.newWOLines.length || state.addingWOLine){
      table.innerHTML = `<div class="bitem-head" style="grid-template-columns:1fr 100px 90px 100px 100px 62px;"><span>Budget Item (WBS path)</span><span class="qty">Remaining</span><span class="qty">WO Qty</span><span class="rate">Agreed Rate ₹</span><span class="amount">Amount ₹</span><span></span></div>`;
    } else {
      table.innerHTML = `<div class="wo-lines-empty">No line items added yet.</div>`;
    }
    let woTotal = 0;
    state.newWOLines.forEach((line, idx) => {
      const item = billableItems.find(b => b.id === line.budget_item_id);
      const amount = (line.estimated_qty && line.agreed_rate) ? line.estimated_qty * line.agreed_rate : null;
      if(amount) woTotal += amount;
      const remaining = item ? remainingFor(item) : 0;
      const row = document.createElement('div');
      row.className = 'bitem';
      row.style.gridTemplateColumns = '1fr 100px 90px 100px 100px 62px';
      row.innerHTML = `
        <span class="desc">
          ${item ? escapeHtml(item.description) : '—'}
          <button class="icon-btn wo-line-note-btn" data-idx="${idx}" title="${line.scope_description ? 'Edit description' : 'Add description'}">${line.scope_description ? '📝' : '+ note'}</button>
          ${item ? `<div class="wo-line-path">${escapeHtml(getStagePath(item.stage_id))}</div>` : ''}
        </span>
        <span class="qty">${fmtNum(remaining)} ${item ? escapeHtml(item.unit) : ''}</span>
        <span><input type="number" inputmode="decimal" step="0.001" class="wo-line-qty" data-idx="${idx}" value="${line.estimated_qty||''}" placeholder="Qty"></span>
        <span><input type="number" inputmode="decimal" step="0.01" class="wo-line-rate" data-idx="${idx}" value="${line.agreed_rate||''}" placeholder="Rate"></span>
        <span class="amount">${amount ? fmtNum(amount) : '—'}</span>
        <span class="del"><button class="icon-btn wo-line-del" data-idx="${idx}">✕</button></span>
      `;
      table.appendChild(row);
    });

    if(state.addingWOLine){
      const already = new Set(state.newWOLines.map(l => l.budget_item_id));
      const available = billableItems.filter(b => !already.has(b.id));
      const addRow = document.createElement('div');
      addRow.className = 'bitem bitem-add';
      addRow.style.gridTemplateColumns = '1fr 100px 90px 100px 100px 62px';
      addRow.innerHTML = `
        <div class="bi-desc-wrap"><input class="wol-search" placeholder="Search a budget item by name…" autocomplete="off"></div>
        <span class="qty" id="wolRemaining">—</span>
        <span><input type="number" inputmode="decimal" step="0.001" class="wol-qty" placeholder="Qty" disabled></span>
        <span><input type="number" inputmode="decimal" step="0.01" class="wol-rate" placeholder="Rate" disabled></span>
        <span class="amount" id="wolAmount">—</span>
        <span class="bi-add-actions"><button class="icon-btn wol-save" title="Add">✓</button><button class="icon-btn wol-cancel" title="Cancel">✕</button></span>
      `;
      table.appendChild(addRow);

      const searchWrap = addRow.querySelector('.bi-desc-wrap');
      const searchInput = addRow.querySelector('.wol-search');
      const qtyInput = addRow.querySelector('.wol-qty');
      const rateInput = addRow.querySelector('.wol-rate');
      const remainingSpan = addRow.querySelector('#wolRemaining');
      const amountSpan = addRow.querySelector('#wolAmount');
      let selectedItem = null;
      let suggestBox = null;

      const closeSuggest = () => { if(suggestBox){ suggestBox.remove(); suggestBox = null; } };
      const openSuggest = () => {
        closeSuggest();
        const q = searchInput.value.trim().toLowerCase();
        const matches = available
          .filter(b => !q || b.description.toLowerCase().includes(q))
          .slice(0, 10);
        if(!matches.length) return;
        suggestBox = document.createElement('div');
        suggestBox.className = 'bi-suggest';
        matches.forEach(b => {
          const rem = remainingFor(b);
          const opt = document.createElement('div');
          opt.className = 'bi-suggest-item wol-suggest-item';
          opt.innerHTML = `
            <span>
              <div>${escapeHtml(b.description)}</div>
              <div class="wo-line-path">${escapeHtml(getStagePath(b.stage_id))}</div>
            </span>
            <span class="u">${fmtNum(rem)} ${escapeHtml(b.unit)} left</span>
          `;
          opt.onmousedown = (e) => {
            e.preventDefault();
            selectedItem = b;
            searchInput.value = b.description;
            remainingSpan.textContent = `${fmtNum(remainingFor(b))} ${b.unit}`;
            qtyInput.disabled = false; rateInput.disabled = false;
            closeSuggest();
            qtyInput.focus();
          };
          suggestBox.appendChild(opt);
        });
        searchWrap.appendChild(suggestBox);
      };
      searchInput.addEventListener('focus', openSuggest);
      searchInput.addEventListener('input', () => { selectedItem = null; qtyInput.disabled = true; rateInput.disabled = true; remainingSpan.textContent = '—'; openSuggest(); });
      searchInput.addEventListener('blur', () => setTimeout(closeSuggest, 150));
      searchInput.addEventListener('keydown', e => { if(e.key === 'Escape'){ state.addingWOLine = false; renderWOLines(); } });

      const updateAmount = () => {
        const q = parseFloat(qtyInput.value), r = parseFloat(rateInput.value);
        amountSpan.textContent = (!isNaN(q) && !isNaN(r)) ? fmtNum(q*r) : '—';
      };
      qtyInput.addEventListener('input', updateAmount);
      rateInput.addEventListener('input', updateAmount);

      const commitLine = () => {
        if(!selectedItem){ toast('Pick a budget item from the list first.', true); return; }
        const qty = parseFloat(qtyInput.value);
        const rate = parseFloat(rateInput.value) || null;
        if(isNaN(qty)){ toast('Enter a quantity.', true); return; }
        const remaining = remainingFor(selectedItem);
        if(qty > remaining){
          toast(`Can't exceed the WBS budget — only ${fmtNum(remaining)} ${selectedItem.unit} remaining for "${selectedItem.description}".`, true);
          return;
        }
        state.newWOLines.push({ budget_item_id: selectedItem.id, agreed_rate: rate, estimated_qty: qty, scope_description: null });
        state.addingWOLine = false;
        renderWOLines();
        if(selectedItem.budgeted_rate && rate){
          const budgetedAmount = Number(selectedItem.budgeted_qty) * Number(selectedItem.budgeted_rate);
          const committedAmount = (state.committedAmount[selectedItem.id] || 0) + (qty * rate);
          if(committedAmount > budgetedAmount){
            toast(`Heads up: at ₹${fmtNum(rate)}, "${selectedItem.description}" now costs more than its ₹${fmtNum(budgetedAmount)} budget (₹${fmtNum(committedAmount)} committed). Quantity is still within the WBS cap — this is a cost flag, not a block.`, true);
          }
        }
      };
      addRow.querySelector('.wol-save').onclick = commitLine;
      addRow.querySelector('.wol-cancel').onclick = () => { state.addingWOLine = false; renderWOLines(); };
      qtyInput.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); rateInput.focus(); } });
      rateInput.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); commitLine(); } });
      setTimeout(() => searchInput.focus(), 30);
    }

    if(state.newWOLines.length){
      const totalRow = document.createElement('div');
      totalRow.className = 'bitem bitem-subtotal';
      totalRow.style.gridTemplateColumns = '1fr 100px 90px 100px 100px 62px';
      totalRow.innerHTML = `<span class="desc">Work Order Total</span><span></span><span></span><span></span><span class="amount">₹${fmtNum(woTotal)}</span><span></span>`;
      table.appendChild(totalRow);
    }

    // Live amount update without rebuilding the table (rebuilding on every
    // keystroke was destroying focus — you could only type one character at a time).
    const recomputeAmounts = () => {
      let woTotal = 0;
      state.newWOLines.forEach((line, idx) => {
        const amount = (line.estimated_qty && line.agreed_rate) ? line.estimated_qty * line.agreed_rate : null;
        if(amount) woTotal += amount;
        const rateInput = table.querySelector(`.wo-line-rate[data-idx="${idx}"]`);
        const amtEl = rateInput ? rateInput.closest('.bitem').querySelector('.amount') : null;
        if(amtEl) amtEl.textContent = amount ? fmtNum(amount) : '—';
      });
      const totalEl = table.querySelector('.bitem-subtotal .amount');
      if(totalEl) totalEl.textContent = '₹' + fmtNum(woTotal);
    };

    table.querySelectorAll('.wo-line-qty').forEach(inp => {
      inp.addEventListener('input', () => {
        state.newWOLines[+inp.dataset.idx].estimated_qty = parseFloat(inp.value) || null;
        recomputeAmounts();
      });
      inp.addEventListener('change', () => {
        const idx = +inp.dataset.idx;
        const item = billableItems.find(b => b.id === state.newWOLines[idx].budget_item_id);
        const remaining = item ? remainingFor(item) : Infinity;
        const val = parseFloat(inp.value) || null;
        if(val !== null && val > remaining){
          toast(`Can't exceed the WBS budget — only ${fmtNum(remaining)} ${item ? item.unit : ''} remaining for "${item ? item.description : 'this item'}".`, true);
          inp.value = '';
          state.newWOLines[idx].estimated_qty = null;
          recomputeAmounts();
          return;
        }
        state.newWOLines[idx].estimated_qty = val;
        renderWOLines();
      });
    });
    table.querySelectorAll('.wo-line-rate').forEach(inp => {
      inp.addEventListener('input', () => {
        state.newWOLines[+inp.dataset.idx].agreed_rate = parseFloat(inp.value) || null;
        recomputeAmounts();
      });
      inp.addEventListener('change', () => {
        const idx = +inp.dataset.idx;
        const line = state.newWOLines[idx];
        const item = billableItems.find(b => b.id === line.budget_item_id);
        // Rate has no cap — subcontractors negotiate their own rate. This just
        // surfaces a heads-up when a higher rate pushes the item's total cost
        // over what was budgeted, without blocking the entry.
        if(item && item.budgeted_rate && line.agreed_rate && line.estimated_qty){
          const budgetedAmount = Number(item.budgeted_qty) * Number(item.budgeted_rate);
          const committedAmount = (state.committedAmount[item.id] || 0) + (line.estimated_qty * line.agreed_rate);
          if(committedAmount > budgetedAmount){
            toast(`Heads up: at ₹${fmtNum(line.agreed_rate)}, "${item.description}" is now costing more than its ₹${fmtNum(budgetedAmount)} budget (₹${fmtNum(committedAmount)} committed so far). Quantity is still within the WBS cap — this is a cost flag, not a block.`, true);
          }
        }
      });
    });
    table.querySelectorAll('.wo-line-del').forEach(btn => {
      btn.addEventListener('click', () => { state.newWOLines.splice(+btn.dataset.idx, 1); renderWOLines(); });
    });
    table.querySelectorAll('.wo-line-note-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = +btn.dataset.idx;
        const current = state.newWOLines[idx].scope_description || '';
        const val = prompt('Scope description for this line (printed on the Work Order document):', current);
        if(val !== null){ state.newWOLines[idx].scope_description = val.trim() || null; renderWOLines(); }
      });
    });
  };
  renderWOLines();

  const addLineBtn = document.getElementById('addWOLineBtn');
  if(addLineBtn) addLineBtn.onclick = () => {
    const already = new Set(state.newWOLines.map(l => l.budget_item_id));
    if(billableItems.every(b => already.has(b.id))){ toast('All budget items are already added to this Work Order.', true); return; }
    state.addingWOLine = true;
    renderWOLines();
  };

  document.getElementById('cancelWOBtn').onclick = () => { state.creatingWO = false; state.editingWOId = null; state.editingWOOriginalLineIds = null; state.addingWOLine = false; renderMain(); };
  document.getElementById('saveWOBtn').onclick = async () => {
    const subcontractor_id = scIdField.value;
    const wo_ref = document.getElementById('woRef').value.trim();
    const wo_date = document.getElementById('woDate').value;
    const nature_of_work = document.getElementById('woNature').value.trim();
    const retention_pct = parseFloat(document.getElementById('woRetention').value) || 0;
    const tds_pct = parseFloat(document.getElementById('woTds').value) || 0;
    const safety_pct = parseFloat(document.getElementById('woSafetyPct').value) || 0;
    const safety_amount = parseFloat(document.getElementById('woSafetyAmt').value) || 0;
    const gst_pct = parseFloat(document.getElementById('woGst').value) || 0;
    const terms_and_conditions = document.getElementById('woTerms').value;

    if(!subcontractor_id){ toast('Select a subcontractor.', true); return; }
    if(!wo_ref){ toast('WO reference number is required.', true); return; }
    if(!wo_date){ toast('WO date is required.', true); return; }
    if(!state.newWOLines.length){ toast('Add at least one line item.', true); return; }
    if(state.newWOLines.some(l => !l.agreed_rate)){ toast('Every line item needs an agreed rate.', true); return; }

    const saveBtn = document.getElementById('saveWOBtn');
    const payload = { wo_ref, wo_date, nature_of_work, retention_pct, tds_pct, safety_pct, safety_amount, gst_pct, terms_and_conditions };

    if(editing){
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      const ok = await updateWorkOrder(editingWOId, payload);
      if(ok){
        const linesOk = await reconcileWOLineItems(editingWOId, state.newWOLines, state.editingWOOriginalLineIds || new Set());
        if(linesOk){
          toast('Work Order updated.');
          state.editingWOId = null; state.newWOLines = []; state.editingWOOriginalLineIds = null;
          await loadWorkOrders(project.id);
          renderMain();
          return;
        }
      }
      saveBtn.disabled = false; saveBtn.textContent = 'Save Changes';
    } else {
      saveBtn.disabled = true; saveBtn.textContent = 'Creating…';
      const wo = await createWorkOrder({ project_id: project.id, subcontractor_id, ...payload });
      if(wo){
        const ok = await createWOLineItems(wo.id, state.newWOLines);
        if(ok){
          toast('Work Order created.');
          state.creatingWO = false;
          state.newWOLines = [];
          await loadWorkOrders(project.id);
          renderMain();
          return;
        }
      }
      saveBtn.disabled = false; saveBtn.textContent = 'Create Work Order';
    }
  };
}

// Opens the edit form for an existing WO — loads full detail, pre-fills the
// line-item working set (tagging each with its real DB id so save knows
// what to update vs insert), and remembers this WO's own prior committed
// quantities so editing isn't blocked by its own existing claim.
async function openWOEditForm(woId, project){
  await loadWODetail(woId, project.id);
  if(!state.woDetail) return;
  const ownQty = {};
  state.newWOLines = (state.woDetail.ra_wo_line_items || []).map(l => {
    if(l.estimated_qty) ownQty[l.budget_item_id] = (ownQty[l.budget_item_id] || 0) + Number(l.estimated_qty);
    return { existingId: l.id, budget_item_id: l.budget_item_id, agreed_rate: l.agreed_rate, estimated_qty: l.estimated_qty, scope_description: l.scope_description };
  });
  state.editingWOOwnQty = ownQty;
  state.editingWOOriginalLineIds = new Set((state.woDetail.ra_wo_line_items || []).map(l => l.id));
  state.editingWOId = woId;
  state.addingWOLine = false;
  renderMain();
}

async function updateWorkOrder(woId, payload){
  try{
    const { error } = await withRetry(() => sb.from('ra_work_orders').update(payload).eq('id', woId));
    if(error){
      if(error.message && /duplicate|unique/i.test(error.message)){
        toast('This WO reference already exists for this subcontractor on this project.', true);
      } else {
        toast(error.message, true);
      }
      return false;
    }
    return true;
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); return false; }
}

// Reconciles the edited line-item list against what was originally there:
// existing lines get updated in place, new ones get inserted, and anything
// removed gets deleted — unless it's already been billed, in which case the
// delete is skipped with a clear message rather than failing silently.
async function reconcileWOLineItems(woId, currentLines, originalIds){
  try{
    const keptIds = new Set(currentLines.filter(l => l.existingId).map(l => l.existingId));
    const toDelete = [...originalIds].filter(id => !keptIds.has(id));

    for(const id of toDelete){
      const { error } = await sb.from('ra_wo_line_items').delete().eq('id', id);
      if(error){
        if(error.message && /foreign key|violat/i.test(error.message)){
          toast('Couldn\'t remove one line item — it already has billing against it, so it was kept.', true);
        } else {
          toast(error.message, true);
          return false;
        }
      }
    }

    for(const line of currentLines){
      if(line.existingId){
        const { error } = await sb.from('ra_wo_line_items').update({
          agreed_rate: line.agreed_rate, estimated_qty: line.estimated_qty, scope_description: line.scope_description || null
        }).eq('id', line.existingId);
        if(error){ toast(error.message, true); return false; }
      } else {
        const { error } = await sb.from('ra_wo_line_items').insert({
          wo_id: woId, budget_item_id: line.budget_item_id, sl_no: 999,
          agreed_rate: line.agreed_rate, estimated_qty: line.estimated_qty, scope_description: line.scope_description || null
        });
        if(error){ toast(error.message, true); return false; }
      }
    }
    return true;
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); return false; }
}

async function createWorkOrder(payload){
  try{
    const { data: { user } } = await withRetry(() => sb.auth.getUser());
    const { data, error } = await withRetry(() =>
      sb.from('ra_work_orders').insert({ ...payload, created_by: user.id }).select().single()
    );
    if(error){
      if(error.message && /duplicate|unique/i.test(error.message)){
        toast('This WO reference already exists for this subcontractor on this project.', true);
      } else {
        toast(error.message, true);
      }
      return null;
    }
    return data;
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); return null; }
}

async function createWOLineItems(wo_id, lines){
  try{
    const rows = lines.map((l, idx) => ({ wo_id, budget_item_id: l.budget_item_id, sl_no: idx+1, agreed_rate: l.agreed_rate, scope_description: l.scope_description || null, estimated_qty: l.estimated_qty || null }));
    const { error } = await withRetry(() => sb.from('ra_wo_line_items').insert(rows));
    if(error){ toast(error.message, true); return false; }
    return true;
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); return false; }
}

/* ============================================================================
   WORK ORDER — lock, soft-delete/bin (mirrors the budget-item lock and the
   bill bin patterns already used elsewhere in the app).
============================================================================ */
async function toggleWOLock(wo, project){
  const locking = !wo.billing_locked;
  let reason = null;
  if(locking){
    reason = prompt(`Lock billing for WO #${wo.order_no} (${wo.wo_ref})? Bills already submitted stay as they are, but no further bill can be submitted against this WO while locked.\n\nReason (optional):`, '');
    if(reason === null) return;
  } else {
    if(!confirm(`Unlock billing for WO #${wo.order_no}?`)) return;
  }
  try{
    const { data, error } = await withRetry(() =>
      sb.from('ra_work_orders').update({ billing_locked: locking, lock_reason: locking ? (reason.trim() || null) : null }).eq('id', wo.id).select().single()
    );
    if(error){ toast(error.message, true); return; }
    const idx = state.workOrders.findIndex(w => w.id === wo.id);
    if(idx !== -1) state.workOrders[idx] = { ...state.workOrders[idx], ...data };
    toast(locking ? 'Work Order locked — no further billing until unlocked.' : 'Work Order unlocked.');
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function deleteWorkOrder(wo, project){
  if(!confirm(`Delete WO #${wo.order_no} (${wo.wo_ref})? It'll move to the Work Order Bin and can be restored or permanently removed from there.`)) return;
  try{
    const { data: { user } } = await withRetry(() => sb.auth.getUser());
    const { error } = await withRetry(() => sb.from('ra_work_orders').update({ deleted_at: new Date().toISOString(), deleted_by: user.id }).eq('id', wo.id));
    if(error){ toast(error.message, true); return; }
    const idx = state.workOrders.findIndex(w => w.id === wo.id);
    if(idx !== -1) state.workOrders[idx] = { ...state.workOrders[idx], deleted_at: new Date().toISOString() };
    toast('Work Order moved to Bin.');
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function restoreWorkOrder(wo){
  try{
    const { error } = await withRetry(() => sb.from('ra_work_orders').update({ deleted_at: null, deleted_by: null }).eq('id', wo.id));
    if(error){ toast(error.message, true); return; }
    const idx = state.workOrders.findIndex(w => w.id === wo.id);
    if(idx !== -1) state.workOrders[idx] = { ...state.workOrders[idx], deleted_at: null };
    toast('Work Order restored.');
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function emptyWOBin(projectId){
  const binItems = state.workOrders.filter(wo => wo.deleted_at);
  if(!binItems.length){ toast('The Work Order Bin is already empty.', true); return; }
  if(!confirm(`Permanently delete all ${binItems.length} Work Order(s) in the Bin? This cannot be undone.`)) return;
  if(!confirm('Really sure? This is the last confirmation — these cannot be recovered after this.')) return;
  try{
    const ids = binItems.map(wo => wo.id);
    const { error } = await withRetry(() => sb.from('ra_work_orders').delete().in('id', ids));
    if(error){
      if(error.message && /foreign key|violat/i.test(error.message)){
        toast('Can\'t permanently delete — one or more of these Work Orders already has bills raised against it. Bills must be removed first.', true);
      } else {
        toast(error.message, true);
      }
      return;
    }
    state.workOrders = state.workOrders.filter(wo => !wo.deleted_at);
    toast('Work Order Bin emptied.');
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

/* ============================================================================
   PRINT / PDF — Work Order document, matching CCI's real letterhead format
============================================================================ */
async function printWorkOrder(woId, project){
  toast('Preparing document…');
  try{
    const { data: wo, error } = await withRetry(() =>
      sb.from('ra_work_orders')
        .select('*, ra_subcontractors(*), ra_wo_line_items(*, ra_budget_items(description, unit, budgeted_qty, stage_id))')
        .eq('id', woId).single()
    );
    if(error){ toast(error.message, true); return; }

    const sc = wo.ra_subcontractors || {};
    const lines = wo.ra_wo_line_items || [];
    let total = 0;
    const rows = lines.map((l, idx) => {
      const item = l.ra_budget_items || {};
      const amount = (l.estimated_qty && l.agreed_rate) ? l.estimated_qty * l.agreed_rate : null;
      if(amount) total += amount;
      return `
        <tr>
          <td>${idx+1}</td>
          <td>
            <div><strong>${escapeHtml(item.description||'')}</strong></div>
            ${item.stage_id ? `<div class="wo-doc-scope" style="color:#1B3A6B;">${escapeHtml(getStagePath(item.stage_id))}</div>` : ''}
            ${l.scope_description ? `<div class="wo-doc-scope">${escapeHtml(l.scope_description)}</div>` : ''}
          </td>
          <td class="num">${escapeHtml(item.unit||'')}</td>
          <td class="num">${l.estimated_qty ? fmtNum(l.estimated_qty) : '—'}</td>
          <td class="num">${l.agreed_rate ? fmtNum(l.agreed_rate) : '—'}</td>
          <td class="num">${amount ? fmtNum(amount) : '—'}</td>
        </tr>`;
    }).join('');

    document.getElementById('printArea').innerHTML = `
      <div class="wo-doc">
        ${buildPrintHeader(true)}
        <div class="wo-doc-title">SUBCONTRACT WORK ORDER</div>
        <div class="wo-doc-meta">
          <div><div class="l">Order ID</div>#${wo.order_no}</div>
