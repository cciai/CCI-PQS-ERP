  const LS = lsIs(project);
  const lines = (wo.ra_wo_line_items || []).filter(l => LS ? l.activity === 'lumpsum' : l.activity !== 'lumpsum').sort((a,b) => (a.sl_no||0) - (b.sl_no||0));
  const isDraft = bill.status === 'draft';
  // Editable through "submitted" too — locked only once approved or paid. Every
  // edit while submitted still re-validates against the budget cap live (the
  // per-row DB trigger fires on every change regardless of how it got there).
  const isFinalized = !!bill.finalized_at;
  const isEditable = !isFinalized && (bill.status === 'draft' || bill.status === 'submitted') && canCreateWO();
  const canDelete = !isFinalized && (isOwner() || ((bill.status === 'draft' || bill.status === 'submitted') && canCreateWO()));

  const lineMap = {};
  state.billLines.forEach(e => { lineMap[e.wo_line_item_id] = e.this_qty; });

  let subTotal = 0, prevSubTotal = 0;
  const rowsHtml = lines.map(l => {
    const item = woLineItem(l);
    const rate = Number(l.agreed_rate || 0);
    const prevQty = state.billPrevCumulative[l.id] || 0;
    const thisQty = lineMap[l.id] || 0;
    const cumQty = prevQty + Number(thisQty);
    const thisAmt = thisQty * rate;
    prevSubTotal += prevQty * rate;
    subTotal += thisAmt;
    const lineLocked = !!item.billing_locked || isStageLockedInherited(item.stage_id);
    const lockTitle = item.billing_locked ? (item.lock_reason || 'Billing locked by Owner') : 'A stage above this item is locked';
    return `
      <div class="bitem" style="grid-template-columns:1fr 60px 80px 90px 90px 90px 110px;">
        <span class="desc">${escapeHtml(item.description||'')}${lineLocked ? ` <span class="lock-badge lock-badge-own" title="${escapeHtml(lockTitle)}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:inline-block;vertical-align:-2px"><rect x="4" y="11" width="16" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Locked</span>` : ''}<div class="wo-line-path">${escapeHtml(getStagePath(item.stage_id))}</div></span>
        <span class="unit">${escapeHtml(item.unit||'')}</span>
        <span class="rate">${l.activity==='lumpsum' ? '—' : '₹'+fmtNum(rate)}</span>
        <span class="qty">${fmtNum(prevQty)}</span>
        <span>${isEditable && !lineLocked ? `<input type="number" inputmode="decimal" step="0.001" class="bill-line-qty" data-line="${l.id}" data-rate="${rate}" value="${thisQty||''}" placeholder="0">` : `<span class="qty">${fmtNum(thisQty)}</span>`}</span>
        <span class="qty">${fmtNum(cumQty)}</span>
        <span class="amount" id="billAmt-${l.id}">₹${fmtNum(thisAmt)}</span>
      </div>`;
  }).join('');

  const retentionAmt = subTotal * (wo.retention_pct||0)/100;
  const tdsAmt = subTotal * (wo.tds_pct||0)/100;
  const safetyAmt = wo.safety_pct ? subTotal * wo.safety_pct/100 : (wo.safety_amount||0);
  const debitAmt = Number(bill.debit_amount || 0);
  // A bill can override the WO's GST setting (add it where the WO has none, or
  // remove it for one bill without changing the WO's standing default).
  const gstOverridden = bill.gst_pct !== null && bill.gst_pct !== undefined;
  const effectiveGstPct = gstOverridden ? Number(bill.gst_pct) : Number(wo.gst_pct||0);
  const gstAmt = subTotal * effectiveGstPct/100;
  const totalDeductions = retentionAmt + tdsAmt + safetyAmt + debitAmt;
  const netPayable = subTotal - totalDeductions + gstAmt;
  const cumulativeSubTotal = prevSubTotal + subTotal;

  tabContent.innerHTML = `
    <button class="btn tiny" id="backToWO" style="margin-bottom:14px;">${state.billEntryReturnTo === 'bills' ? '← Back to Bills' : '← Back to Work Order'}</button>
    <div class="wo-form">
      <h3 class="wo-form-title">
        Bill #${bill.bill_no} <span class="badge ${bill.status==='draft'?'internal':'billable'}">${bill.status}</span>${isFinalized ? ` <span class="finalized-chip" title="Finalized ${new Date(bill.finalized_at).toLocaleDateString('en-IN')}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:inline-block;vertical-align:-2px"><rect x="4" y="11" width="16" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Finalized</span>` : ''}

      ${isFinalized ? `<div class="locked-note"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:inline-block;vertical-align:-2px"><rect x="4" y="11" width="16" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Finalized by Accounts on ${new Date(bill.finalized_at).toLocaleDateString('en-IN')} — this bill is now permanently locked. No edits or deletion, by anyone, including Owner.</div>` : ''}

      ${LS ? `<div id="lsTrack"></div>${isEditable ? lsAddBarHtml() : ''}<div class="wo-rate-note" style="margin-bottom:8px;">Lump-sum billing — enter the <b>amount in ₹</b> for each floor. Quantity and rate are not used.</div>` : ''}
      <div class="bitem-head" style="grid-template-columns:1fr 60px 80px 90px 90px 90px 110px;">
        <span>${LS ? 'Item – floor' : 'Item'}</span><span>Unit</span><span class="rate">${LS ? '' : 'Rate'}</span><span class="qty">${LS ? 'Previous ₹' : 'Previous'}</span><span class="qty">${LS ? 'This bill ₹' : 'This Bill'}</span><span class="qty">${LS ? 'Cumulative ₹' : 'Cumulative'}</span><span class="amount">This Amount</span>
      </div>
      <div id="billRows">${rowsHtml}${LS && !lines.length ? '<div class="wo-lines-empty">No items added yet — choose category, floor and item above.</div>' : ''}</div>


<h4 class="wo-lines-title">Debit / Recovery (optional)</h4>
      <div class="field"><label>Debit amount ₹</label><input id="billDebitAmount" type="number" inputmode="decimal" step="0.01" value="${debitAmt||''}" style="max-width:220px;" ${!isEditable?'disabled':''}></div>
      <div class="field"><label>What is this debit for?</label><textarea id="billDebitNote" rows="3" placeholder="e.g. Cost of shuttering plywood issued to subcontractor, 15 sheets @ ₹450 — recovered as per WO clause 1" ${!isEditable?'disabled':''}>${escapeHtml(bill.debit_note||'')}</textarea></div>

      <h4 class="wo-lines-title">GST</h4>
      <div class="field" style="max-width:280px;">
        <label>GST for this bill</label>
        <select id="billGstSelect" ${!isEditable?'disabled':''}>
          <option value="" ${!gstOverridden?'selected':''}>Use Work Order default (${wo.gst_pct||0}%)</option>
          <option value="0" ${gstOverridden && effectiveGstPct===0?'selected':''}>Not applicable</option>
          <option value="5" ${gstOverridden && effectiveGstPct===5?'selected':''}>5%</option>
          <option value="18" ${gstOverridden && effectiveGstPct===18?'selected':''}>18%</option>
        </select>
      </div>
      <div class="wo-rate-note">Overriding here only changes GST for this one bill — the Work Order's own GST setting stays as-is for future bills.</div>

      <div class="bill-summary">
        <div class="bill-summary-row"><span>Sub Total (A)</span><span id="billSubTotal">₹${fmtNum(subTotal)}</span></div>
        <div class="bill-summary-row"><span>Retention (${wo.retention_pct}%)</span><span id="billRetention">− ₹${fmtNum(retentionAmt)}</span></div>
        <div class="bill-summary-row"><span>TDS (${wo.tds_pct}%)</span><span id="billTds">− ₹${fmtNum(tdsAmt)}</span></div>
        <div class="bill-summary-row"><span>Safety</span><span id="billSafety">− ₹${fmtNum(safetyAmt)}</span></div>
        <div class="bill-summary-row"><span>Debit</span><span id="billDebit">− ₹${fmtNum(debitAmt)}</span></div>
        <div class="bill-summary-row"><span>GST (<span id="billGstPct">${effectiveGstPct}</span>%)</span><span id="billGst">+ ₹${fmtNum(gstAmt)}</span></div>
        <div class="bill-summary-row bill-summary-total"><span>Net Payable (This Bill)</span><span id="billNet">₹${fmtNum(netPayable)}</span></div>
        <div class="bill-summary-row"><span>Cumulative Bill Value</span><span>₹${fmtNum(cumulativeSubTotal)}</span></div>
      </div>

      ${isEditable && isDraft ? `
        <div class="modal-actions" style="margin-top:20px;">
          <button class="btn" id="saveDraftBtn">Save Draft</button>
          <button class="btn primary" id="submitBillBtn">Submit Bill</button>
        </div>
      ` : ''}
      ${isEditable && !isDraft ? `
        <div class="modal-actions" style="margin-top:20px;">
          <button class="btn primary" id="saveChangesBtn">Save Changes</button>
        </div>
      ` : ''}
      ${bill.status === 'submitted' && canApproveBill() ? `
        <div class="modal-actions" style="margin-top:20px;">
          <button class="btn" id="rejectBillBtn" style="color:var(--red);border-color:rgba(193,69,58,0.4);">Reject</button>
          <button class="btn primary" id="approveBillBtn">Approve Bill</button>
        </div>

      ${(bill.status === 'approved' || bill.status === 'paid') && !isFinalized && canFinalizeBill() ? `
        <div class="modal-actions" style="margin-top:20px;">

        </div>
      ` : ''}

      ${bill.status !== 'draft' ? renderBillLedgerNote(wo, netPayable) : ''}
    </div>
  `;

  document.getElementById('backToWO').onclick = async () => {
    state.currentBillId = null;
    if(state.billEntryReturnTo === 'bills'){

    }
    renderMain();
  };
  const deleteBtn = document.getElementById('deleteBillBtn');
  if(deleteBtn) deleteBtn.onclick = () => deleteBill(bill);
  document.getElementById('printBillBtn').onclick = () => printBill(bill, wo, lines, subTotal, retentionAmt, tdsAmt, safetyAmt, debitAmt, gstAmt, effectiveGstPct, netPayable, prevSubTotal, cumulativeSubTotal, project);

  const recompute = () => {
    let st = 0;
    document.querySelectorAll('.bill-line-qty').forEach(inp => {
      const qty = parseFloat(inp.value) || 0;
      const rate = parseFloat(inp.dataset.rate) || 0;
      const amt = qty * rate;
      st += amt;
      document.getElementById(`billAmt-${inp.dataset.line}`).textContent = '₹'+fmtNum(amt);
    });
    const ret = st * (wo.retention_pct||0)/100;
    const tds = st * (wo.tds_pct||0)/100;
    const saf = wo.safety_pct ? st * wo.safety_pct/100 : (wo.safety_amount||0);
    const gstSelect = document.getElementById('billGstSelect');
    const gstPctNow = gstSelect && gstSelect.value !== '' ? Number(gstSelect.value) : Number(wo.gst_pct||0);
    const gst = st * gstPctNow/100;
    const debitInput = document.getElementById('billDebitAmount');
    const deb = debitInput ? (parseFloat(debitInput.value) || 0) : debitAmt;
    document.getElementById('billSubTotal').textContent = '₹'+fmtNum(st);
    document.getElementById('billRetention').textContent = '− ₹'+fmtNum(ret);
    document.getElementById('billTds').textContent = '− ₹'+fmtNum(tds);
    document.getElementById('billSafety').textContent = '− ₹'+fmtNum(saf);
    document.getElementById('billDebit').textContent = '− ₹'+fmtNum(deb);
    document.getElementById('billGstPct').textContent = gstPctNow;
    document.getElementById('billGst').textContent = '+ ₹'+fmtNum(gst);
    document.getElementById('billNet').textContent = '₹'+fmtNum(st - ret - tds - saf - deb + gst);
    if(LS) lsUpdateTrack();
  };
  document.querySelectorAll('.bill-line-qty').forEach(inp => inp.addEventListener('input', recompute));
  // ---- lump-sum extras: tracking panel + add-floor bar ----
  let lsOthers = null; const lsInfoNow = LS ? lsInfo() : null;
  const lsMine = () => { const m = { structure: 0, finishing: 0 }; document.querySelectorAll('.bill-line-qty').forEach(inp => { const l = lines.find(x => x.id === inp.dataset.line); const c = l && l.work_type === 'finishing' ? 'finishing' : 'structure'; m[c] += parseFloat(inp.value) || 0; });
    if(!document.querySelectorAll('.bill-line-qty').length) state.billLines.forEach(e => { const l = lines.find(x => x.id === e.wo_line_item_id); if(l) m[l.work_type === 'finishing' ? 'finishing' : 'structure'] += Number(e.this_qty || 0); }); return m; };
  const lsUpdateTrack = () => { const el = document.getElementById('lsTrack'); if(!el || !lsOthers) return; const mine = lsMine(); el.innerHTML = lsTrackHtml(lsInfoNow, lsOthers, mine); state.lsOver = (lsOthers.structure + lsOthers.finishing + mine.structure + mine.finishing) - lsInfoNow.grand > 0.5; };
  if(LS){
    lsLoadOthers(project, bill.id).then(o => { lsOthers = o; lsUpdateTrack(); updFloorInfo(); });
    const catSel = document.getElementById('lsCat'), floorSel = document.getElementById('lsFloor'), itemSel = document.getElementById('lsItem');
    const fillFloors = () => { if(!catSel) return; floorSel.innerHTML = lsInfoNow.floors[catSel.value].map(f => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join(''); fillItems(); };
    function fillItems(){ const its = lsInfoNow.items[floorSel.value] || []; itemSel.innerHTML = its.map(i => `<option value="${i.id}">${escapeHtml(i.name)}</option>`).join(''); updFloorInfo(); }
    function updFloorInfo(){ const el = document.getElementById('lsFloorInfo'); if(!el || !floorSel || !lsOthers) return; const f = lsInfoNow.floors[catSel.value].find(x => x.id === floorSel.value); const it = (lsInfoNow.items[floorSel.value] || []).find(x => x.id === itemSel.value);
      el.textContent = (f ? `Floor budget ${lsInr(f.value)} · billed ${lsInr(lsOthers.byFloor[f.id] || 0)}` : '') + (it ? ` | ${it.name}: budget ${lsInr(it.value)} · billed ${lsInr(lsOthers.byItem[it.id] || 0)}` : ''); }
    if(catSel){
      fillFloors(); catSel.addEventListener('change', fillFloors); floorSel.addEventListener('change', fillItems); itemSel.addEventListener('change', updFloorInfo);
      document.getElementById('lsAddBtn').onclick = async () => {
        if(!floorSel.value || !itemSel.value){ toast('Pick a floor and an item.', true); return; }

        const typedDebit = document.getElementById('billDebitAmount') ? document.getElementById('billDebitAmount').value : '';
        const line = await lsAddItemLine(project, wo, catSel.value, floorSel.value, itemSel.value); if(!line) return;
        await loadBillEntry(bill.id, wo.id); renderMain();
        document.querySelectorAll('.bill-line-qty').forEach(inp => { if(typed[inp.dataset.line] !== undefined) inp.value = typed[inp.dataset.line]; });
        const di = document.getElementById('billDebitAmount'); if(di && typedDebit) di.value = typedDebit;
        const ni = document.querySelector(`.bill-line-qty[data-line="${line.id}"]`); if(ni){ ni.dispatchEvent(new Event('input', { bubbles: true })); ni.focus(); }
      };
    }
  }
  const debitInput = document.getElementById('billDebitAmount');
  if(debitInput) debitInput.addEventListener('input', recompute);
  const gstSelectEl = document.getElementById('billGstSelect');
  if(gstSelectEl) gstSelectEl.addEventListener('change', recompute);

  const saveBtn = document.getElementById('saveDraftBtn');
  if(saveBtn) saveBtn.onclick = () => saveBillLines(bill.id, false);
  const submitBtn = document.getElementById('submitBillBtn');
  if(submitBtn) submitBtn.onclick = () => { if(LS && state.lsOver && !confirm('This bill takes total billing ABOVE the full budget value. Submit anyway?')) return; saveBillLines(bill.id, true); };
  const saveChangesBtn = document.getElementById('saveChangesBtn');
  if(saveChangesBtn) saveChangesBtn.onclick = () => saveBillLines(bill.id, false);
  const approveBtn = document.getElementById('approveBillBtn');
  if(approveBtn) approveBtn.onclick = () => approveBill(bill.id);
  const rejectBtn = document.getElementById('rejectBillBtn');
  if(rejectBtn) rejectBtn.onclick = () => rejectBill(bill.id);
  const finalizeBtn = document.getElementById('finalizeBillBtn');
  if(finalizeBtn) finalizeBtn.onclick = () => finalizeBill(bill.id);
}

async function finalizeBill(billId){
  if(!confirm('Finalize this bill? Once finalized, it can never be edited or deleted again — not even by the Owner. Only do this once Accounts has fully reconciled it.')) return;
  try{
    const { data: { user } } = await withRetry(() => sb.auth.getUser());
    const { error } = await withRetry(() => sb.from('ra_bills').update({ finalized_at: new Date().toISOString(), finalized_by: user.id }).eq('id', billId));
    if(error){ toast(error.message, true); return; }
    toast('Bill finalized and locked.');
    await loadBillEntry(billId, state.woDetail.id);
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function rejectBill(billId){
  const reason = prompt('Reason for rejecting this bill (sent back to draft for the QS to fix):');
  if(reason === null) return; // cancelled
  if(!reason.trim()){ toast('A reason is required to reject a bill.', true); return; }
  try{
    const { data: { user } } = await withRetry(() => sb.auth.getUser());
    const { error } = await withRetry(() => sb.from('ra_bills').update({
      status: 'draft', rejection_reason: reason.trim(), rejected_by: user.id, rejected_at: new Date().toISOString()
    }).eq('id', billId));
    if(error){ toast(error.message, true); return; }
    toast('Bill rejected and sent back to draft.');
    state.billsCacheProjectId = null;
    await loadBillEntry(billId, state.woDetail.id);
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

function printBill(bill, wo, lines, subTotal, retentionAmt, tdsAmt, safetyAmt, debitAmt, gstAmt, gstPct, netPayable, prevSubTotal, cumulativeSubTotal, project){

    const item = woLineItem(l);

  const cumulativeNet = cumulativeSubTotal - cumulativeDeductions + cumulativeGst;

  document.getElementById('printArea').innerHTML = `

          Retention ${wo.retention_pct}% · TDS ${wo.tds_pct}% · Safety ${wo.safety_pct?wo.safety_pct+'%':'₹'+fmtNum(wo.safety_amount||0)} · GST ${gstPct}%${bill.gst_pct!==null&&bill.gst_pct!==undefined?' (overridden for this bill)':''}
        </div>
      </div>

      <table class="wo-doc-table">
        <thead>
          <tr>
            <th rowspan="2">Sl</th><th rowspan="2">Description</th><th rowspan="2">Unit</th><th rowspan="2">Rate</th>
            <th colspan="2">Previous Bill</th><th colspan="2">This Bill</th><th colspan="2">Cumulative</th>

async function deleteBill(bill){
  if(bill.finalized_at){ toast('This bill is finalized and permanently locked — it cannot be deleted.', true); return; }
  if(!confirm(`Delete Bill #${bill.bill_no}? It'll move to the Bin and can be restored or permanently removed from there.`)) return;
  try{
    const { data: { user } } = await withRetry(() => sb.auth.getUser());
    const { error } = await withRetry(() => sb.from('ra_bills').update({ deleted_at: new Date().toISOString(), deleted_by: user.id }).eq('id', bill.id));
    if(error){ toast(error.message, true); return; }
    toast('Bill moved to Bin.');
    state.billsCacheProjectId = null;
    state.currentBillId = null;
    state.woBills = state.woBills.filter(b => b.id !== bill.id);
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function saveBillLines(billId, thenSubmit){
  // Editable lines come straight from their inputs. Locked lines never render
  // an input (they're shown as a static value instead), so without this
  // they'd silently vanish on save — pull their existing saved qty forward instead.
  const editedIds = new Set([...document.querySelectorAll('.bill-line-qty')].map(inp => inp.dataset.line));
  const rows = [...document.querySelectorAll('.bill-line-qty')]
    .map(inp => ({ bill_id: billId, wo_line_item_id: inp.dataset.line, this_qty: parseFloat(inp.value) || 0 }));
  state.billLines.forEach(e => {
    if(!editedIds.has(e.wo_line_item_id) && Number(e.this_qty) > 0){
      rows.push({ bill_id: billId, wo_line_item_id: e.wo_line_item_id, this_qty: Number(e.this_qty) });
    }
  });
  const finalRows = rows.filter(r => r.this_qty > 0);
  const debitAmountEl = document.getElementById('billDebitAmount');
  const debitNoteEl = document.getElementById('billDebitNote');
  const gstSelectEl = document.getElementById('billGstSelect');
  const debit_amount = debitAmountEl && debitAmountEl.value ? parseFloat(debitAmountEl.value) : 0;
  const debit_note = debitNoteEl ? debitNoteEl.value.trim() || null : null;
  const gst_pct = gstSelectEl && gstSelectEl.value !== '' ? parseFloat(gstSelectEl.value) : null;
  try{
    const { error: debitErr } = await withRetry(() => sb.from('ra_bills').update({ debit_amount, debit_note, gst_pct }).eq('id', billId));
    if(debitErr){ toast(debitErr.message, true); return; }
    // Clear then reinsert this bill's lines — simplest way to handle add/remove/change in one pass.
    const { error: delErr } = await withRetry(() => sb.from('ra_bill_line_entries').delete().eq('bill_id', billId));
    if(delErr){ toast(delErr.message, true); return; }
    if(finalRows.length){
      const { error: insErr } = await withRetry(() => sb.from('ra_bill_line_entries').insert(finalRows));
      if(insErr){ toast(insErr.message, true); return; }
    }
    if(thenSubmit){
      await submitBill(billId);
    } else {
      toast('Draft saved.');
      state.billsCacheProjectId = null;
      await loadBillEntry(billId, state.woDetail.id);
      renderMain();
    }
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

/* ============================================================================
   BILLS TAB — consolidated view of every bill across every Work Order on
   this project. This is the "where's the billing module" answer: previously
   bills only existed nested inside each individual WO with no overview.
============================================================================ */
async function loadAllBills(projectId){
  try{
    const { data, error } = await withRetry(() =>
      sb.from('ra_bills')
        .select('*, ra_work_orders!inner(wo_ref, project_id, retention_pct, tds_pct, safety_pct, safety_amount, gst_pct, ra_subcontractors(name, acct_code)), ra_bill_line_entries(this_qty, ra_wo_line_items(agreed_rate))')
        .eq('ra_work_orders.project_id', projectId)
        .is('deleted_at', null)
        .order('created_at', { ascending: false })
    );
    if(error){ toast(error.message, true); state.allBills = []; return; }
    state.allBills = (data || []).map(b => {
      const wo = b.ra_work_orders || {};
      const subTotal = (b.ra_bill_line_entries||[]).reduce((s,e) => s + Number(e.this_qty||0) * Number((e.ra_wo_line_items||{}).agreed_rate||0), 0);
      const deductions = subTotal * ((wo.retention_pct||0)+(wo.tds_pct||0)+(wo.safety_pct||0))/100 + (wo.safety_pct ? 0 : (wo.safety_amount||0)) + Number(b.debit_amount||0);
      const effGstPct = (b.gst_pct !== null && b.gst_pct !== undefined) ? Number(b.gst_pct) : Number(wo.gst_pct||0);
      const gstAmt = subTotal * effGstPct/100;
      const net = subTotal - deductions + gstAmt;
      return { ...b, _subTotal: subTotal, _net: net };
    });
  } catch(err){ toast('Could not load bills — please try again.', true); console.error(err); state.allBills = []; }
}

/* ============================================================================
   BILL BIN — soft-deleted bills. Restore brings them back; Empty Bin (Owner
   only) permanently removes everything currently in the bin.
============================================================================ */
async function loadBinBills(projectId){
  try{
    const { data, error } = await withRetry(() =>
      sb.from('ra_bills')
        .select('*, ra_work_orders!inner(wo_ref, project_id, ra_subcontractors(name, acct_code))')
        .eq('ra_work_orders.project_id', projectId)
        .not('deleted_at', 'is', null)
        .order('deleted_at', { ascending: false })
    );
    if(error){ toast(error.message, true); state.binBills = []; return; }
    state.binBills = data || [];
  } catch(err){ toast('Could not load the Bin — please try again.', true); console.error(err); state.binBills = []; }
}

async function restoreBill(bill){
  try{
    const { error } = await withRetry(() => sb.from('ra_bills').update({ deleted_at: null, deleted_by: null }).eq('id', bill.id));
    if(error){ toast(error.message, true); return; }
    toast('Bill restored.');
    state.billsCacheProjectId = null;
    state.binBills = state.binBills.filter(b => b.id !== bill.id);
    await loadAllBills(bill.ra_work_orders.project_id);
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function emptyBin(projectId){
  if(!state.binBills.length){ toast('The Bin is already empty.', true); return; }
  const confirmMsg = `Permanently delete all ${state.binBills.length} bill(s) in the Bin? This cannot be undone — they will be gone for good, not just moved.`;
  if(!confirm(confirmMsg)) return;
  if(!confirm('Really sure? This is the last confirmation — these bills cannot be recovered after this.')) return;
  try{
    const ids = state.binBills.map(b => b.id);
    const { error } = await withRetry(() => sb.from('ra_bills').delete().in('id', ids));
    if(error){ toast(error.message, true); return; }
    toast('Bin emptied.');
    state.binBills = [];
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function loadDLREntries(projectId, date){
  try{
    const { data, error } = await withRetry(() =>
      sb.from('ra_dlr_entries').select('*, ra_subcontractors(name, acct_code)').eq('project_id', projectId).eq('entry_date', date).order('created_at')
    );
    if(error){ toast(error.message, true); state.dlrEntries = []; return; }
    state.dlrEntries = data || [];
  } catch(err){ toast('Could not load Daily Labour Report — please try again.', true); console.error(err); state.dlrEntries = []; }
}

// Last 7 days' submission status for this project — now based on the
// explicit day-status confirmation, not just "some row happens to exist,"
// which is a more accurate signal of an actually-completed day.
async function loadDLRSubmissionStrip(projectId){
  try{
    const since = new Date(); since.setDate(since.getDate() - 6);
    const sinceStr = since.toISOString().slice(0,10);
    const { data, error } = await withRetry(() =>
      sb.from('ra_dlr_day_status').select('entry_date').eq('project_id', projectId).gte('entry_date', sinceStr)
    );
    if(error){ console.error(error); state.dlrSubmissionStrip = {}; return; }
    const set = new Set((data||[]).map(r => r.entry_date));
    const strip = {};
    for(let i = 6; i >= 0; i--){
      const d = new Date(); d.setDate(d.getDate() - i);
      const key = d.toISOString().slice(0,10);
      strip[key] = set.has(key);
    }
    state.dlrSubmissionStrip = strip;
  } catch(err){ console.error(err); state.dlrSubmissionStrip = {}; }
}

async function loadDLRDayStatus(projectId, date){
  try{
    const { data, error } = await withRetry(() =>
      sb.from('ra_dlr_day_status').select('*').eq('project_id', projectId).eq('entry_date', date).maybeSingle()
    );
    if(error){ console.error(error); state.dlrDayStatus = null; return; }
    state.dlrDayStatus = data || null;
  } catch(err){ console.error(err); state.dlrDayStatus = null; }
}

async function submitDLRDay(project){
  if(!state.dlrEntries.length){ toast('Add at least one subcontractor before submitting.', true); return; }
  try{
    const payload = { project_id: project.id, entry_date: state.dlrDate, submitted_by: session.user.id, submitted_at: new Date().toISOString() };
    const { data, error } = await withRetry(() => sb.from('ra_dlr_day_status').upsert(payload, { onConflict: 'project_id,entry_date' }).select().single());
    if(error){ toast(error.message, true); return; }
    state.dlrDayStatus = data;
    toast(`DLR for ${state.dlrDate} submitted.`);
    await loadDLRSubmissionStrip(project.id);
    state.dlrStripCacheKey = project.id;
    renderDLRTab(project);
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

/* ---------- Daily Labour: read-only feed from EAGLES ---------- */
const EA_TRADES = [
  { key: 'Carpenters', label: 'Carpenters' }, { key: 'Carp Helpers', label: 'Carp Helpers' },
  { key: 'Steel fitters', label: 'Steel Fitters' }, { key: 'St helpers', label: 'St Helpers' },
  { key: 'Masons', label: 'Masons' }, { key: 'Helpers', label: 'Helpers' }, { key: 'Foreman', label: 'Foreman' }
];
const eaNorm = x => String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function eaProjectMatch(eaName, project){
  const a = eaNorm(eaName), b = eaNorm(project.name);
  return !!a && !!b && (a === b || b.includes(a) || a.includes(b));
}
function isoShift(d, n){ const t = new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); }

async function loadEaglesDLR(project, force){
  const today = new Date().toISOString().slice(0,10);
  let to = state.dlrDate > today ? state.dlrDate : today, from = isoShift(to,-13);
  if(state.dlrDate < from){ from = state.dlrDate; if((Date.parse(to)-Date.parse(from))/86400000 > 60) to = isoShift(from,13); }
  const key = from+'|'+to;
  if(!force && state.dlrFeed && state.dlrFeed.key === key && Date.now() - state.dlrFeed.at < 60000) return state.dlrFeed;
  const res = await sb.functions.invoke('dlr-eagles', { body: { from, to } });
  if(res.error){ let m = res.error.message; try{ const j = await res.error.context.json(); m = j.error || m; }catch(e){} throw new Error(m); }
  if(res.data && res.data.error) throw new Error(res.data.error);
  state.dlrFeed = { key, from, to, at: Date.now(), rows: res.data.rows || [], days: res.data.days || [] };
  return state.dlrFeed;
}

function eaDlrSourceToggle(project){
  return `<div class="toolbar" style="margin-bottom:12px;">
    <div class="seg" style="display:inline-flex;border:1px solid var(--paper-line);border-radius:8px;overflow:hidden;">
      <button class="btn tiny ${state.dlrSource==='eagles'?'primary':''}" id="dlrSrcEagles" style="border-radius:0;border:0;">From EAGLES (site app)</button>
      <button class="btn tiny ${state.dlrSource==='manual'?'primary':''}" id="dlrSrcManual" style="border-radius:0;border:0;">Manual entry in CAMELS</button>
    </div></div>`;
}
function eaDlrWireToggle(project){
  const a = document.getElementById('dlrSrcEagles'), m = document.getElementById('dlrSrcManual');
  if(a) a.onclick = () => { state.dlrSource = 'eagles'; renderDLRTab(project); };
  if(m) m.onclick = () => { state.dlrSource = 'manual'; renderDLRTab(project); };
}

async function renderDLRTab(project){
  if(state.dlrSource === 'manual'){ await renderDLRManual(project); const tc = document.getElementById('tabContent'); if(tc){ tc.insertAdjacentHTML('afterbegin', eaDlrSourceToggle(project)); eaDlrWireToggle(project); } return; }
  const tabContent = document.getElementById('tabContent');
  tabContent.innerHTML = eaDlrSourceToggle(project) + `<div class="loading">Reading the Daily Labour Report from EAGLES…</div>`;
  eaDlrWireToggle(project);
  let feed;
  try{ feed = await loadEaglesDLR(project, state.dlrForce); state.dlrForce = false; }
  catch(err){
    tabContent.innerHTML = eaDlrSourceToggle(project) + `<div class="locked-note">Could not read EAGLES: ${escapeHtml(err.message||String(err))}</div><div class="modal-actions" style="justify-content:flex-start"><button class="btn primary" id="dlrRetry">Try again</button></div>`;
    eaDlrWireToggle(project); document.getElementById('dlrRetry').onclick = () => { state.dlrForce = true; renderDLRTab(project); }; return;
  }
  const rowsAll = feed.rows.filter(r => eaProjectMatch(r.project, project));
  const daysAll = feed.days.filter(d => eaProjectMatch(d.project, project));
  const stripDates = []; for(let d = feed.from; d <= feed.to; d = isoShift(d,1)) stripDates.push(d);
  const daySub = new Set(daysAll.filter(d => d.submitted).map(d => d.date));
  const hasRows = new Set(rowsAll.map(r => r.date));
  const today = new Date().toISOString().slice(0,10);
  const dayRows = rowsAll.filter(r => r.date === state.dlrDate);
  const dayInfo = daysAll.find(d => d.date === state.dlrDate);
  // group by subcontractor
  const grp = new Map();
  dayRows.forEach(r => {
    const k = (r.code || '') + '|' + eaNorm(r.subcontractor);
    const g = grp.get(k) || { name: r.subcontractor, code: r.code, camels_id: r.camels_id, t: {}, other: {} };
    const known = EA_TRADES.find(t => t.key === r.trade);
    if(known) g.t[r.trade] = (g.t[r.trade]||0) + r.headcount; else g.other[r.trade||'Other'] = (g.other[r.trade||'Other']||0) + r.headcount;
    grp.set(k, g);
  });
  const list = [...grp.values()].sort((a,b) => (a.name||'').localeCompare(b.name||''));
  const otherKeys = [...new Set(list.flatMap(g => Object.keys(g.other)))];
  const cols = [...EA_TRADES.map(t => ({ key: t.key, label: t.label, other: false })), ...otherKeys.map(k => ({ key: k, label: k, other: true }))];
  const val = (g,c) => c.other ? (g.other[c.key]||0) : (g.t[c.key]||0);
  const tot = g => cols.reduce((s,c) => s + val(g,c), 0);
  const colTot = cols.map(c => list.reduce((s,g) => s + val(g,c), 0));
  const grand = colTot.reduce((s,x) => s + x, 0);
  const subm = daySub.has(state.dlrDate);
  const stripHtml = stripDates.map(d => {
    const ok = daySub.has(d), has = hasRows.has(d);
    const cls = ok ? 'ok' : (has || d <= today ? 'missing' : '');
    const label = new Date(d+'T00:00:00').toLocaleDateString('en-IN', { weekday:'short', day:'numeric' });
    return `<button class="dlr-strip-day ${cls} ${d===state.dlrDate?'selected':''}" data-date="${d}" title="${ok?'Submitted in EAGLES':(has?'Entries exist, not submitted':'Nothing in EAGLES')}">${ok?'✓ ':''}${label}</button>`;
  }).join('');
  tabContent.innerHTML = eaDlrSourceToggle(project) + `
    <div class="dlr-strip">${stripHtml}</div>
    ${subm
      ? `<div class="locked-note" style="color:var(--green);border-color:rgba(63,143,99,0.35);background:rgba(63,143,99,0.08);">✓ Submitted in EAGLES${dayInfo && dayInfo.submitted_at ? ' at '+new Date(dayInfo.submitted_at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) : ''} · ${grand} people across ${list.length} subcontractor${list.length!==1?'s':''}</div>`
      : `<div class="locked-note">${dayRows.length ? 'Entries found in EAGLES but the site has not submitted this day yet.' : 'Nothing entered in EAGLES for this date yet.'}</div>`}
    <div class="toolbar">
      <div class="field" style="max-width:200px; margin:0;"><input type="date" id="dlrDatePicker" value="${state.dlrDate}"></div>
      <button class="btn tiny" id="eaRefreshBtn">↻ Refresh from EAGLES</button>
      <button class="btn tiny" id="eaCsvBtn">CSV</button>
      <span class="pg-status">Read-only · live from EAGLES · updated ${new Date(feed.at).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span>
    </div>
    <div id="eaGridWrap"></div>`;
  eaDlrWireToggle(project);
  const wrap = document.getElementById('eaGridWrap');
  if(!list.length){ wrap.innerHTML = `<div class="wo-lines-empty">No labour in EAGLES for ${escapeHtml(project.name)} on this date.</div>`; }
  else {
    const t = document.createElement('table'); t.className = 'data-table dlr-table';
    t.innerHTML = `<thead><tr><th>Subcontractor</th>${cols.map(c=>`<th>${escapeHtml(c.label)}</th>`).join('')}<th>Total</th></tr></thead><tbody>
      ${list.map(g => `<tr><td>${escapeHtml(g.name||'—')} ${g.code?`<span class="u">${escapeHtml(g.code)}</span>`:''}</td>${cols.map(c=>`<td>${val(g,c)||''}</td>`).join('')}<td class="num"><strong>${tot(g)}</strong></td></tr>`).join('')}
      <tr class="wo-doc-total-row"><td><strong>Total (${list.length})</strong></td>${colTot.map(x=>`<td class="num"><strong>${x}</strong></td>`).join('')}<td class="num"><strong>${grand}</strong></td></tr></tbody>`;
    wrap.appendChild(t);
  }
  document.getElementById('dlrDatePicker').addEventListener('change', async (e) => { if(!e.target.value) return; state.dlrDate = e.target.value; await renderDLRTab(project); });
  document.querySelectorAll('.dlr-strip-day').forEach(b => b.onclick = async () => { state.dlrDate = b.dataset.date; await renderDLRTab(project); });
  document.getElementById('eaRefreshBtn').onclick = () => { state.dlrForce = true; renderDLRTab(project); };
  document.getElementById('eaCsvBtn').onclick = () => {
    if(!list.length){ toast('Nothing to export for this date.', true); return; }
    const out = list.map(g => { const r = { 'Subcontractor': g.name||'', 'Acct Code': g.code||'' }; cols.forEach(c => r[c.label] = val(g,c)); r['Total'] = tot(g); return r; });
    downloadCSV(`CCI DLR (EAGLES) ${project.name} ${state.dlrDate}.csv`, ['Subcontractor','Acct Code',...cols.map(c=>c.label),'Total'], out);
  };
}

function dlrRowTotal(entry){
  return DLR_TRADE_FIELDS.reduce((s,f) => s + (Number(entry[f.key])||0), 0) + (Number(entry.others_count)||0);
}

function renderDLRGrid(project){
  const wrap = document.getElementById('dlrGridWrap');
  const editable = canEnterDLR();
  const table = document.createElement('table');

  const tbody = table.querySelector('tbody');

  const totals = {}; DLR_TRADE_FIELDS.forEach(f => totals[f.key] = 0); totals.others_count = 0; let grandTotal = 0;

  state.dlrEntries.forEach(entry => {
    DLR_TRADE_FIELDS.forEach(f => totals[f.key] += Number(entry[f.key])||0);
    totals.others_count += Number(entry.others_count)||0;

    DLR_TRADE_FIELDS.forEach(f => {
      cells.push(`<td>${editable ? `<input type="number" inputmode="numeric" min="0" class="dlr-cell" data-field="${f.key}" value="${entry[f.key]||''}">` : (entry[f.key]||0)}</td>`);
    });

    cells.push(`<td>${editable ? `<input type="text" class="dlr-cell" data-field="others_label" value="${escapeHtml(entry.others_label||'')}" placeholder="e.g. Electrician">` : escapeHtml(entry.others_label||'')}</td>`);
    cells.push(`<td class="num dlr-row-total">${dlrRowTotal(entry)}</td>`);

    tr.innerHTML = cells.join('');

  });

  const totalsRow = document.createElement('tr');
  totalsRow.className = 'wo-doc-total-row';
  totalsRow.innerHTML = [`<td><strong>Total (${state.dlrEntries.length} subcontractor${state.dlrEntries.length!==1?'s':''})</strong></td>`,
    ...DLR_TRADE_FIELDS.map(f=>`<td class="num"><strong>${totals[f.key]}</strong></td>`),
    `<td class="num"><strong>${totals.others_count}</strong></td>`, `<td></td>`,
    `<td class="num"><strong>${grandTotal}</strong></td>`, `<td></td>`
  ].join('');

  wrap.innerHTML = '';
  wrap.appendChild(table);
  if(!state.dlrEntries.length) wrap.insertAdjacentHTML('beforeend', `<div class="wo-lines-empty">No labour entered for this date yet.${canEnterDLR() ? ' Add a subcontractor below.' : ''}</div>`);

  if(editable) wireDLRRowInputs(project);
}

let dlrCommitTimers = {};
function wireDLRRowInputs(project){
  document.querySelectorAll('#dlrGridWrap tr[data-subcontractor-id]').forEach(tr => {
    const subId = tr.dataset.subcontractorId;
    const entry = state.dlrEntries.find(e => e.subcontractor_id === subId);
    if(!entry) return;
    const entryId = entry.id || subId; // stable key for the debounce timer, even before first save
    tr.querySelectorAll('.dlr-cell').forEach(inp => {
      inp.addEventListener('input', () => {
        const field = inp.dataset.field;
        entry[field] = field === 'others_label' ? inp.value : (parseInt(inp.value,10) || 0);
        tr.querySelector('.dlr-row-total').textContent = dlrRowTotal(entry);
        clearTimeout(dlrCommitTimers[entryId]);
        dlrCommitTimers[entryId] = setTimeout(() => commitDLREntry(entry, project), 500);
      });
    });
    const delBtn = tr.querySelector('.dlr-del-btn');
    if(delBtn) delBtn.onclick = () => deleteDLREntry(entry, project);
  });
}

async function commitDLREntry(entry, project){
  try{
    const payload = { project_id: entry.project_id, subcontractor_id: entry.subcontractor_id, entry_date: entry.entry_date, created_by: session.user.id };
    DLR_TRADE_FIELDS.forEach(f => payload[f.key] = entry[f.key] || 0);
    payload.others_count = entry.others_count || 0;
    payload.others_label = entry.others_label || null;
    payload.updated_at = new Date().toISOString();
    const { data, error } = await withRetry(() => sb.from('ra_dlr_entries').upsert(payload, { onConflict: 'project_id,subcontractor_id,entry_date' }).select().single());
    if(error){ toast(error.message, true); return; }
    entry.id = data.id;
    entry.updated_at = data.updated_at;
    updateDLRSavedLabel(data.updated_at);
    const row = document.querySelector(`#dlrGridWrap tr[data-subcontractor-id="${entry.subcontractor_id}"]`);
    if(row){
      row.dataset.entryId = entry.id;
      row.title = `Last saved ${new Date(data.updated_at).toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'})}`;
    }
  } catch(err){ toast('Could not save — please try again.', true); console.error(err); }
}

function updateDLRSavedLabel(isoTime){
  const el = document.getElementById('dlrSavedLabel');
  if(!el) return;
  const t = new Date(isoTime).toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  el.textContent = `Last saved ${t}`;
}

async function deleteDLREntry(entry, project){
  if(entry.id && !confirm(`Remove ${entry.ra_subcontractors ? entry.ra_subcontractors.name : 'this'} from today's DLR?`)) return;
  state.dlrEntries = state.dlrEntries.filter(e => e !== entry);
  renderDLRGrid(project); // update the screen immediately — don't wait on the network call
  if(entry.id){
    try{
      const { error } = await withRetry(() => sb.from('ra_dlr_entries').delete().eq('id', entry.id));
      if(error){
        toast(error.message, true);
        state.dlrEntries.push(entry); // restore on failure
        renderDLRGrid(project);
        return;
      }
      await loadDLRSubmissionStrip(project.id);
      main_dlrWireStripClicks(project);
    } catch(err){
      toast('Could not reach the server — the row has been restored.', true);
      console.error(err);
      state.dlrEntries.push(entry);
      renderDLRGrid(project);
    }
  }
}

  const openSuggest = () => {
    closeSuggest();

    if(!q) return;
    const already = new Set(state.dlrEntries.map(e => e.subcontractor_id));
    const matches = state.subcontractors
      .filter(s => s.is_active !== false && !already.has(s.id) && (s.name.toLowerCase().includes(q) || (s.acct_code||'').toLowerCase().includes(q)))

function exportDLRCsv(project){

    row['Others #'] = e.others_count || 0;

    return row;
  });
  downloadCSV(`CCI DLR ${project.name} ${state.dlrDate}.csv`,

function printDLR(project){
  if(!state.dlrEntries.length){ toast('No labour entered for this date — nothing to print.', true); return; }
  const rows = state.dlrEntries.map(e => {
    const sc = e.ra_subcontractors || {};
    const row = { 'Subcontractor': sc.name || '', 'Acct Code': sc.acct_code || '' };
    DLR_TRADE_FIELDS.forEach(f => row[f.label] = e[f.key] || 0);
    row['Others'] = e.others_count ? `${e.others_count}${e.others_label ? ' ('+e.others_label+')' : ''}` : '—';
    row['Total'] = dlrRowTotal(e);
    return row;
  });
  const totals = {}; DLR_TRADE_FIELDS.forEach(f => totals[f.label] = 0);
  let grandTotal = 0;
  state.dlrEntries.forEach(e => {
    DLR_TRADE_FIELDS.forEach(f => totals[f.label] += Number(e[f.key])||0);
    grandTotal += dlrRowTotal(e);
  });
  const totalRow = { 'Subcontractor': 'TOTAL', 'Acct Code': '' };
  DLR_TRADE_FIELDS.forEach(f => totalRow[f.label] = totals[f.label]);
  totalRow['Others'] = '';
  totalRow['Total'] = grandTotal;
  rows.push(totalRow);

  printTable(
    `${project.name} — Daily Labour Report`,
    `${state.dlrDate} · ${state.dlrEntries.length} subcontractor${state.dlrEntries.length!==1?'s':''} · ${grandTotal} workers total`,
    ['Subcontractor','Acct Code',...DLR_TRADE_FIELDS.map(f=>f.label),'Others','Total'],
    rows,
    `CCI DLR ${project.name} ${state.dlrDate}`
  );
}

        scSelected.innerHTML = `<span>${escapeHtml(s.name)} <span class="u">${escapeHtml(s.acct_code)}</span></span><button class="icon-btn" id="clearScBtn">✕</button>`;
        document.getElementById('clearScBtn').onclick = () => {

        };

    });

  };
  scSearch.addEventListener('input', openScSuggest);
  scSearch.addEventListener('blur', () => setTimeout(closeScSuggest, 150));
  }

  // Work Orders are standalone — lines are typed in directly (no budget link), so the same
  // activity can go to several subcontractors. Each line: description, activity, unit, qty, rate.
  const WO_QUICK = {
    shuttering:    ['Shuttering – erection, alignment, propping & stripping', 'P.sft'],
    reinforcement: ['Reinforcement – cutting, bending & fixing', 'MT'],
    concrete:      ['Concreting – placing, vibrating, finishing & curing', 'm3'],
    blockwork:     ['Blockwork / masonry', 'm3'],
    plaster:       ['Plastering', 'P.sft'],
    scaffolding:   ['Scaffolding / working platform', 'P.sft'],
    waterproofing: ['Waterproofing', 'P.sft'],
    flooring:      ['Flooring / tiling', 'P.sft'],
    painting:      ['Painting', 'P.sft'],
    excavation:    ['Excavation / earthwork', 'm3']
  };
  const detectActivity = (desc) => { const a = WO_ACTIVITY_LIB.find(x => x.re.test(desc || '')); return a ? a.key : ''; };
  const woTermsEl = () => document.getElementById('woTerms');
  const refreshWOTerms = () => {
    const ta = woTermsEl(); if(!ta || ta.dataset.dirty === '1') return;
    const keys = [];
    state.newWOLines.forEach(l => { const k = l.activity || detectActivity(l.description); if(k && k !== 'other' && !keys.includes(k)) keys.push(k); });
    ta.value = buildWOTerms({
      retention_pct: document.getElementById('woRetention').value, tds_pct: document.getElementById('woTds').value,
      gst_pct: document.getElementById('woGst').value, safety_pct: document.getElementById('woSafetyPct').value,
      safety_amount: document.getElementById('woSafetyAmt').value, activityKeys: keys
    });
