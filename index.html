  const GRID = '1.7fr 130px 74px 92px 100px 104px 56px';
  const renderWOLines = () => {
    const table = document.getElementById('woLinesTable');
    if(!table) return;
    const lines = state.newWOLines;
    const unitOpts = (cur) => ALLOWED_UNITS.map(u => `<option value="${u}" ${cur===u?'selected':''}>${u}</option>`).join('');
    const actOpts = (cur) => `<option value="">Auto</option>` + WO_ACTIVITY_LIB.map(a => `<option value="${a.key}" ${cur===a.key?'selected':''}>${escapeHtml(a.title.split(' / ')[0].split(' (')[0])}</option>`).join('') + `<option value="other" ${cur==='other'?'selected':''}>Other</option>`;
    table.innerHTML = `
      <div class="wo-rate-note" style="margin-bottom:8px;">Type each work item directly — not linked to the budget, so the same activity can be given to different subcontractors. The activity decides which technical clauses are added to the terms below.</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
        <span style="font-size:12px;color:#8B8676;align-self:center;">Quick add:</span>
        ${Object.keys(WO_QUICK).map(k => `<button type="button" class="btn tiny wo-quick" data-k="${k}">+ ${escapeHtml(WO_ACTIVITY_LIB.find(a => a.key === k).title.split(' / ')[0].split(' (')[0])}</button>`).join('')}
      </div>
      ${lines.length ? `<div class="bitem-head" style="grid-template-columns:${GRID};"><span>Work item / description</span><span>Activity</span><span>Unit</span><span class="qty">Qty</span><span class="rate">Rate ₹</span><span class="qty">Amount ₹</span><span></span></div>` : `<div class="wo-lines-empty">No line items yet — use Quick add or “+ Add line item”.</div>`}
      <div id="woLineRows"></div>
      ${lines.length ? `<div class="bitem bitem-subtotal" style="grid-template-columns:${GRID};"><span class="desc">Work Order Total (ex-GST)</span><span></span><span></span><span></span><span></span><span class="amount" id="woTotalAmt">₹0</span><span></span></div>` : ''}`;
    const rows = table.querySelector('#woLineRows');
    const fmtAmt = (l) => (l.estimated_qty && l.agreed_rate) ? fmtNum(l.estimated_qty * l.agreed_rate) : '—';
    lines.forEach((l, idx) => {
      const r = document.createElement('div');
      r.className = 'bitem'; r.style.gridTemplateColumns = GRID; r.dataset.idx = idx;
      r.innerHTML = `
        <span class="desc"><input class="wo-line-desc" data-idx="${idx}" value="${escapeHtml(l.description||'')}" placeholder="e.g. Shuttering for slab and beams" style="width:100%;">
          <button type="button" class="icon-btn wo-line-note-btn" data-idx="${idx}" title="Scope note printed under this item">${l.scope_description ? '📝 note' : '+ note'}</button></span>
        <span><select class="wo-line-act" data-idx="${idx}">${actOpts(l.activity||'')}</select></span>
        <span><select class="wo-line-unit" data-idx="${idx}">${unitOpts(l.unit||'')}</select></span>
        <span><input type="number" inputmode="decimal" step="0.001" class="wo-line-qty" data-idx="${idx}" value="${l.estimated_qty||''}" placeholder="Qty"></span>
        <span><input type="number" inputmode="decimal" step="0.01" class="wo-line-rate" data-idx="${idx}" value="${l.agreed_rate||''}" placeholder="Rate"></span>
        <span class="amount" id="woAmt${idx}">${fmtAmt(l)}</span>
        <span class="del"><button type="button" class="icon-btn wo-line-del" data-idx="${idx}">✕</button></span>`;
      rows.appendChild(r);
    });
    const recompute = () => {
      let tot = 0;
      lines.forEach((l, i) => { const a = document.getElementById('woAmt' + i); if(a) a.textContent = fmtAmt(l); if(l.estimated_qty && l.agreed_rate) tot += l.estimated_qty * l.agreed_rate; });
      const t = document.getElementById('woTotalAmt'); if(t) t.textContent = '₹' + fmtNum(tot);
    };
    recompute();
    table.querySelectorAll('.wo-line-desc').forEach(inp => inp.addEventListener('input', () => {
      const l = lines[+inp.dataset.idx]; l.description = inp.value;
      if(!l.activityManual){ const k = detectActivity(inp.value); l.activity = k || ''; const sel = table.querySelector(`.wo-line-act[data-idx="${inp.dataset.idx}"]`); if(sel) sel.value = l.activity; }
      refreshWOTerms();
    }));
    table.querySelectorAll('.wo-line-act').forEach(sel => sel.addEventListener('change', () => { const l = lines[+sel.dataset.idx]; l.activity = sel.value; l.activityManual = !!sel.value; refreshWOTerms(); }));
    table.querySelectorAll('.wo-line-unit').forEach(sel => sel.addEventListener('change', () => { lines[+sel.dataset.idx].unit = sel.value; }));
    table.querySelectorAll('.wo-line-qty').forEach(inp => inp.addEventListener('input', () => { lines[+inp.dataset.idx].estimated_qty = parseFloat(inp.value) || null; recompute(); }));
    table.querySelectorAll('.wo-line-rate').forEach(inp => inp.addEventListener('input', () => { lines[+inp.dataset.idx].agreed_rate = parseFloat(inp.value) || null; recompute(); }));
    table.querySelectorAll('.wo-line-del').forEach(btn => btn.addEventListener('click', () => { lines.splice(+btn.dataset.idx, 1); renderWOLines(); }));
    table.querySelectorAll('.wo-line-note-btn').forEach(btn => btn.addEventListener('click', () => {
      const l = lines[+btn.dataset.idx];
      const val = prompt('Scope note for this item (printed under it on the Work Order):', l.scope_description || '');
      if(val !== null){ l.scope_description = val.trim() || null; renderWOLines(); }
    }));
    table.querySelectorAll('.wo-quick').forEach(btn => btn.addEventListener('click', () => {
      const [d, u] = WO_QUICK[btn.dataset.k];
      lines.push({ budget_item_id: null, description: d, activity: btn.dataset.k, unit: u, agreed_rate: null, estimated_qty: null, scope_description: null });
      renderWOLines();
      const last = table.querySelectorAll('.wo-line-qty'); if(last.length) last[last.length - 1].focus();
    }));
    refreshWOTerms();
  };
  renderWOLines();

  const addLineBtn = document.getElementById('addWOLineBtn');
  if(addLineBtn) addLineBtn.onclick = () => {
    state.newWOLines.push({ budget_item_id: null, description: '', activity: '', unit: 'P.sft', agreed_rate: null, estimated_qty: null, scope_description: null });
    renderWOLines();
    const d = document.querySelectorAll('.wo-line-desc'); if(d.length) d[d.length - 1].focus();
  };
  ['woRetention','woTds','woSafetyPct','woSafetyAmt','woGst'].forEach(id => { const el = document.getElementById(id); if(el) el.addEventListener('input', refreshWOTerms), el && el.addEventListener('change', refreshWOTerms); });
  const termsEl = woTermsEl();
  const remBtn = document.getElementById('woRemarksApply');
  if(remBtn) remBtn.onclick = async () => {
    const remarks = document.getElementById('woRemarks').value.trim(), msg = document.getElementById('woRemarksMsg');
    if(!remarks){ toast('Type your remarks first.', true); return; }
    remBtn.disabled = true; const old = remBtn.textContent; remBtn.textContent = 'Writing…'; msg.textContent = 'AI is updating the terms — takes about 20–40 seconds.';
    const ctx = { retention_pct: document.getElementById('woRetention').value, tds_pct: document.getElementById('woTds').value, gst_pct: document.getElementById('woGst').value, nature_of_work: document.getElementById('woNature').value, scope: (state.newWOLines || []).map(l => l.description).filter(Boolean) };
    let out = null, err = '';
    try{ const r = await sb.functions.invoke('wo-remarks', { body: { remarks, terms: termsEl.value, context: ctx } }); if(r.error) err = r.error.message || 'failed'; else if(r.data && r.data.terms) out = r.data.terms; else err = (r.data && r.data.error) || 'failed'; }catch(e){ err = e.message || 'failed'; }
    if(out){ termsEl.value = out; termsEl.dataset.dirty = '1'; msg.textContent = '✓ Terms updated — please read through the result below (and any "NOTE FOR REVIEW" line) before saving.'; termsEl.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    else {
      // Fallback without AI: append the remarks verbatim as numbered special conditions
      const nums = [...termsEl.value.matchAll(/^\s*(\d+)\.\s+[A-Z]/gm)].map(m => +m[1]); const n = (nums.length ? Math.max(...nums) : 0) + 1;
      const pts = remarks.split(/\n+|(?<=[.;])\s+(?=[A-Z])/).map(x => x.trim()).filter(Boolean);
      termsEl.value = termsEl.value.replace(/\s+$/, '') + `\n\n${n}. SPECIAL CONDITIONS\n` + pts.map((x, i) => `${n}.${i+1} ${x}`).join('\n') + '\n';
      termsEl.dataset.dirty = '1';
      msg.textContent = (err === 'no_key' ? 'AI is not switched on yet (API key missing) — ' : 'AI unavailable (' + err + ') — ') + 'your remarks were added as plain Special Conditions instead. Edit the wording below.';
    }
    remBtn.disabled = false; remBtn.textContent = old;
  };
  if(termsEl){
    termsEl.addEventListener('input', () => { termsEl.dataset.dirty = '1'; });
    const rb = document.getElementById('woTermsRebuild');
    if(rb) rb.onclick = () => { if(termsEl.dataset.dirty === '1' && !confirm('Replace the edited terms with freshly built ones from the current scope?')) return; termsEl.dataset.dirty = '0'; refreshWOTerms(); };
  }

  document.getElementById('cancelWOBtn').onclick = () => { state.creatingWO = false; state.editingWOId = null; state.editingWOOriginalLineIds = null; state.addingWOLine = false; renderMain(); };
  const saveWO = async (asDraft) => {
    const subcontractor_id = scIdField.value;
    let wo_ref = document.getElementById('woRef').value.trim();
    let wo_date = document.getElementById('woDate').value;
    const nature_of_work = document.getElementById('woNature').value.trim();
    const retention_pct = parseFloat(document.getElementById('woRetention').value) || 0;
    const tds_pct = parseFloat(document.getElementById('woTds').value) || 0;
    const safety_pct = parseFloat(document.getElementById('woSafetyPct').value) || 0;
    const safety_amount = parseFloat(document.getElementById('woSafetyAmt').value) || 0;
    const gst_pct = parseFloat(document.getElementById('woGst').value) || 0;
    const terms_and_conditions = document.getElementById('woTerms').value;

    if(!subcontractor_id){ toast('Select a subcontractor.', true); return; }
    if(asDraft){
      // A draft only needs a subcontractor — fill the rest with safe placeholders; incomplete lines (no rate) are left out.
      if(!wo_ref) wo_ref = 'DRAFT-' + Date.now().toString().slice(-6);
      if(!wo_date) wo_date = new Date().toISOString().slice(0,10);
      const dropped = state.newWOLines.filter(l => !(l.description||'').trim() || !l.agreed_rate).length;
      if(dropped){ state.newWOLines = state.newWOLines.filter(l => (l.description||'').trim() && l.agreed_rate); toast(dropped + ' incomplete line(s) were left out of the draft.'); }
    } else {
      if(!wo_ref){ toast('WO reference number is required.', true); return; }
      if(!wo_date){ toast('WO date is required.', true); return; }
      if(!state.newWOLines.length){ toast('Add at least one line item.', true); return; }
      if(state.newWOLines.some(l => !(l.description||'').trim())){ toast('Every line item needs a description.', true); return; }
      if(state.newWOLines.some(l => !l.estimated_qty || !l.agreed_rate)){ toast('Every line item needs a quantity and an agreed rate.', true); return; }
    }

    const saveBtn = document.getElementById(asDraft ? 'saveDraftBtn' : 'saveWOBtn');
    const btnLabel = saveBtn.textContent;
    const remarks = (document.getElementById('woRemarks').value || '').trim() || null;
    const payload = { wo_ref, wo_date, nature_of_work, retention_pct, tds_pct, safety_pct, safety_amount, gst_pct, terms_and_conditions, remarks };
    if(asDraft) payload.status = 'draft';
    else if(editing && editWO.status==='draft') payload.status = 'active';   // finishing a draft makes it a live WO

    if(editing){
      saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
      const ok = await updateWorkOrder(editingWOId, payload);
      if(ok){
        const linesOk = await reconcileWOLineItems(editingWOId, state.newWOLines, state.editingWOOriginalLineIds || new Set());
        if(linesOk){
          toast(asDraft ? 'Draft saved.' : (editWO.status==='draft' ? 'Work Order created.' : 'Work Order updated.'));
          state.editingWOId = null; state.newWOLines = []; state.editingWOOriginalLineIds = null;
          await loadWorkOrders(project.id);
          renderMain();
          return;
        }
      }
      saveBtn.disabled = false; saveBtn.textContent = btnLabel;
    } else {
      saveBtn.disabled = true; saveBtn.textContent = asDraft ? 'Saving…' : 'Creating…';
      const wo = await createWorkOrder({ project_id: project.id, subcontractor_id, ...payload });
      if(wo){
        const ok = state.newWOLines.length ? await createWOLineItems(wo.id, state.newWOLines) : true;
        if(ok){
          toast(asDraft ? 'Draft saved.' : 'Work Order created.');
          state.creatingWO = false;
          state.newWOLines = [];
          await loadWorkOrders(project.id);
          renderMain();
          return;
        }
      }
      saveBtn.disabled = false; saveBtn.textContent = btnLabel;
    }
  };
  document.getElementById('saveWOBtn').onclick = () => saveWO(false);
  const draftBtn = document.getElementById('saveDraftBtn');
  if(draftBtn) draftBtn.onclick = () => saveWO(true);
}

// Opens the edit form for an existing WO — loads full detail, pre-fills the
// line-item working set (tagging each with its real DB id so save knows
// what to update vs insert), and remembers this WO's own prior committed
// quantities so editing isn't blocked by its own existing claim.
async function openWOEditForm(woId, project){
  await loadWODetail(woId, project.id);
  if(!state.woDetail) return;
  state.newWOLines = woScopeLines(state.woDetail).slice().sort((a,b) => (a.sl_no||0) - (b.sl_no||0)).map(l => {
    const it = woLineItem(l);
    return { existingId: l.id, budget_item_id: l.budget_item_id || null, description: it.description || '', unit: it.unit || 'P.sft', activity: l.activity || '', activityManual: !!l.activity, agreed_rate: l.agreed_rate, estimated_qty: l.estimated_qty, scope_description: l.scope_description };
  });
  state.editingWOOwnQty = {};
  state.editingWOOriginalLineIds = new Set(woScopeLines(state.woDetail).map(l => l.id));
  state.editingWOId = woId;
  state.addingWOLine = false;
  renderMain();
}

async function updateWorkOrder(woId, payload){
  try{
    const { error } = await withRetry(() => sb.from('ra_work_orders').update(payload).eq('id', woId));
    if(error){
      if(error.message && /duplicate|unique/i.test(error.message)){
        toast('This WO reference already exists for this subcontractor on this project.', true);
      } else {
        toast(error.message, true);
      }
      return false;
    }
    return true;
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); return false; }
}

// Reconciles the edited line-item list against what was originally there:
// existing lines get updated in place, new ones get inserted, and anything
// removed gets deleted — unless it's already been billed, in which case the
// delete is skipped with a clear message rather than failing silently.
async function reconcileWOLineItems(woId, currentLines, originalIds){
  try{
    const keptIds = new Set(currentLines.filter(l => l.existingId).map(l => l.existingId));
    const toDelete = [...originalIds].filter(id => !keptIds.has(id));

    for(const id of toDelete){
      const { error } = await sb.from('ra_wo_line_items').delete().eq('id', id);
      if(error){
        if(error.message && /foreign key|violat/i.test(error.message)){
          toast('Couldn\'t remove one line item — it already has billing against it, so it was kept.', true);
        } else {
          toast(error.message, true);
          return false;
        }
      }
    }

    for(const line of currentLines){
      if(line.existingId){
        const { error } = await sb.from('ra_wo_line_items').update({
          description: (line.description||'').trim() || null, unit: line.unit || null, activity: line.activity || null,
          agreed_rate: line.agreed_rate, estimated_qty: line.estimated_qty, scope_description: line.scope_description || null
        }).eq('id', line.existingId);
        if(error){ toast(error.message, true); return false; }
      } else {
        const { error } = await sb.from('ra_wo_line_items').insert({
          wo_id: woId, budget_item_id: line.budget_item_id || null, sl_no: 999,
          description: (line.description||'').trim() || null, unit: line.unit || null, activity: line.activity || null,
          agreed_rate: line.agreed_rate, estimated_qty: line.estimated_qty, scope_description: line.scope_description || null
        });
        if(error){ toast(error.message, true); return false; }
      }
    }
    return true;
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); return false; }
}

async function createWorkOrder(payload){
  try{
    const { data: { user } } = await withRetry(() => sb.auth.getUser());
    const { data, error } = await withRetry(() =>
      sb.from('ra_work_orders').insert({ ...payload, created_by: user.id }).select().single()
    );
    if(error){
      if(error.message && /duplicate|unique/i.test(error.message)){
        toast('This WO reference already exists for this subcontractor on this project.', true);
      } else {
        toast(error.message, true);
      }
      return null;
    }
    return data;
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); return null; }
}

async function createWOLineItems(wo_id, lines){
  try{
    const rows = lines.map((l, idx) => ({ wo_id, budget_item_id: l.budget_item_id || null, description: (l.description||'').trim() || null, unit: l.unit || null, activity: l.activity || null, sl_no: idx+1, agreed_rate: l.agreed_rate, scope_description: l.scope_description || null, estimated_qty: l.estimated_qty || null }));
    const { error } = await withRetry(() => sb.from('ra_wo_line_items').insert(rows));
    if(error){ toast(error.message, true); return false; }
    return true;
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); return false; }
}

/* ============================================================================
   WORK ORDER — lock, soft-delete/bin (mirrors the budget-item lock and the
   bill bin patterns already used elsewhere in the app).
============================================================================ */
async function toggleWOLock(wo, project){
  const locking = !wo.billing_locked;
  let reason = null;
  if(locking){
    reason = prompt(`Lock billing for WO #${wo.order_no} (${wo.wo_ref})? Bills already submitted stay as they are, but no further bill can be submitted against this WO while locked.\n\nReason (optional):`, '');
    if(reason === null) return;
  } else {
    if(!confirm(`Unlock billing for WO #${wo.order_no}?`)) return;
  }
  try{
    const { data, error } = await withRetry(() =>
      sb.from('ra_work_orders').update({ billing_locked: locking, lock_reason: locking ? (reason.trim() || null) : null }).eq('id', wo.id).select().single()
    );
    if(error){ toast(error.message, true); return; }
    const idx = state.workOrders.findIndex(w => w.id === wo.id);
    if(idx !== -1) state.workOrders[idx] = { ...state.workOrders[idx], ...data };
    toast(locking ? 'Work Order locked — no further billing until unlocked.' : 'Work Order unlocked.');
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function deleteWorkOrder(wo, project){
  if(!confirm(`Delete WO #${wo.order_no} (${wo.wo_ref})? It'll move to the Work Order Bin and can be restored or permanently removed from there.`)) return;
  try{
    const { data: { user } } = await withRetry(() => sb.auth.getUser());
    const { error } = await withRetry(() => sb.from('ra_work_orders').update({ deleted_at: new Date().toISOString(), deleted_by: user.id }).eq('id', wo.id));
    if(error){ toast(error.message, true); return; }
    const idx = state.workOrders.findIndex(w => w.id === wo.id);
    if(idx !== -1) state.workOrders[idx] = { ...state.workOrders[idx], deleted_at: new Date().toISOString() };
    toast('Work Order moved to Bin.');
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function restoreWorkOrder(wo){
  try{
    const { error } = await withRetry(() => sb.from('ra_work_orders').update({ deleted_at: null, deleted_by: null }).eq('id', wo.id));
    if(error){ toast(error.message, true); return; }
    const idx = state.workOrders.findIndex(w => w.id === wo.id);
    if(idx !== -1) state.workOrders[idx] = { ...state.workOrders[idx], deleted_at: null };
    toast('Work Order restored.');
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function emptyWOBin(projectId){
  const binItems = state.workOrders.filter(wo => wo.deleted_at);
  if(!binItems.length){ toast('The Work Order Bin is already empty.', true); return; }
  if(!confirm(`Permanently delete all ${binItems.length} Work Order(s) in the Bin? This cannot be undone.`)) return;
  if(!confirm('Really sure? This is the last confirmation — these cannot be recovered after this.')) return;
  try{
    const ids = binItems.map(wo => wo.id);
    const { error } = await withRetry(() => sb.from('ra_work_orders').delete().in('id', ids));
    if(error){
      if(error.message && /foreign key|violat/i.test(error.message)){
        toast('Can\'t permanently delete — one or more of these Work Orders already has bills raised against it. Bills must be removed first.', true);
      } else {
        toast(error.message, true);
      }
      return;
    }
    state.workOrders = state.workOrders.filter(wo => !wo.deleted_at);
    toast('Work Order Bin emptied.');
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

/* ============================================================================
   PRINT / PDF — Work Order document, matching CCI's real letterhead format
============================================================================ */
async function printWorkOrder(woId, project){
  toast('Preparing document…');
  try{
    const { data: wo, error } = await withRetry(() =>
      sb.from('ra_work_orders')
        .select('*, ra_subcontractors(*), ra_wo_line_items(*, ra_budget_items(description, unit, budgeted_qty, stage_id))')
        .eq('id', woId).single()
    );
    if(error){ toast(error.message, true); return; }

    const sc = wo.ra_subcontractors || {};
    const lines = woScopeLines(wo);
    let total = 0;
    const rows = lines.map((l, idx) => {
      const item = woLineItem(l);
      const amount = (l.estimated_qty && l.agreed_rate) ? l.estimated_qty * l.agreed_rate : null;
      if(amount) total += amount;
      return `
        <tr>
          <td>${idx+1}</td>
          <td>
            <div><strong>${escapeHtml(item.description||'')}</strong></div>
            ${item.stage_id ? `<div class="wo-doc-scope" style="color:#1B3A6B;">${escapeHtml(getStagePath(item.stage_id))}</div>` : ''}
            ${l.scope_description ? `<div class="wo-doc-scope">${escapeHtml(l.scope_description)}</div>` : ''}
          </td>
          <td class="num">${escapeHtml(item.unit||'')}</td>
          <td class="num">${l.estimated_qty ? fmtNum(l.estimated_qty) : '—'}</td>
          <td class="num">${l.agreed_rate ? fmtNum(l.agreed_rate) : '—'}</td>
          <td class="num">${amount ? fmtNum(amount) : '—'}</td>
        </tr>`;
    }).join('');

    document.getElementById('printArea').innerHTML = `
      <div class="wo-doc">
        ${buildPrintHeader(true)}
        <div class="wo-doc-title">SUBCONTRACT WORK ORDER</div>
        <div class="wo-doc-meta">
          <div><div class="l">Order ID</div>#${wo.order_no}</div>
          <div><div class="l">Date</div>${wo.wo_date}</div>
          <div><div class="l">Reference No</div>${escapeHtml(wo.wo_ref)}</div>
        </div>
        <div class="wo-doc-parties">
          <div>
            <h4>Contractor Details</h4>
            <div class="n">${escapeHtml(sc.name||'')}</div>
            ${sc.phone ? escapeHtml(sc.phone)+'<br>' : ''}
            ${sc.pan_no ? 'PAN: '+escapeHtml(sc.pan_no)+'<br>' : ''}
            ${sc.gst_no ? 'GST: '+escapeHtml(sc.gst_no)+'<br>' : ''}
            ${sc.address ? escapeHtml(sc.address) : ''}
          </div>
          <div>
            <h4>Project Details</h4>
            <div class="n">${escapeHtml(project.name)}</div>
            ${project.location ? escapeHtml(project.location) : ''}
          </div>
        </div>

        <h3 class="section">Contract Work Details</h3>
        <table class="wo-doc-table">
          <thead><tr><th>Sl No</th><th>Description</th><th>Unit</th><th>Qty</th><th>Rate ₹</th><th>Amount ₹</th></tr></thead>
          <tbody>
            ${rows}
            <tr class="wo-doc-total-row"><td colspan="5">Total</td><td class="num">₹${fmtNum(total)}</td></tr>
          </tbody>
        </table>

        <h3 class="section">Recovery Terms</h3>
        <table class="wo-doc-table wo-doc-table-narrow">
          <tbody>
            <tr><td>Retention</td><td class="num">${wo.retention_pct}%</td></tr>
            <tr><td>TDS</td><td class="num">${wo.tds_pct}%</td></tr>
            <tr><td>Safety</td><td class="num">${wo.safety_pct ? wo.safety_pct+'%' : '₹'+fmtNum(wo.safety_amount||0)}</td></tr>
            <tr><td>GST</td><td class="num">${wo.gst_pct||0}%</td></tr>
          </tbody>
        </table>

        ${wo.remarks ? `<h3 class="section">Remarks / Special Notes</h3><div class="wo-doc-terms">${escapeHtml(wo.remarks)}</div>` : ''}
        <h3 class="section">Terms &amp; Conditions</h3>
        <div class="wo-doc-terms">${escapeHtml(wo.terms_and_conditions || '')}</div>

        <div style="margin-top:18px;font-weight:700;font-size:12.5px;">This Work Order is not valid unless signed by a CCI Representative with the Company seal.</div>
        <div class="wo-doc-sign">
          <div>Signature — Cameo Constructions &amp; Infrastructure</div>
          <div>Signature — Subcontractor</div>
        </div>
        ${buildPrintFooter()}
      </div>
    `;
    setTimeout(() => printWithFilename(`CCI SC WO ${sc.name||'Subcontractor'}-${project.name}`), 100);
  } catch(err){ toast('Could not prepare the document — please try again.', true); console.error(err); }
}

function renderStageNode(stage){
  const wrap = document.createElement('div');
  wrap.className = 'stage';
  const row = document.createElement('div');
  row.className = 'stage-row' + (state.pasteTargetStageId === stage.id ? ' paste-target' : '');
  const expanded = !!state.expanded[stage.id];
  const kids = childStages(stage.id);
  const items = itemsForStage(stage.id);
  const hasChildren = kids.length > 0 || items.length > 0;
  const directlyLocked = !!stage.billing_locked;
  const inheritedLock = !directlyLocked && isStageLockedInherited(stage.id);
  const rollupTotal = stage.category_type === 'billable' ? getStageRollupTotal(stage.id) : 0;

  row.innerHTML = `
    <span class="toggle">${hasChildren ? (expanded ? '▾' : '▸') : '·'}</span>
    <span class="stage-name">${escapeHtml(stage.name)}</span>
    <span class="badge ${stage.category_type}">${stage.category_type}</span>
    ${rollupTotal > 0 ? `<span class="stage-rollup-total">₹${fmtNum(rollupTotal)}</span>` : ''}
    ${directlyLocked ? `<span class="lock-badge lock-badge-own" title="${stage.lock_reason ? escapeHtml(stage.lock_reason) : 'Billing locked by Owner'}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:inline-block;vertical-align:-2px"><rect x="4" y="11" width="16" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Locked</span>` : ''}
    ${inheritedLock ? `<span class="lock-badge lock-badge-inherited" title="A stage above this one is locked"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:inline-block;vertical-align:-2px"><rect x="4" y="11" width="16" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Inherited</span>` : ''}
    <span class="stage-actions">
      ${canEditBudget() && stage.category_type==='billable' ? `<button class="icon-btn add-item">+ Item</button>` : ''}
      ${canEditBudget() ? `<button class="icon-btn add-sub">+ Stage</button>` : ''}
      ${canEditBudget() ? `<button class="icon-btn dup">⧉ Duplicate</button>` : ''}
      ${canEditBudget() && stage.category_type==='billable' && state.itemClipboard.length ? `<button class="icon-btn stage-paste-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:inline-block;vertical-align:-2px"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg> Paste (${state.itemClipboard.length})</button>` : ''}
      ${isOwner() ? `<button class="icon-btn stage-lock-toggle" title="${directlyLocked ? 'Unlock billing for this stage' : 'Lock billing for this stage'}">${directlyLocked ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:inline-block;vertical-align:-2px"><rect x="4" y="11" width="16" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 7.75-3.9"/></svg>' : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:inline-block;vertical-align:-2px"><rect x="4" y="11" width="16" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'}</button>` : ''}
      ${canEditBudget() ? `<button class="icon-btn del">✕</button>` : ''}
    </span>
  `;
  row.setAttribute('tabindex', '0');
  row.setAttribute('role', 'button');
  row.setAttribute('aria-expanded', String(expanded));
  const toggleFn = () => { state.expanded[stage.id] = !expanded; renderMain(); };
  row.querySelector('.toggle').onclick = toggleFn;
  row.querySelector('.stage-name').onclick = toggleFn;
  row.addEventListener('keydown', e => {
    // Only act when the row itself is focused, not a button inside it (those handle their own Enter/Space natively).
    if(e.target !== row) return;
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleFn(); }
    if(e.key === 'ArrowRight' && !expanded){ e.preventDefault(); toggleFn(); }
    if(e.key === 'ArrowLeft' && expanded){ e.preventDefault(); toggleFn(); }
  });
  const addItemBtn = row.querySelector('.add-item'); if(addItemBtn) addItemBtn.onclick = () => { state.addingItemToStage = (state.addingItemToStage === stage.id) ? null : stage.id; state.expanded[stage.id] = true; renderMain(); setTimeout(() => document.querySelector(`[data-stage="${stage.id}"] .bi-desc`)?.focus(), 30); };
  const addSubBtn = row.querySelector('.add-sub'); if(addSubBtn) addSubBtn.onclick = () => { state.addingStageTo = (state.addingStageTo && state.addingStageTo.parentId === stage.id) ? null : { projectId: stage.project_id, parentId: stage.id }; state.expanded[stage.id] = true; renderMain(); };
  const dupBtn = row.querySelector('.dup'); if(dupBtn) dupBtn.onclick = () => duplicateStage(stage);
  const delBtn = row.querySelector('.del'); if(delBtn) delBtn.onclick = () => { if(confirm(`Delete "${stage.name}" and everything under it?`)) deleteStage(stage.id); };
  const lockBtn = row.querySelector('.stage-lock-toggle'); if(lockBtn) lockBtn.onclick = () => toggleStageLock(stage);
  const pasteBtn = row.querySelector('.stage-paste-btn'); if(pasteBtn) pasteBtn.onclick = () => pasteItemsIntoStage(stage);
  row.addEventListener('click', () => { state.pasteTargetStageId = stage.id; });

  wrap.appendChild(row);

  if(expanded){
    const showTable = items.length > 0 || state.addingItemToStage === stage.id;
    if(showTable){
      const itemsWrap = document.createElement('div');
      itemsWrap.className = 'budget-items';
      itemsWrap.innerHTML = `<div class="bitem-head"><span>Item</span><span>Unit</span><span class="qty">Qty</span><span class="rate">Rate</span><span class="amount">Amount</span><span></span></div>`;
      let subtotal = 0, unpriced = 0;
      items.forEach(it=>{
        const lineValue = it.budgeted_rate ? it.budgeted_qty * it.budgeted_rate : null;
        if(lineValue !== null) subtotal += lineValue; else unpriced++;

        if(state.editingItemId === it.id){
          const editRow = document.createElement('div');
          editRow.className = 'bitem bitem-add';
          editRow.style.gridTemplateColumns = '1fr 50px 85px 90px 95px 86px';
          editRow.innerHTML = `
            <input class="ei-desc" value="${escapeHtml(it.description)}">
            <select class="ei-unit">
              ${ALLOWED_UNITS.map(u => `<option value="${u}" ${u===it.unit?'selected':''}>${u}</option>`).join('')}
            </select>
            <input class="ei-qty" type="number" inputmode="decimal" step="0.001" value="${it.budgeted_qty}">
            <input class="ei-rate" type="number" inputmode="decimal" step="0.01" value="${it.budgeted_rate||''}">
            <span></span>
            <span class="bi-add-actions"><button class="icon-btn ei-save" title="Save"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="display:inline-block;vertical-align:-2px"><path d="M20 6 9 17l-5-5"/></svg></button><button class="icon-btn ei-cancel" title="Cancel">✕</button></span>
          `;
          const descI = editRow.querySelector('.ei-desc');
          const unitI = editRow.querySelector('.ei-unit');
          const qtyI = editRow.querySelector('.ei-qty');
          const rateI = editRow.querySelector('.ei-rate');
          const saveEdit = async () => {
            const description = descI.value.trim();
            const unit = unitI.value;
            const qty = parseFloat(qtyI.value);
            const rate = rateI.value ? parseFloat(rateI.value) : null;
            if(!description || isNaN(qty)){ toast('Description and quantity are required.', true); return; }
            const ok = await updateBudgetItem(it.id, description, unit, qty, rate);
            if(ok){ state.editingItemId = null; renderMain(); }
          };
          editRow.querySelector('.ei-save').onclick = saveEdit;
          editRow.querySelector('.ei-cancel').onclick = () => { state.editingItemId = null; renderMain(); };
          [descI, unitI, qtyI, rateI].forEach(inp => {
            inp.addEventListener('keydown', e => {
              if(e.key === 'Enter'){ e.preventDefault(); saveEdit(); }
              if(e.key === 'Escape'){ state.editingItemId = null; renderMain(); }
            });
          });
          itemsWrap.appendChild(editRow);
          return;
        }

        const r = document.createElement('div');
        r.className = 'bitem';
        const itemLocked = !!it.billing_locked;
        const itemInheritedLock = !itemLocked && isStageLockedInherited(it.stage_id);
        r.innerHTML = `
          <span class="desc">${canEditBudget() ? `<input type="checkbox" class="bi-select-cb" data-item="${it.id}" ${state.selectedItemIds.has(it.id)?'checked':''}>` : ''}${escapeHtml(it.description)}${itemLocked ? ` <span class="lock-badge lock-badge-own" title="${it.lock_reason?escapeHtml(it.lock_reason):'Billing locked by Owner'}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:inline-block;vertical-align:-2px"><rect x="4" y="11" width="16" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>` : ''}${itemInheritedLock ? ` <span class="lock-badge lock-badge-inherited" title="Locked via its WBS stage"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:inline-block;vertical-align:-2px"><rect x="4" y="11" width="16" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>` : ''}</span>
          <span class="unit">${escapeHtml(it.unit)}</span>
          <span class="qty">${fmtNum(it.budgeted_qty)}</span>
          <span class="rate">${it.budgeted_rate ? '₹'+fmtNum(it.budgeted_rate) : '—'}</span>
          <span class="amount">${lineValue !== null ? '₹'+fmtNum(lineValue) : '—'}</span>
          <span class="del">${canEditBudget() ? `<button class="icon-btn edit-item" title="Edit"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:inline-block;vertical-align:-1px"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>` : ''}${isOwner() ? `<button class="icon-btn item-lock-toggle" title="${itemLocked?'Unlock this item':'Lock this item'}">${itemLocked?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:inline-block;vertical-align:-2px"><rect x="4" y="11" width="16" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 7.75-3.9"/></svg>':'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:inline-block;vertical-align:-2px"><rect x="4" y="11" width="16" height="10" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'}</button>` : ''}${canEditBudget() ? `<button class="icon-btn">✕</button>` : ''}</span>
        `;
        const editBtn = r.querySelector('.edit-item');
        if(editBtn) editBtn.onclick = () => { state.editingItemId = it.id; renderMain(); };
        const lockBtn = r.querySelector('.item-lock-toggle');
        if(lockBtn) lockBtn.onclick = () => toggleBudgetItemLock(it);
        const cb = r.querySelector('.bi-select-cb');
        if(cb) cb.onclick = (e) => {
          e.stopPropagation();
          if(cb.checked) state.selectedItemIds.add(it.id); else state.selectedItemIds.delete(it.id);
          updateCopyToolbar();
        };
        const db = r.querySelector('.del button:last-child');
        if(db) db.onclick = () => { if(confirm(`Delete "${it.description}"? This can't be undone.`)) deleteBudgetItem(it.id); };
        itemsWrap.appendChild(r);
      });

      if(items.length && canEditBudget() && stage.category_type==='billable' && state.addingItemToStage !== stage.id){
        const addTrigger = document.createElement('div');
        addTrigger.className = 'bitem-add-trigger';
        addTrigger.innerHTML = `<button class="icon-btn">+ Add item</button>`;
        addTrigger.querySelector('button').onclick = () => { state.addingItemToStage = stage.id; state.expanded[stage.id] = true; renderMain(); setTimeout(() => document.querySelector(`[data-stage="${stage.id}"] .bi-desc`)?.focus(), 30); };
        itemsWrap.appendChild(addTrigger);
      }

      if(state.addingItemToStage === stage.id){
        const addRow = document.createElement('div');
        addRow.className = 'bitem bitem-add';
        addRow.innerHTML = `
          <div class="bi-desc-wrap">
            <input class="bi-desc" placeholder="Select a standard task or type your own" autocomplete="off">
          </div>
          <select class="bi-unit">
            <option value="" disabled selected>Unit</option>
            <option value="m">m</option>
            <option value="m2">m2</option>
            <option value="m3">m3</option>
            <option value="nos">nos</option>
            <option value="Hrs">Hrs</option>
            <option value="days">days</option>
            <option value="months">months</option>
            <option value="Ls">Ls</option>
            <option value="MT">MT</option>
            <option value="kg">kg</option>
            <option value="P.sft">P.sft</option>
          </select>
          <input class="bi-qty" type="number" inputmode="decimal" step="0.001" placeholder="Qty">
          <input class="bi-rate" type="number" inputmode="decimal" step="0.01" placeholder="Rate ₹">
          <span class="bi-amount-preview">—</span>
          <span class="bi-add-actions"><button class="icon-btn bi-save" title="Add"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="display:inline-block;vertical-align:-2px"><path d="M20 6 9 17l-5-5"/></svg></button><button class="icon-btn bi-cancel" title="Cancel">✕</button></span>
        `;
        const descWrap = addRow.querySelector('.bi-desc-wrap');
        const descInput = addRow.querySelector('.bi-desc');
        const unitInput = addRow.querySelector('.bi-unit');
        const qtyInput = addRow.querySelector('.bi-qty');
        const rateInput = addRow.querySelector('.bi-rate');
        const amountPreview = addRow.querySelector('.bi-amount-preview');

        const updateAmountPreview = () => {
          const q = parseFloat(qtyInput.value), r = parseFloat(rateInput.value);
          amountPreview.textContent = (!isNaN(q) && !isNaN(r)) ? '₹'+fmtNum(q*r) : '—';
        };
        qtyInput.addEventListener('input', updateAmountPreview);
        rateInput.addEventListener('input', updateAmountPreview);

        // Custom suggestion dropdown (fully styled, no native datalist rendering issues)
        let suggestBox = null;
        let suggestActiveIndex = -1;
        const closeSuggest = () => { if(suggestBox){ suggestBox.remove(); suggestBox = null; suggestActiveIndex = -1; } };
        const selectSuggestion = (name) => {
          descInput.value = name;
          unitInput.value = TASK_UNIT_MAP[name];
          closeSuggest();
          qtyInput.focus();
        };
        const setActiveSuggest = (idx) => {
          if(!suggestBox) return;
          const children = [...suggestBox.children];
          children.forEach(c => c.classList.remove('active'));
          if(idx >= 0 && idx < children.length){
            children[idx].classList.add('active');
            children[idx].scrollIntoView({ block: 'nearest' });
          }
          suggestActiveIndex = idx;
        };
        const openSuggest = () => {
          closeSuggest();
          const q = descInput.value.trim().toLowerCase();
          const matches = Object.keys(TASK_UNIT_MAP)
            .filter(name => !q || name.toLowerCase().includes(q))
            .slice(0, 8);
          if(!matches.length) return;
          suggestBox = document.createElement('div');
          suggestBox.className = 'bi-suggest';
          matches.forEach(name => {
            const item = document.createElement('div');
            item.className = 'bi-suggest-item';
            item.innerHTML = `<span>${escapeHtml(name)}</span><span class="u">${escapeHtml(TASK_UNIT_MAP[name])}</span>`;
            item.onmousedown = (e) => { e.preventDefault(); selectSuggestion(name); };
            suggestBox.appendChild(item);
          });
          descWrap.appendChild(suggestBox);
        };
        descInput.addEventListener('focus', openSuggest);
        descInput.addEventListener('input', () => {
          const match = TASK_UNIT_MAP[descInput.value.trim()];
          if(match) unitInput.value = match;
          openSuggest();
        });
        descInput.addEventListener('blur', () => setTimeout(closeSuggest, 120));

        const commit = async () => {
          const description = descInput.value.trim();
          const unit = unitInput.value.trim();
          const qty = parseFloat(qtyInput.value);
          const rate = rateInput.value ? parseFloat(rateInput.value) : null;
          if(!description || !unit || isNaN(qty)){ toast('Description, unit and quantity are required.', true); return; }
          addRow.querySelector('.bi-save').disabled = true;
          const created = await createBudgetItem(stage.id, description, unit, qty, rate);
          addRow.querySelector('.bi-save').disabled = false;
          if(created){
            // Optimistic local update — no network round-trip, no reload flicker.
            state.budgetItems.push(created);
            if(state.budgetSummary && rate){
              const val = qty * rate;
              state.budgetSummary.total_budget_value = (Number(state.budgetSummary.total_budget_value)||0) + val;
              state.budgetSummary.remaining_value = (Number(state.budgetSummary.remaining_value)||0) + val;
            }
            state.addingItemToStage = stage.id; // keep the row open for fast repeated entry
            state.expanded[stage.id] = true;
            renderMain();
            setTimeout(() => document.querySelector(`[data-stage="${stage.id}"] .bi-desc`)?.focus(), 30);
          }
        };
        addRow.querySelector('.bi-save').onclick = commit;
        addRow.querySelector('.bi-cancel').onclick = () => { state.addingItemToStage = null; renderMain(); };

        // Spreadsheet-style flow: Enter moves to the next field (Desc -> Unit -> Qty -> Rate),
        // only committing from the last field — so pressing Enter mid-row never throws a
        // "fill this in" error, it just moves you forward like Tab would in Excel.
        descInput.addEventListener('keydown', e => {
          if(suggestBox){
            if(e.key === 'ArrowDown'){ e.preventDefault(); setActiveSuggest(Math.min(suggestActiveIndex + 1, suggestBox.children.length - 1)); return; }
            if(e.key === 'ArrowUp'){ e.preventDefault(); setActiveSuggest(Math.max(suggestActiveIndex - 1, 0)); return; }
            if(e.key === 'Enter' && suggestActiveIndex >= 0){
              e.preventDefault();
              selectSuggestion(suggestBox.children[suggestActiveIndex].querySelector('span').textContent);
              return;
            }
          }
          if(e.key === 'Enter'){ e.preventDefault(); unitInput.focus(); }
          if(e.key === 'Escape'){
            if(suggestBox){ closeSuggest(); } else { state.addingItemToStage = null; renderMain(); }
          }
        });
        unitInput.addEventListener('keydown', e => {
          if(e.key === 'Enter'){ e.preventDefault(); qtyInput.focus(); }
          if(e.key === 'Escape'){ state.addingItemToStage = null; renderMain(); }
        });
        unitInput.addEventListener('change', () => qtyInput.focus());
        qtyInput.addEventListener('keydown', e => {
          if(e.key === 'Enter'){ e.preventDefault(); rateInput.focus(); }
          if(e.key === 'Escape'){ state.addingItemToStage = null; renderMain(); }
        });
        rateInput.addEventListener('keydown', e => {
          if(e.key === 'Enter'){ e.preventDefault(); commit(); }
          if(e.key === 'Escape'){ state.addingItemToStage = null; renderMain(); }
        });
        // Tab out of the last field (Rate) also commits and jumps straight to a fresh line.
        rateInput.addEventListener('keydown', e => {
          if(e.key === 'Tab' && !e.shiftKey){ e.preventDefault(); commit(); }
        });
        addRow.setAttribute('data-stage', stage.id);
        itemsWrap.appendChild(addRow);
      }

      if(items.length){
        const subRow = document.createElement('div');
        subRow.className = 'bitem bitem-subtotal';
        subRow.innerHTML = `
          <span class="desc">Stage subtotal${unpriced ? ` <span class="unpriced-note">(${unpriced} item${unpriced>1?'s':''} unpriced, excluded)</span>` : ''}</span>
          <span></span><span></span><span></span>
          <span class="amount">₹${fmtNum(subtotal)}</span>
          <span></span>
        `;
        itemsWrap.appendChild(subRow);
      }
      wrap.appendChild(itemsWrap);
    }
    if(state.addingStageTo && state.addingStageTo.parentId === stage.id){
      wrap.appendChild(renderStageAddRow(stage.project_id, stage.id));
    }
    kids.forEach(k => wrap.appendChild(renderStageNode(k)));
  }
  return wrap;
}

function renderStageAddRow(projectId, parentId){
  const wrap = document.createElement('div');
  wrap.className = 'stage-add-row';
  wrap.innerHTML = `
    <input class="stage-add-name" placeholder="Stage name, e.g. 2nd Floor, North Face" autocomplete="off">
    <div class="stage-add-radios">
      <label><input type="radio" name="stageAddType${parentId||'root'}" value="billable" checked> Billable</label>
      <label><input type="radio" name="stageAddType${parentId||'root'}" value="internal"> Internal</label>
    </div>
    <div class="bi-add-actions">
      <button class="icon-btn bi-save" title="Add"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="display:inline-block;vertical-align:-2px"><path d="M20 6 9 17l-5-5"/></svg></button>
      <button class="icon-btn bi-cancel" title="Cancel">✕</button>
    </div>
  `;
  const nameInput = wrap.querySelector('.stage-add-name');
  const commit = async () => {
    const name = nameInput.value.trim();
    const type = wrap.querySelector(`input[name="stageAddType${parentId||'root'}"]:checked`).value;
    if(!name){ toast('Stage name is required.', true); return; }
    wrap.querySelector('.bi-save').disabled = true;
    const s = await createStage(projectId, parentId, name, type);
    wrap.querySelector('.bi-save').disabled = false;
    if(s){
      // Optimistic — push straight into local state instead of re-fetching
      // everything from Supabase. This is what was making it feel slow.
      state.stages.push(s);
      if(parentId) state.expanded[parentId] = true;
      state.expanded[s.id] = true;
      state.addingStageTo = null;
      renderMain();
    }
  };
  wrap.querySelector('.bi-save').onclick = commit;
  wrap.querySelector('.bi-cancel').onclick = () => { state.addingStageTo = null; renderMain(); };
  nameInput.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ e.preventDefault(); commit(); }
    if(e.key === 'Escape'){ state.addingStageTo = null; renderMain(); }
  });
  setTimeout(() => nameInput.focus(), 30);
  return wrap;
}

async function deleteProject(project){
  const confirmed = confirm(`Delete "${project.name}"? It'll move to the Bin — its WBS, budget, Work Orders, and Bills stay fully intact and can be restored, or permanently removed from the Bin.`);
  if(!confirmed) return;
  try{

    await loadProjects();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function loadProjectBin(){
  try{
    const { data, error } = await withRetry(() => sb.from('ra_projects').select('*').not('deleted_at', 'is', null).order('deleted_at', { ascending: false }));
    if(error){ toast(error.message, true); state.projectBin = []; return; }
    state.projectBin = data || [];
  } catch(err){ toast('Could not load the Bin — please try again.', true); console.error(err); state.projectBin = []; }
}

async function restoreProject(project){
  try{
    const { error } = await withRetry(() => sb.from('ra_projects').update({ deleted_at: null, deleted_by: null }).eq('id', project.id));
    if(error){ toast(error.message, true); return; }
    toast('Project restored.');
    state.projectBin = state.projectBin.filter(p => p.id !== project.id);
    await loadProjects();
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function emptyProjectBin(){
  if(!state.projectBin.length){ toast('The Project Bin is already empty.', true); return; }
  if(!confirm(`Permanently delete all ${state.projectBin.length} project(s) in the Bin? This cannot be undone.`)) return;
  if(!confirm('Really sure? This is the last confirmation — these cannot be recovered after this.')) return;
  try{
    const ids = state.projectBin.map(p => p.id);
    const { error } = await withRetry(() => sb.from('ra_projects').delete().in('id', ids));
    if(error){
      if(error.message && /foreign key|violat/i.test(error.message)){
        toast('Can\'t permanently delete — one or more of these projects still has Work Orders in it. Remove those first.', true);
      } else {
        toast(error.message, true);
      }
      return;
    }
    state.projectBin = [];
    toast('Project Bin emptied.');
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function toggleStageLock(stage){
  const locking = !stage.billing_locked;
  let reason = null;
  if(locking){
    reason = prompt(`Lock billing for "${stage.name}" and everything under it? Work Orders can still be created, but no bill can be submitted against this stage while locked.\n\nReason (optional):`, '');
    if(reason === null) return; // cancelled
  } else {
    if(!confirm(`Unlock billing for "${stage.name}"?`)) return;
  }
  try{
    const { data, error } = await withRetry(() =>
      sb.from('ra_wbs_stages').update({ billing_locked: locking, lock_reason: locking ? (reason.trim() || null) : null }).eq('id', stage.id).select().single()
    );
    if(error){ toast(error.message, true); return; }
    const idx = state.stages.findIndex(s => s.id === stage.id);
    if(idx !== -1) state.stages[idx] = data;
    toast(locking ? 'Stage locked — billing frozen for this stage and everything under it.' : 'Stage unlocked.');
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

/* ============================================================================
   BUDGET ITEM COPY / PASTE — Excel/MS-Project-style: tick rows, Ctrl+C,
   click into another stage, Ctrl+V. Also writes real tab-separated text to
   the OS clipboard, so pasting into an actual spreadsheet works too.
============================================================================ */
function updateCopyToolbar(){
  const el = document.getElementById('copyToolbar');
  if(!el) return;
  const n = state.selectedItemIds.size;
  if(!n){ el.innerHTML = ''; return; }
  el.innerHTML = `
    <button class="btn tiny" id="copySelectedBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:inline-block;vertical-align:-2px"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></svg> Copy (${n})</button>
    <button class="btn tiny" id="clearSelectionBtn">Clear</button>
  `;
  document.getElementById('copySelectedBtn').onclick = copySelectedItems;
  document.getElementById('clearSelectionBtn').onclick = () => { state.selectedItemIds.clear(); renderMain(); };
}

function copySelectedItems(){
  const items = state.budgetItems.filter(b => state.selectedItemIds.has(b.id));
  if(!items.length) return;
  state.itemClipboard = items.map(it => ({
    description: it.description, unit: it.unit, budgeted_qty: it.budgeted_qty, budgeted_rate: it.budgeted_rate
  }));
  // Also copy as real tab-separated text so a paste into actual Excel works too.
  const text = state.itemClipboard.map(it => [it.description, it.unit, it.budgeted_qty, it.budgeted_rate||''].join('\t')).join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(() => {});
  }
  toast(`Copied ${items.length} item${items.length!==1?'s':''} — click into any stage and paste (Ctrl+V) or use the Paste button there.`);
  state.selectedItemIds.clear();
  renderMain();
}

async function pasteItemsIntoStage(stage){
  if(!state.itemClipboard.length){ toast('Nothing copied yet — tick some items first.', true); return; }
  const toCreate = state.itemClipboard;
  state.itemClipboard = []; // consume on paste, matches normal clipboard-app expectations well enough here
  toast(`Pasting ${toCreate.length} item${toCreate.length!==1?'s':''}…`);
  for(const it of toCreate){
    const created = await createBudgetItem(stage.id, it.description, it.unit, it.budgeted_qty, it.budgeted_rate);
    if(created) state.budgetItems.push(created);
  }
  state.expanded[stage.id] = true;
  toast('Pasted.');
  renderMain();
}

// Global Ctrl/Cmd+C / Ctrl/Cmd+V — only acts on Budget Setup, and only when
// focus isn't inside a text field (so normal copy/paste in inputs still works).
document.addEventListener('keydown', (e) => {
  if(state.appView !== 'projects' || state.activeTab !== 'budget') return;
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const mod = e.ctrlKey || e.metaKey;
  if(!mod) return;
  if(e.key === 'c' || e.key === 'C'){
    if(state.selectedItemIds.size){ e.preventDefault(); copySelectedItems(); }
  } else if(e.key === 'v' || e.key === 'V'){
    if(state.itemClipboard.length && state.pasteTargetStageId){
      e.preventDefault();
      const stage = state.stages.find(s => s.id === state.pasteTargetStageId);
      if(stage && stage.category_type === 'billable') pasteItemsIntoStage(stage);
      else toast('Click into a billable stage first, then paste.', true);
    }
  }
});

async function deleteStage(stageId){
  try{
    const { error } = await withRetry(() => sb.from('ra_wbs_stages').delete().eq('id', stageId));
    if(error){ toast(error.message, true); return; }
    // Optimistic — the delete cascades in the DB (stage's children + budget
    // items go with it), so mirror that locally instead of a full reload.
    const toRemove = new Set([stageId]);
    let changed = true;
    while(changed){
      changed = false;
      state.stages.forEach(s => { if(toRemove.has(s.parent_stage_id) && !toRemove.has(s.id)){ toRemove.add(s.id); changed = true; } });
    }
    state.stages = state.stages.filter(s => !toRemove.has(s.id));
    state.budgetItems = state.budgetItems.filter(b => !toRemove.has(b.stage_id));
    toast('Stage deleted.');
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function createBudgetItem(stage_id, description, unit, budgeted_qty, budgeted_rate){
  try{
    const { data: { user } } = await withRetry(() => sb.auth.getUser());
    const { data, error } = await withRetry(() =>
      sb.from('ra_budget_items').insert({ stage_id, description, unit, budgeted_qty, budgeted_rate, created_by: user.id }).select().single()
    );
    if(error){ toast(error.message, true); return null; }
    return data;
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); return null; }
}

async function updateBudgetItem(id, description, unit, budgeted_qty, budgeted_rate){
  const before = state.budgetItems.find(b => b.id === id);
  const beforeValue = (before && before.budgeted_rate) ? before.budgeted_qty * before.budgeted_rate : 0;
  try{
    const { data, error } = await withRetry(() =>
      sb.from('ra_budget_items').update({ description, unit, budgeted_qty, budgeted_rate }).eq('id', id).select().single()
    );
    if(error){ toast(error.message, true); return false; }
    const idx = state.budgetItems.findIndex(b => b.id === id);
    if(idx !== -1) state.budgetItems[idx] = data;
    if(state.budgetSummary){
      const afterValue = data.budgeted_rate ? data.budgeted_qty * data.budgeted_rate : 0;
      const delta = afterValue - beforeValue;
      state.budgetSummary.total_budget_value = Math.max(0, (Number(state.budgetSummary.total_budget_value)||0) + delta);
      state.budgetSummary.remaining_value = Math.max(0, (Number(state.budgetSummary.remaining_value)||0) + delta);
    }
    toast('Budget item updated.');
    return true;
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); return false; }
}

async function deleteBudgetItem(id){
  const item = state.budgetItems.find(b => b.id === id);
  try{
    const { error } = await withRetry(() => sb.from('ra_budget_items').delete().eq('id', id));
    if(error){
      if(error.message && /foreign key|violat/i.test(error.message)){
        toast('Can\'t delete — this item is already linked to a Work Order (billing has started against it).', true);
      } else {
        toast(error.message, true);
      }
      return;
    }
    state.budgetItems = state.budgetItems.filter(b => b.id !== id);
    if(state.budgetSummary && item && item.budgeted_rate){
      const val = item.budgeted_qty * item.budgeted_rate;
      state.budgetSummary.total_budget_value = Math.max(0, (Number(state.budgetSummary.total_budget_value)||0) - val);
      state.budgetSummary.remaining_value = Math.max(0, (Number(state.budgetSummary.remaining_value)||0) - val);
    }
    toast('Budget item removed.');
    renderMain();
  } catch(err){ toast('Could not reach the server — please try again.', true); console.error(err); }
}

async function duplicateStage(stage){
  const newName = prompt('Name for the duplicated stage (e.g. next floor):', nextFloorGuess(stage.name));
  if(!newName) return;
  toast('Duplicating…');
  await cloneStageRecursive(stage, stage.parent_stage_id, newName);
  await loadProjectDetail(state.selectedProjectId);
  toast('Stage duplicated.');
}

async function cloneStageRecursive(stage, newParentId, nameOverride){
  const newStage = await createStage(stage.project_id, newParentId, nameOverride || stage.name, stage.category_type);
  if(!newStage) return;
  const items = itemsForStage(stage.id);
  for(const it of items){
    await createBudgetItem(newStage.id, it.description, it.unit, it.budgeted_qty, it.budgeted_rate);
  }
  const kids = childStages(stage.id);
  for(const k of kids){
    await cloneStageRecursive(k, newStage.id, null);
  }
}

function nextFloorGuess(name){
  const m = name.match(/(\d+)(st|nd|rd|th)?\s*Floor/i);
  if(m){ const n = parseInt(m[1],10)+1; return name.replace(m[0], n + ordinal(n) + ' Floor'); }
  return name + ' (copy)';
}
function ordinal(n){ const s=['th','st','nd','rd']; const v=n%100; return (s[(v-20)%10]||s[v]||s[0]); }

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Simple 10-per-page pagination — returns the page's slice plus a small
   Prev/Next control block. Used for Work Orders and Bills lists so they stay
   usable once there are dozens of entries instead of an endless scroll. */
function paginate(array, page, perPage){
  perPage = perPage || 10;
  const totalPages = Math.max(1, Math.ceil(array.length / perPage));
  const safePage = Math.min(Math.max(1, page), totalPages);
  const start = (safePage - 1) * perPage;
  return { items: array.slice(start, start + perPage), page: safePage, totalPages, total: array.length };
}
function renderPaginationControls(containerId, page, totalPages, onChange){
  const el = document.getElementById(containerId);
  if(!el) return;
  if(totalPages <= 1){ el.innerHTML = ''; return; }
  el.innerHTML = `
    <button class="btn tiny" id="${containerId}-prev" ${page<=1?'disabled':''}>← Prev</button>
    <span class="pg-status">Page ${page} of ${totalPages}</span>
    <button class="btn tiny" id="${containerId}-next" ${page>=totalPages?'disabled':''}>Next →</button>
  `;
  const prevBtn = document.getElementById(`${containerId}-prev`);
  const nextBtn = document.getElementById(`${containerId}-next`);
  if(prevBtn) prevBtn.onclick = () => onChange(page - 1);
  if(nextBtn) nextBtn.onclick = () => onChange(page + 1);
}
function fmtNum(n){ return Number(n).toLocaleString('en-IN', { maximumFractionDigits: 3 }); }

/* ============================================================================
   EXPORT — CSV download and printable PDF, reused across Subcontractors,
   Budget Setup, and Work Orders.
============================================================================ */
function downloadCSV(filename, headers, rows){
  const esc = (v) => {
    if(v === null || v === undefined) return '';
    const s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [headers.join(',')];
  rows.forEach(r => lines.push(headers.map(h => esc(r[h])).join(',')));
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSV downloaded.');
}

  return `<div class="wo-doc-footer-safety">MAKE SAFETY PERSONAL</div>`;
}
// Sets the browser's suggested "Save as PDF" filename by changing the page
// title right before printing, then restores it afterward.
function printWithFilename(filename){
  const prevTitle = document.title;
  document.title = filename;
  window.print();
  setTimeout(() => { document.title = prevTitle; }, 1000);
}

function printTable(title, subtitle, headers, rows, filename){
  const thead = `<tr>${headers.map(h => `<th>${escapeHtml(h)}</th>`).join('')}</tr>`;
  const tbody = rows.map(r => `<tr>${headers.map(h => `<td>${escapeHtml(r[h] ?? '')}</td>`).join('')}</tr>`).join('');
  document.getElementById('printArea').innerHTML = `
    <div class="wo-doc">
      ${buildPrintHeader(false)}
      <div class="wo-doc-title">${escapeHtml(title)}</div>
      ${subtitle ? `<div style="text-align:center;font-size:11px;color:#888;margin-bottom:16px;">${escapeHtml(subtitle)}</div>` : ''}
      <table class="wo-doc-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>
      ${buildPrintFooter()}
    </div>
  `;
  setTimeout(() => printWithFilename(filename || title), 100);
}
let toastTimer;
function toast(msg, isErr){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 3200);
}
</script>
